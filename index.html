<body><div class="layout"><aside class="sidebar"><div class="brand"><div class="logo">공</div><strong>공부루틴</strong></div><nav id="nav" class="nav"></nav><div class="side-note">로그인하면 계정에 자동 저장돼요.<br>상단의 서버 저장 상태를 확인하세요.</div></aside><main class="main"><header class="top"><div><div class="eyebrow">공부루틴</div><h1 id="page-title">오늘의 공부</h1><p id="page-desc">조금 늦어져도 괜찮아요. 남은 일정은 자동으로 다시 계산해요.</p></div><div class="date-tag" id="current-date"></div></header><div id="cloud-account" class="card" style="margin-bottom:18px" aria-live="polite"></div><div id="content"></div></main></div><nav class="mobile-nav" id="mobile-nav"></nav><div id="plan-panel-root"></div><div id="modals"></div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LOCAL_KEY='gongsi-routine-demo-v2';let saveWarned=false;let view='today', dayIndex=0, active=null, pending=null, tickHandle=null, filter='all', reportDate=dateISO(new Date());
const names={english:'영어',law:'행정법',admin:'행정학',korean:'국어'};const colors={english:'#527EC6',law:'#9385BA',admin:'#D4A267',korean:'#88A38B'};
function dateISO(d){let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};function addDays(s,n){let a=new Date(s+'T12:00:00');a.setDate(a.getDate()+n);return dateISO(a)};function fmtDate(s){let d=new Date(s+'T12:00:00');return `${d.getMonth()+1}/${d.getDate()} (${['일','월','화','수','목','금','토'][d.getDay()]})`};function mins(s){let [a,b]=String(s).split(':').map(Number);return a*60+b};function clock(n){if(n>=1440)return '익일 '+clock(n-1440);if(n<0)return clock(n+1440);return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`};function dur(n){return n>=60?`${Math.floor(n/60)}시간${n%60?` ${n%60}분`:''}`:`${n}분`};function id(){return `x${Math.random().toString(36).slice(2,9)}`}
const defaults={wake:'08:00',lunch:'12:00',dinner:'17:00',sleep:'23:00',breakMin:15};
function makeEvents(cfg,idx){let w=mins(cfg.wake),l=mins(cfg.lunch),d=mins(cfg.dinner),s=mins(cfg.sleep);function e(kind,name,start,duration,subject,items){return {id:id(),kind,name,start,duration,subject:subject||'',items:(items||[]).map(t=>({id:id(),name:t,checked:false})),done:false,extra:0,actual:0,logs:[]}};
return [
e('routine','기상 · 씻기',w,30),e('routine','아침 식사 · 가벼운 인강',w+30,30),
e('study','이동기 영단어',w+60,45,'english',[`VOCA DAY ${idx+1} 신규 암기`,'전날·3일 전 단어 복습']),
e('study','로즈리 기초문법',w+105,60,'english',[`Grammar Holic ${idx+1}강`,'중요 예문 3개 직접 분석']),
e('break','쉬는 시간',w+165,cfg.breakMin),
e('study','이동기 문법 500제',w+165+cfg.breakMin,60,'english',['배운 문법 미니 기본서 확인','관련 기본문제 5~10개']),
e('meal','점심 식사',l,60),
e('study','써니 행정법',l+60,90,'law',['기본이론 1강 내외','핵심 개념 3개 복습·OX 5문제']),
e('break','쉬는 시간',l+150,cfg.breakMin),
e('study','행정학',l+150+cfg.breakMin,90,'admin',['기본이론 1강 내외','핵심 개념 3개 복습·단원 5문제']),
e('break','쉬는 시간',l+240+cfg.breakMin,cfg.breakMin),
e('study','이동기 구문 해석',d-30,30,'english',['직접 해석 3~5문장','해설과 비교']),
e('meal','저녁 식사',d,60),
e('study','구문 복습',d+60,15,'english',['틀린 문장 2~3개 다시 해석']),
e('study','국어 논리추론',d+75,30,'korean',['조건·전제 추론 3~5문제']),
e('flex','free time',d+105,Math.max(0,s-30-(d+105))),
e('routine','취침 준비',s-30,30),
e('sleep','취침',s,0)
]}
function createState(){let start=dateISO(new Date());let settings={...defaults};return {settings,dayStart:start,days:[0,1,2].map(i=>({date:addDays(start,i),events:makeEvents(settings,i),note:''})),logs:[],archivedDays:{},chat:[{role:'ai',text:'변경할 과목과 시간을 입력해주세요. 수정안을 확인한 뒤 현재 3일 계획에 적용할 수 있어요.\n\n예: “영어 30분 늘려줘”, “국어 15분 줄여줘”처럼 입력해 보세요.'}],pendingSuggestion:null,cycle:1}}
let state;try{state=JSON.parse(localStorage.getItem(LOCAL_KEY))||createState()}catch(e){state=createState()} if(!state.days||state.days.length!==3)state=createState();state.archivedDays=state.archivedDays||{};function save(){try{localStorage.setItem(storageKey(),JSON.stringify(state));queueCloud()}catch(e){if(!saveWarned){saveWarned=true;alert('브라우저 저장 공간에 기록을 저장하지 못했어요. 설정의 JSON 백업 기능으로 데이터를 보관하고, 저장 공간을 확인해주세요.')}}}
let startedAt=null,pausedAt=null,held=0;let restored=state.activeSession||null;if(restored){active=restored.active;startedAt=restored.startedAt;pausedAt=restored.pausedAt;held=restored.held||0;dayIndex=restored.dayIndex||0}else{active=null}function persistSession(){state.activeSession=active?{active,startedAt,pausedAt,held,dayIndex}:null;save()}function elapsed(){if(!active)return 0;return held+(pausedAt?0:Math.max(0,Math.floor((Date.now()-startedAt)/1000)))}
function timeline(day){let shift=0,arr=[];for(let i=0;i<day.events.length;i++){let e=day.events[i],base=e.start;let start=Math.max(base,((i===0)?base:arr[i-1].end)); if(e.kind==='sleep'){start=base} let effectiveStart=e.kind==='sleep'?start:start+shift; if(e.kind==='sleep')effectiveStart=base;let end=effectiveStart+e.duration;let extra=Number(e.extra||0);arr.push({...e,startComputed:effectiveStart,end:end+extra,shift,late:Math.max(0,effectiveStart-base)}); if(e.kind!=='sleep')shift+=extra; }return arr}
// Keep the original reference times as anchors; delays propagate along subsequent blocks.
function schedule(day){let prev=-Infinity,arr=[];for(let i=0;i<day.events.length;i++){const e=day.events[i];if(e.skipped){const at=Number.isFinite(prev)?prev:e.start;arr.push({...e,startComputed:at,endComputed:at,shiftTotal:0});continue}let start=e.kind==='sleep'?e.start:Math.max(e.start,prev),length=e.duration+Number(e.extra||0);if(e.kind==='flex'){const next=day.events.slice(i+1).find(x=>x.kind!=='flex');length=next?Math.max(0,next.start-start):length}let end=e.kind==='sleep'?start:start+length;prev=end;arr.push({...e,startComputed:start,endComputed:end,shiftTotal:Math.max(0,start-e.start)})}return arr}

const views=[['today','◷','시간표'],['days','▦','3일 계획'],['report','▥','기록'],['settings','⚙','설정']];
function renderNav(){for(let selector of ['#nav','#mobile-nav']){$(selector).innerHTML=views.map(([key,ico,label])=>`<button data-view="${key}" class="${view===key?'active':''}"><span>${ico}</span><span>${label}</span></button>`).join('')}}
function longDate(date){const d=new Date(date+'T12:00:00');return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${['일','월','화','수','목','금','토'][d.getDay()]}요일`}
function titleModal(index){const d=state.days[index];$('#modals').innerHTML=`<div class="modal-cover"><div class="modal"><h3>${longDate(d.date)}</h3><form id="day-title-form"><input type="hidden" name="index" value="${index}"><div class="field"><label>제목 (선택)</label><input name="title" maxlength="80" value="${esc(d.title||'')}" placeholder="직접 제목을 입력하세요"></div><div class="controls"><button type="button" class="btn outline" data-action="close-modal">취소</button><button class="btn">저장</button></div></form></div></div>`}
function settingsForDate(date){const history=state.settingsHistory||[];return history.filter(x=>x.from<=date).sort((a,b)=>b.from.localeCompare(a.from))[0]?.values||state.settings}
function saveDailySettings(values,todayDate=dateISO(new Date())){const tomorrow=addDays(todayDate,1);const previous=state.days.map(d=>({...settingsForDate(d.date)}));if(!state.settingsHistory)state.settingsHistory=[{from:'0000-01-01',values:{...state.settings}}];state.settingsHistory=state.settingsHistory.filter(x=>x.from!==tomorrow);state.settingsHistory.push({from:tomorrow,values:{...values}});state.settings={...values};state.days.forEach((day,i)=>{if(day.date<tomorrow)return;const old=previous[i],wakeDelta=mins(values.wake)-mins(old.wake),lunchDelta=mins(values.lunch)-mins(old.lunch),dinnerDelta=mins(values.dinner)-mins(old.dinner),sleepDelta=mins(values.sleep)-mins(old.sleep);for(const e of day.events){if(e.done)continue;if(e.kind==='sleep')e.start=mins(values.sleep);else if(e.name==='취침 준비')e.start=mins(values.sleep)-e.duration;else{const delta=e.start<mins(old.lunch)?wakeDelta:e.start<mins(old.dinner)?lunchDelta:dinnerDelta;e.start=Math.max(0,Math.min(1439,e.start+delta));if(e.name==='점심 식사')e.start=mins(values.lunch);if(e.name==='저녁 식사')e.start=mins(values.dinner);if(e.kind==='break'&&e.duration===Number(old.breakMin))e.duration=Number(values.breakMin)}}});return tomorrow}
function header(){const d=state.days[dayIndex];const titles={today:longDate(d.date),days:'일정',report:'기록',coach:'계획 조정',settings:'설정'};$('#page-title').textContent=titles[view];$('#page-desc').innerHTML=view==='today'?`<button class="day-title-edit" data-action="day-title">${d.title?esc(d.title):'제목 추가'} <span aria-hidden="true">✎</span></button>`:'';$('#current-date').textContent=fmtDate(dateISO(new Date()));}

function nowCard(){let e=active?state.days[active.day].events.find(x=>x.id===active.id):null;let next=state.days[dayIndex].events.find(x=>x.kind==='study'&&!x.done&&!x.skipped);let isBreak=active?.kind==='break';let display=e||next;let time=e?elapsed():0;let scheduled=e?.duration||next?.duration||0;let target=scheduled*60;let localM=new Date().getHours()*60+new Date().getMinutes();let currentBlock=schedule(state.days[dayIndex]).find(x=>localM>=x.startComputed&&localM<x.endComputed);let runState=isBreak?'쉬는 시간':active?'진행 중':currentBlock?'현재 예정':'다음 공부';let title=isBreak?'잠깐 쉬어도 괜찮아요':display?display.name:'오늘 할 공부를 모두 마쳤어요';let note=isBreak?`휴식 ${dur(scheduled)} 후 다음 공부로 이어져요.`:active?`계획 ${dur(scheduled)} · ${time>target?'예정 시간을 넘겼어도 자동으로 종료하지 않아요.':'공부 종료를 누르면 이후 일정이 알아서 조정돼요.'}`:next?`예정 ${dur(scheduled)} · 체크리스트와 타이머를 함께 사용할 수 있어요.`:'완료한 공부는 기록에서 확인할 수 있어요.';if(!active&&currentBlock){note=`현재 시간표: ${currentBlock.name} (${clock(currentBlock.startComputed)}–${clock(currentBlock.endComputed)}) · 실제 시작/종료는 아래 버튼으로 기록하세요.`}
let pct=target?Math.min(100,time/target*100):0;
return `<div class="card now-card" id="now-card"><div class="now-top"><span class="now-tag" id="now-tag">● ${runState}</span><span class="small muted" id="live-clock">${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</span></div><h2 class="now-title" id="now-title">${esc(title)}</h2><div class="now-note" id="now-note">${esc(note)}</div><div class="timer" id="timer-display">${active?`${clockTimer(time)}`:'00:00:00'}</div><div class="muted small" id="timer-status">${active?'실제 진행 시간':'시작 버튼을 누르면 실제 시간을 기록해요'}</div><div class="durationline"><div id="timer-bar" style="width:${pct}%"></div></div><div class="controls" id="session-buttons">${buttons()}</div></div>`}
function clockTimer(n){let h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':')}
function buttons(){if(!active){let e=state.days[dayIndex].events.find(x=>x.kind==='study'&&!x.done&&!x.skipped);return e?`<button class="btn" data-action="start-next">▶ 공부 시작</button><button class="btn outline" data-action="edit-next">✎ 체크리스트 편집</button>`:''}if(active.kind==='break'){return `<button class="btn" data-action="finish-break">✓ 쉬기 완료</button><button class="btn outline" data-action="pause">${pausedAt?'▶ 재개':'Ⅱ 잠깐 멈춤'}</button>`}if(active.kind==='meal'){return `<button class="btn" data-action="finish">✓ 식사 끝났어요</button><button class="btn outline" data-action="pause">${pausedAt?'▶ 재개':'Ⅱ 일시정지'}</button>`}return `<button class="btn" data-action="finish">✓ 공부 끝났어요</button><button class="btn outline" data-action="pause">${pausedAt?'▶ 재개':'Ⅱ 일시정지'}</button><button class="btn outline" data-action="continue">↗ 계속 공부</button>`}
let dateSummaryOpen=false;
function studyGoal(day){if(Number.isFinite(day.goalMinutes))return day.goalMinutes;if(Number.isFinite(state.studyGoalMinutes))return state.studyGoalMinutes;return day.events.filter(e=>e.kind==='study'&&!e.skipped).reduce((n,e)=>n+e.duration,0)}
function dailyGoalModal(){const day=state.days[dayIndex],value=studyGoal(day);$('#modals').innerHTML=`<div class="modal-cover"><div class="modal"><h3>${fmtDate(day.date)} · 예정 공부시간</h3><p class="foot-note">이 날짜에만 적용돼요. 날짜별로 저장한 시간이 설정의 기본시간보다 우선합니다.</p><form id="daily-goal-form"><div class="form-row" style="margin-top:16px"><div class="field"><label>시간</label><input type="number" name="hours" min="0" max="23" step="1" value="${Math.floor(value/60)}" required></div><div class="field"><label>분</label><input type="number" name="minutes" min="0" max="59" step="1" value="${value%60}" required></div></div><div class="controls"><button class="btn outline" type="button" data-action="reset-daily-goal">기본값 사용</button><button class="btn outline" type="button" data-action="close-modal">취소</button><button class="btn">이 날짜에 저장</button></div></form></div></div>`}
function shortStats(){let es=state.days[dayIndex].events,studies=es.filter(e=>e.kind==='study'),done=studies.filter(e=>e.done).length,goal=studyGoal(state.days[dayIndex]),logged=studies.reduce((a,e)=>a+(e.actual||0),0);let delay=es.reduce((a,e)=>a+(e.extra||0),0);return `<div class="summary"><div class="stat"><div class="muted small">체크 완료</div><strong>${done}/${studies.length}</strong><div class="small muted">공부 블록</div></div><div class="stat"><div class="muted small">실제 공부</div><strong>${dur(logged)}</strong><div class="small muted goal-line">예정 공부시간 ${dur(goal)} <button class="goal-pencil mini" data-action="daily-goal" aria-label="이 날짜의 예정 공부시간 수정">✎</button></div></div><div class="stat"><div class="muted small">일정 이동</div><strong>+${delay}분</strong><div class="small muted">자동 반영됨</div></div></div>`}
function daySwitch(){return `<div class="day-switch">${state.days.map((d,i)=>`<button class="day-button ${i===dayIndex?'active':''}" data-day="${i}"><strong>DAY ${i+1}</strong><span>${fmtDate(d.date)}</span></button>`).join('')}</div>`}
function eventDisplayName(name){return ['자유시간 · 예비시간','자유시간, 예비시간','자유시간 · 예비 시간'].includes(name)?'free time':name}
function timePhases(day,now=new Date()){const today=dateISO(now),minute=now.getHours()*60+now.getMinutes(),plan=schedule(day);let current=-1;if(day.date===today){for(let i=0;i<plan.length;i++){const e=plan[i],end=e.kind==='sleep'?1440:e.endComputed;if(!e.skipped&&e.startComputed<=minute&&minute<end)current=i}}return plan.map((e,i)=>({id:e.id,phase:day.date<today?'past':day.date>today?'future':i===current?'current':e.skipped||e.endComputed<=minute?'past':'future'}))}
function updateTimelineHighlight(now=new Date()){const day=state.days[dayIndex];if(!day)return;const phases=timePhases(day,now),pastCount=phases.filter(x=>x.phase==='past').length;const control=$('#past-toggle');if(control){control.hidden=!pastCount;control.textContent=`${pastCollapsed?'▸':'▾'} 지난 일정 ${pastCount}개 · ${pastCollapsed?'펼치기':'접기'}`;control.setAttribute('aria-expanded',String(!pastCollapsed))}for(const item of phases){const node=document.querySelector(`.timeline .event[data-id="${item.id}"]`);if(!node)continue;node.classList.toggle('past-collapsed',pastCollapsed&&item.phase==='past');node.classList.toggle('time-current',item.phase==='current');node.classList.toggle('time-past',item.phase==='past');if(item.phase==='current')node.setAttribute('aria-current','time');else node.removeAttribute('aria-current');const badge=node.querySelector('.time-phase');if(badge){badge.textContent=item.phase==='current'?'지금 예정된 일정':item.phase==='past'?'지난 시간':'';badge.hidden=item.phase==='future'}}}
function eventHTML(e){const study=e.kind==='study',running=active&&active.id===e.id&&active.day===dayIndex,time=`<span class="time-start">${clock(e.startComputed)}</span>${e.duration&&!e.skipped?`<span class="time-end">${clock(e.endComputed)}</span>`:''}`;return `<div class="event" data-id="${e.id}"><div class="time" aria-label="${clock(e.startComputed)}${e.duration&&!e.skipped?'부터 '+clock(e.endComputed)+'까지':''}">${time}</div><div class="track"><div class="dot ${e.done?'done':e.subject}"></div></div><div class="event-body ${study?'':'routine'} ${e.done||e.skipped?'isdone':''}"><span class="time-phase" hidden></span><button class="event-open" data-action="event-detail" data-id="${e.id}" aria-label="${esc(eventDisplayName(e.name))} 일정 관리"><span class="ev-title ${e.done?'done':''}">${esc(eventDisplayName(e.name))}</span><span class="small muted">${e.skipped?'건너뜀':e.done?'완료':running?'진행 중':dur(e.duration)}　›</span></button>${e.skipped?'<p class="ev-detail"><strong class="skip-emphasis">오늘은 하지 않음</strong><br>공부시간에 포함되지 않아요.</p>':e.items.length?`<div class="task-checks">${e.items.map(ch=>`<label class="tick"><input type="checkbox" data-check="${ch.id}" data-event="${e.id}" ${ch.checked?'checked':''}><span>${esc(ch.name)}</span></label>`).join('')}</div>`:''}${!e.skipped&&e.kind!=='sleep'&&e.kind!=='flex'?`<div class="event-actions">${!e.done&&!running?`<button class="btn small soft" data-action="start-id" data-id="${e.id}">시작</button>`:''}<button class="btn small outline" data-action="delay" data-id="${e.id}">over time${e.extra?' · +'+e.extra+'분':''}</button>${true?`<button class="btn small outline" data-action="toggle-done" data-id="${e.id}">${e.done?'완료 취소':'완료'}</button>`:''}</div>`:''}<div class="event-actions secondary"><button class="mini" data-action="skip-event" data-id="${e.id}">${e.skipped?'다시 할 일로':'오늘 건너뛰기'}</button>${e.kind!=='sleep'?`<button class="mini" data-action="add-after" data-id="${e.id}">+ next</button>`:''}</div>${e.extra&&!e.skipped?`<div class="shift">추가 소요 ${e.extra}분 · 이후 일정 자동 조정</div>`:''}</div></div>`}

function today(){let d=state.days[dayIndex];return `<div class="grid cols"><div class="grid"><details class="card date-summary" id="date-summary" ${dateSummaryOpen?'open':''}><summary><strong>Day ${dayIndex+1} : ${fmtDate(d.date)}</strong><span class="date-summary-arrow" aria-hidden="true">⌄</span></summary><div class="date-summary-content">${daySwitch()}<div style="height:20px"></div>${shortStats()}</div></details><div class="card"><div class="card-head"><h2>시간표</h2><button class="btn small soft" data-action="add-task">+ 할 일 추가</button></div><div class="foot-note" style="margin:-6px 0 15px">일정 이름을 누르면 관리창이 열려요. over time·건너뛰기·삭제는 각 일정에서 바로 할 수 있어요. 선택한 날짜에만 적용돼요.</div><button class="past-toggle btn outline small" id="past-toggle" data-action="toggle-past" aria-expanded="true" hidden></button><div class="timeline">${schedule(d).map(eventHTML).join('')}</div>${scheduleWarning(d)}<p class="foot-note">※ 로그인 상태에서는 계정에 자동 저장돼요. 취침 이후로 밀린 일정은 시간표의 겹침 안내를 확인하세요.</p></div></div><div class="grid" style="align-content:start"><div>${nowCard()}</div><div class="card"><div class="card-head"><h3>오늘 꼭 해야 할 것</h3></div><div style="display:grid;gap:13px">${d.events.filter(e=>e.kind==='study'&&!e.done&&!e.skipped).slice(0,4).map(e=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span>${esc(eventDisplayName(e.name))}</span><span class="muted small">${dur(e.duration)}</span></div>`).join('')||'<p class="muted small">모든 공부 완료!</p>'}</div></div></div></div>`}
function days(){return `<div class="controls" style="margin-bottom:20px"><button class="btn" data-action="new-cycle">다음 3일 만들기</button><button class="btn outline" data-action="export">백업 <svg class="download-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v5h14v-5"/></svg></button></div><div class="three">${state.days.map((d,i)=>{const tasks=d.events.filter(e=>e.kind==='study');return `<div class="day-card ${i===dayIndex?'selected':''}"><h3>${longDate(d.date)}</h3><button class="day-title-edit" data-action="day-title" data-index="${i}">${d.title?esc(d.title):'제목 추가'} ✎</button><div class="muted small" style="margin-top:12px">${tasks.filter(e=>e.done).length}/${tasks.length} 공부 완료</div><div class="day-list">${tasks.map(e=>`<div><span>${esc(eventDisplayName(e.name))}</span><span>${dur(e.duration)}</span></div>`).join('')}</div><button class="btn outline small" data-day="${i}" data-go="today">일정 열기</button></div>`}).join('')}</div>`}

function allDates(){return [...new Set([...Object.keys(state.archivedDays||{}),...state.days.map(d=>d.date),...(state.logs||[]).map(l=>l.date).filter(Boolean)])].sort()}
function getDay(date){return state.days.find(d=>d.date===date) || state.archivedDays?.[date] || null}
function reportInfo(date){let day=getDay(date);let logs=(state.logs||[]).filter(l=>l.date===date),events=day?day.events:[],studies=events.filter(e=>e.kind==='study'),planned=studies.reduce((s,e)=>s+e.duration,0),actual=logs.filter(l=>l.kind==='study').reduce((s,e)=>s+Number(e.minutes||0),0),done=studies.filter(e=>e.done).length,items=events.flatMap(e=>e.items||[]),checked=items.filter(x=>x.checked).length;return {day,logs,events,studies,planned,actual,done,items,checked}}
let calendarMonth=null;
function calendarHTML(){const month=calendarMonth||reportDate.slice(0,7),first=new Date(month+'-01T12:00:00'),year=first.getFullYear(),m=first.getMonth(),count=new Date(year,m+1,0).getDate(),todayDate=dateISO(new Date());let cells=Array.from({length:first.getDay()},()=>'<span class="calendar-blank" aria-hidden="true"></span>');for(let n=1;n<=count;n++){const date=`${month}-${String(n).padStart(2,'0')}`,r=reportInfo(date),hasActivity=r.logs.length||r.checked||r.events.some(e=>e.done||e.skipped),hasPlan=!!r.day;const label=hasActivity?(r.actual?dur(r.actual):r.checked?`체크 ${r.checked}`:'기록'):hasPlan?'계획':'';cells.push(`<button class="calendar-day ${date===reportDate?'selected':''} ${date===todayDate?'is-today':''}" data-action="calendar-date" data-date="${date}" aria-label="${date} ${hasActivity?'기록 있음':hasPlan?'계획 있음':'기록 없음'}" aria-pressed="${date===reportDate}"><span>${n}</span><small>${esc(label)||'&nbsp;'}</small></button>`)}return `<section class="calendar" aria-label="월별 기록 달력"><div class="calendar-head"><button class="btn small outline" data-action="calendar-prev" aria-label="이전 달">‹</button><h3>${year}년 ${m+1}월</h3><button class="btn small outline" data-action="calendar-next" aria-label="다음 달">›</button></div><div class="calendar-week">${['일','월','화','수','목','금','토'].map(d=>`<span>${d}</span>`).join('')}</div><div class="calendar-grid">${cells.join('')}</div><p class="foot-note">날짜를 누르면 아래에 상세 기록이 표시돼요. ‘계획’은 아직 활동 기록이 없는 날이에요.</p></section>`}
function changeCalendarMonth(delta){const date=new Date((calendarMonth||reportDate.slice(0,7))+'-01T12:00:00');date.setMonth(date.getMonth()+delta);calendarMonth=dateISO(date).slice(0,7);render()}
function report(){let info=reportInfo(reportDate),all=allDates();let summary=info.events.map(e=>{let actual=info.logs.filter(l=>l.kind==='study'&&l.name===e.name).reduce((n,l)=>n+Number(l.minutes||0),0)||e.actual||0;return `<div class="archive-task"><h3>${e.skipped?'건너뜀 · ':e.done?'✓ ':'○ '}${esc(eventDisplayName(e.name))}</h3><small>예정 ${dur(e.duration)} · 실제 ${dur(actual)}${e.extra?` · 지연 +${e.extra}분`:''}</small>${(e.items||[]).map(t=>`<div class="item ${t.checked?'checked':''}">${t.checked?'☑':'□'} ${esc(t.name)}</div>`).join('')}</div>`}).join('');let recent=all.filter(x=>x<=dateISO(new Date())).slice(-5).reverse();return `<div class="grid layouttwo"><div class="grid"><div class="card"><div class="card-head"><h2>날짜별 기록</h2><span class="pill green">기록 자동 저장</span></div><p class="section-intro">어제, 오늘, 이전 3일 계획까지 날짜별로 확인하고 내보낼 수 있어요.</p><div class="archive-bar"><button class="btn outline small" data-action="report-prev">← 전날</button><input type="date" id="report-date" aria-label="보고 싶은 날짜 선택" value="${reportDate}"><button class="btn outline small" data-action="report-next">다음 날 →</button><button class="btn soft small" data-action="report-today">오늘</button></div>${calendarHTML()}<div class="archive-stats"><div class="stat"><span class="small muted">실제 공부</span><strong>${dur(info.actual)}</strong></div><div class="stat"><span class="small muted">공부 블록</span><strong>${info.done}/${info.studies.length}</strong></div><div class="stat"><span class="small muted">체크 과제</span><strong>${info.checked}/${info.items.length}</strong></div></div><h3>${esc(fmtDate(reportDate))} 일정 · 체크리스트</h3>${info.day?summary||'<div class="empty">등록된 일정이 없어요.</div>':'<div class="empty" style="margin-top:12px">선택한 날짜의 계획이 없어요. 타이머 기록이 남아 있다면 아래에서 볼 수 있어요.</div>'}${info.logs.length?`<div style="margin-top:19px"><h3>실제 진행 기록</h3><div class="report-list" style="margin-top:9px">${info.logs.map(l=>`<div class="report-row"><strong>${esc(eventDisplayName(l.name))}</strong><div class="meta">${new Date(l.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})} 종료 · ${dur(l.minutes)}</div></div>`).join('')}</div></div>`:''}<div class="archive-notice">JPG·PDF는 선택한 날짜의 학습 현황을 이미지 보고서로 내보냅니다. 전체 데이터 복구는 설정의 JSON 백업을 사용하세요.</div><div class="backup-tools"><button class="btn" data-action="export-jpg">JPG 저장 <svg class="download-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v5h14v-5"/></svg></button><button class="btn outline" data-action="export-pdf">PDF 저장 <svg class="download-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v5h14v-5"/></svg></button></div></div></div><div class="grid" style="align-content:start"><div class="card"><h2>최근 날짜 바로가기</h2><div class="chips">${recent.map(d=>`<button class="chip" data-action="report-date" data-date="${d}">${fmtDate(d)}</button>`).join('')||'<span class="muted small">아직 기록이 없습니다.</span>'}</div></div><div class="card"><h2>공부시간 누적</h2>${['english','law','admin','korean'].map(sub=>{let total=(state.logs||[]).filter(l=>l.kind==='study'&&l.subject===sub).reduce((n,l)=>n+Number(l.minutes||0),0);return `<div class="reportbar"><strong>${names[sub]}</strong><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,total/420*100)}%;background:${colors[sub]}"></div></div><span class="muted">${dur(total)}</span></div>`}).join('')}<p class="foot-note">시간 기록은 타이머 종료를 기준으로 집계됩니다. 체크만 한 과제는 실제 공부시간에 합산되지 않습니다.</p></div><div class="card"><h2>시간이 오래 걸린 공부</h2>${[...state.days,...Object.values(state.archivedDays||{})].flatMap(d=>d.events.filter(e=>e.extra>0).map(e=>({...e,date:d.date}))).sort((a,b)=>b.extra-a.extra).slice(0,5).map(e=>`<div class="report-row" style="margin-top:9px"><strong>${esc(eventDisplayName(e.name))}</strong><span style="float:right;color:#b17845">+${e.extra}분</span><div class="meta">${fmtDate(e.date)}</div></div>`).join('')||'<p class="foot-note">아직 초과 기록이 없어요.</p>'}</div></div></div>`}
function coach(){let messages=state.chat.map(m=>`<div class="bubble ${m.role}">${esc(m.text)}</div>`).join('');let s=state.pendingSuggestion;return `<div class="grid layouttwo"><div class="card"><div class="card-head"><h2>계획 조정</h2><span class="pill">일정 추가 · 삭제 · 시간 변경</span></div><p class="section-intro">시간과 일정 이름으로 추가·삭제를 요청하세요. 날짜를 생략하면 시간표에서 선택한 날짜에 적용됩니다. 적용 전 변경안을 확인할 수 있어요.</p><div class="chips"><button class="chip" data-prompt="영어 30분 늘려줘">영어 30분 늘려줘</button><button class="chip" data-prompt="국어 15분 줄여줘">국어 15분 줄여줘</button><button class="chip" data-prompt="행정법 20분 늘려줘">행정법 20분 늘려줘</button></div><div class="chat-feed" id="chat-feed">${messages}</div>${s?`<div class="recommend"><strong>계획 수정 제안</strong><div class="muted small">${s.kind?esc(s.summary):`${esc(s.subjectName)} · ${s.delta>0?'+':''}${s.delta}분 (하루 기준, 현재 3일 계획)`}</div><div class="controls" style="margin-top:12px"><button class="btn small" data-action="apply-suggestion">적용</button><button class="btn outline small" data-action="dismiss-suggestion">취소</button></div></div>`:''}<form id="chat-form" class="sendbox"><input name="message" aria-label="계획 변경 요청" placeholder="예: 행정학 15분 더 늘려줘" autocomplete="off" required><button class="btn" type="submit">보내기</button></form></div><div class="grid" style="align-content:start"><div class="card"><h3>이렇게 입력하세요</h3><p class="foot-note">오늘 오후 3시에 산책 30분 추가해줘<br>내일 로즈리 기초문법 삭제해줘<br>영어 30분 늘려줘</p><p class="foot-note">추가·삭제는 지정한 날짜의 일정 하나에 적용됩니다. 과목 시간 증감은 기존처럼 현재 3일 계획에 적용됩니다. 정해진 표현을 해석하는 기능이며, 모호한 요청은 다시 확인합니다.</p></div></div></div>`}
function settings(){let c=state.settings;const goal=Number.isFinite(state.studyGoalMinutes)?state.studyGoalMinutes:420;return `<div class="grid layouttwo"><div class="card"><h2>기본 시간</h2><p class="section-intro" style="margin-top:12px">변경한 시간은 내일부터 적용됩니다.</p><form id="settings-form"><h3>수면</h3><div class="form-row" style="margin:12px 0 24px"><div class="field"><label>기상</label><input name="wake" type="time" value="${c.wake}" required></div><div class="field"><label>취침</label><input name="sleep" type="time" value="${c.sleep}" required></div></div><h3>식사</h3><div class="form-row" style="margin:12px 0 24px"><div class="field"><label>점심</label><input name="lunch" type="time" value="${c.lunch}" required></div><div class="field"><label>저녁</label><input name="dinner" type="time" value="${c.dinner}" required></div></div><h3>휴식</h3><div class="field" style="margin-top:12px"><label>기본 휴식시간 (분)</label><input name="breakMin" type="number" min="5" max="60" value="${c.breakMin}" required></div><div class="controls" style="margin-top:22px"><button class="btn">저장 · 내일부터 적용</button></div></form><p class="foot-note">오늘과 지난 기록은 유지됩니다. 내일부터의 기존 일정은 변경된 생활시간에 맞춰 이동하며 체크리스트·완료 기록은 유지됩니다.</p></div><div class="grid" style="align-content:start"><div class="card"><h2>기본 예정 공부시간</h2><p class="foot-note">저장하면 날짜별 예정 공부시간에 바로 적용됩니다. 단, 날짜 옆 연필로 따로 지정한 값이 우선합니다. 공부 일정의 분량 자체는 바꾸지 않습니다.</p><form id="study-goal-form"><div class="form-row" style="margin-top:12px"><div class="field"><label>시간</label><input name="hours" type="number" min="0" max="23" step="1" value="${Math.floor(goal/60)}" required></div><div class="field"><label>분</label><input name="minutes" type="number" min="0" max="59" step="1" value="${goal%60}" required></div></div><div class="controls" style="margin-top:14px"><button class="btn">기본시간 저장</button><button class="btn outline" type="button" data-action="reset-default-goal">시간표 합계 사용</button></div></form></div><div class="card"><h3>데이터 관리</h3><p class="muted" style="line-height:1.7;margin:11px 0 18px">로그인 후 서버 저장 완료가 표시되면 같은 계정의 다른 기기에서도 기록을 불러올 수 있어요. JSON 백업도 내려받을 수 있어요.</p><div class="controls"><button class="btn soft" data-action="export">↓ 기록 백업(JSON)</button><button class="btn outline" data-action="import">↑ 기록 가져오기</button></div><input id="import-file" type="file" accept="application/json" class="hidden" /></div><div class="card"><h3>저장 방식 · 꼭 확인해주세요</h3><p class="muted" style="line-height:1.8;margin-top:11px">로그인 후 변경 내용은 기기와 서버에 저장됩니다. <strong>서버 저장 완료</strong>를 확인한 뒤 다른 기기로 이동하세요. 다른 기기 기록은 접속·로그인할 때 또는 상단 동기화 버튼으로 불러옵니다. 동시에 수정하면 자동 덮어쓰기를 멈추고 충돌을 안내합니다. 서버 기록은 수정하는 날 첫 수정 직전 상태를 자동 보관합니다. 자동 보관본에서 JSON을 내려받아 복원할 수 있습니다. 비로그인 기록과 미전송 변경은 해당 브라우저에만 남습니다. 서버 저장과 별도로 중요한 기록은 JSON으로 보관하세요. 푸시 알림·실제 AI 대화는 아직 지원하지 않습니다.</p></div></div></div>`}
let planPanelOpen=false,pastCollapsed=false,planDraft='';
function renderPlanPanel(){const root=$('#plan-panel-root');if(!root)return;if(view!=='today'){root.innerHTML='';return}root.innerHTML=`<button class="plan-launch btn" data-action="toggle-plan-panel" aria-expanded="${planPanelOpen}" aria-controls="plan-panel">${planPanelOpen?'× 닫기':'✎ 계획 조정'}</button>${planPanelOpen?`<section id="plan-panel" class="plan-panel" role="region" aria-label="계획 조정"><header class="plan-panel-head"><div><h2>계획 조정</h2><p class="foot-note">${fmtDate(state.days[dayIndex].date)} 선택됨</p></div><button class="mini" data-action="close-plan-panel" aria-label="계획 조정 닫기">×</button></header><div class="plan-panel-content">${coach()}</div></section>`:''}`;const input=$('#chat-form input');if(input)input.value=planDraft}
function togglePast(){pastCollapsed=!pastCollapsed;updateTimelineHighlight()}
function render(){paintAccount();renderNav();header();const draft=$('#chat-form input');if(draft)planDraft=draft.value;let body={today,days,report,coach,settings}[view]();$('#content').innerHTML=body;renderPlanPanel();const feed=$('#chat-feed');if(feed)feed.scrollTop=feed.scrollHeight;updateClock()}
function updateClock(){updateTimelineHighlight();const c=$('#live-clock');if(c)c.textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});const t=$('#timer-display');if(t&&active){let sec=elapsed(),total=active.duration*60;t.textContent=clockTimer(sec);let bar=$('#timer-bar');if(bar)bar.style.width=`${total?Math.min(100,sec/total*100):0}%`;let status=$('#timer-status');if(status)status.textContent=sec>total&&!active.kind?.includes('break')?`예정 시간보다 ${dur(Math.ceil((sec-total)/60))} 더 공부 중 · 강제로 종료되지 않아요`:pausedAt?'일시정지됨':active.kind==='break'?'휴식 중 · 원할 때 완료할 수 있어요':'실제 진행 시간';let note=$('#now-note');if(note&&sec>total&&active.kind!=='break')note.textContent='예정된 쉬는 시간이 되어도 공부를 이어갈 수 있어요. 완료 버튼을 누르면 그때부터 휴식이 시작됩니다.'}}
function startTask(id){if(active){alert('진행 중인 공부 또는 휴식을 먼저 종료해주세요.');return}let e=state.days[dayIndex].events.find(e=>e.id===id);if(!e||e.skipped)return;let plan=schedule(state.days[dayIndex]).find(x=>x.id===e.id),now=new Date(),nowMin=now.getHours()*60+now.getMinutes();let sameDay=state.days[dayIndex].date===dateISO(now);let startLag=sameDay?Math.max(0,nowMin-(plan?.startComputed||0)):0;active={id,kind:e.kind,day:dayIndex,duration:e.duration,startLag,startedAtIso:now.toISOString()};held=0;startedAt=Date.now();pausedAt=null;persistSession();render()}
function pause(){if(!active)return;if(!pausedAt){held=elapsed();pausedAt=Date.now()}else{startedAt=Date.now();pausedAt=null}persistSession();render()}
function finishSession(){if(!active)return;let a=active;let secs=elapsed();let day=state.days[a.day],e=day.events.find(e=>e.id===a.id);if(!e)return;let actual=Math.max(1,Math.ceil(secs/60));e.actual=(e.actual||0)+actual;e.done=true;e.extra=Math.max(Number(e.extra||0),Math.max(0,(a.startLag||0)+e.actual-e.duration));(e.logs||(e.logs=[])).push({minutes:actual,at:new Date().toISOString()});state.logs.push({kind:e.kind,name:e.name,subject:e.subject,minutes:actual,at:new Date().toISOString(),startAt:a.startedAtIso||new Date(Date.now()-secs*1000).toISOString(),date:day.date});active=null;pausedAt=null;held=0;persistSession();let i=day.events.findIndex(x=>x.id===e.id);let next=day.events[i+1];if(next?.kind==='break'){active={id:next.id,kind:'break',day:a.day,duration:next.duration};startedAt=Date.now();pausedAt=null;held=0;persistSession()}render()}
function finishBreak(){if(!active||active.kind!=='break')return;let b=active,sec=elapsed(),day=state.days[b.day],e=day.events.find(x=>x.id===b.id);let actual=Math.max(1,Math.ceil(sec/60));e.done=true;e.actual=actual;e.extra=Math.max(Number(e.extra||0),Math.max(0,actual-e.duration));state.logs.push({kind:'break',name:'휴식',subject:'',minutes:actual,at:new Date().toISOString(),date:day.date});active=null;held=0;pausedAt=null;persistSession();render()}
function delayModal(eventId){const e=state.days[dayIndex].events.find(x=>x.id===eventId);if(!e||e.skipped)return;$('#modals').innerHTML=`<div class="modal-cover"><div class="modal"><h3>${esc(eventDisplayName(e.name))} · over time</h3><p class="foot-note">예정 ${dur(e.duration)}보다 총 몇 분 더 걸렸나요? 저장하면 이후 일정이 자동 조정돼요.</p><form id="delay-form"><input type="hidden" name="event" value="${e.id}"><div class="field" style="margin-top:16px"><label>추가로 걸린 시간 (분)</label><input name="minutes" type="number" min="0" max="1440" value="${Number(e.extra||0)}" required inputmode="numeric"><span class="foot-note">현재 ${e.extra||0}분 · 0분으로 저장하면 추가시간을 취소해요. 다시 저장해도 중복으로 더하지 않아요.</span></div><div class="controls"><button type="button" data-action="close-modal" class="btn outline">취소</button><button class="btn" type="submit">저장 · 남은 일정 조정</button></div></form></div></div>`}

function editModal(eventId){eventDetail(eventId)}

function addModal(afterId){let d=state.days[dayIndex],computed=schedule(d),after=d.events.find(x=>x.id===afterId);const options=[['time','시작 시간으로 배치'],['first','하루 맨 앞에 추가'],...d.events.filter(e=>e.kind!=='sleep').map(e=>[e.id,`${clock(e.start)} ${e.name} 다음`])];let selected=after&&after.kind!=='sleep'?after.id:'time',start=after?computed.find(x=>x.id===after.id).endComputed:mins('09:00');$('#modals').innerHTML=`<div class="modal-cover"><div class="modal"><h3>할 일 추가 · ${fmtDate(d.date)}</h3><p class="foot-note">공부·약속·이동·휴식 등 오늘 필요한 일정을 넣으세요.</p><form id="add-form"><div class="field"><label>일정 이름</label><input name="name" placeholder="예: 영어 복습 / 병원 / 외출" required></div><div class="form-row"><div class="field"><label>일정 종류</label><select name="kind"><option value="study">공부</option><option value="routine">개인 일정 · 이동</option><option value="break">휴식</option><option value="meal">식사</option></select></div><div class="field"><label>시간 (분)</label><input name="duration" type="number" min="1" max="1440" value="30" required></div></div><div class="field"><label>추가할 위치</label><select name="placement" id="add-placement">${options.map(([k,v])=>`<option value="${esc(k)}" ${k===selected?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="field" id="add-time-field" style="margin-top:12px;${selected==='time'?'':'display:none'}"><label>시작 시간</label><input name="start" type="time" value="${clock(Math.min(1439,start))}" required></div><div class="field" style="margin-top:12px"><label>과목 (공부 일정에 적용)</label><select name="subject">${Object.entries(names).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>체크리스트 (한 줄에 한 항목)</label><textarea name="items" rows="3" placeholder="선택 입력"></textarea></div><div class="controls"><button type="button" data-action="close-modal" class="btn outline">취소</button><button class="btn" type="submit">이 날짜에 추가</button></div></form></div></div>`}

function scheduleWarning(day){const plan=schedule(day),sleep=plan.find(e=>e.kind==='sleep');if(!sleep)return '';const over=plan.filter(e=>e.kind!=='sleep'&&e.kind!=='flex'&&e.endComputed>sleep.startComputed);return over.length?`<div class="backup-alert">${over.length}개 일정이 취침 시간과 겹치거나 이후에 끝나요. 일정 시간·분량을 줄이거나 오늘 취침 시간을 수정하세요.</div>`:''}
let undoSchedule=null;
function shiftFollowing(day,idx,delta){for(let i=idx+1;i<day.events.length;i++){const e=day.events[i];if(e.kind!=='sleep'&&!e.done)e.start=Math.max(0,e.start+delta)}}
function skipEvent(eventId){if(!canEditEvent(eventId))return;const e=state.days[dayIndex].events.find(x=>x.id===eventId);if(!e)return;if(e.skipped)return applySkipEvent(eventId);if(e.done){alert('완료한 일정은 완료 취소 후 건너뛸 수 있어요.');return}$('#modals').innerHTML=`<div class="modal-cover"><div class="modal"><h3>오늘 건너뛰기</h3><p style="line-height:1.7;margin-bottom:16px">‘${esc(eventDisplayName(e.name))}’을 오늘 하지 않는 일정으로 표시할까요?</p><ul class="skip-explanation"><li>일정과 체크리스트는 남고 ‘건너뜀’으로 표시됩니다.</li><li>이 일정에 배정된 시간을 빼고 뒤 일정을 당깁니다. 취침 시간은 유지됩니다.</li><li>완료로 처리하거나 다른 날짜로 미루지 않습니다.</li><li>‘다시 할 일로’를 누르면 되돌릴 수 있습니다.</li></ul><div class="controls"><button class="btn outline" data-action="close-modal">취소</button><button class="btn" data-action="confirm-skip" data-id="${e.id}">오늘 건너뛰기</button></div></div></div>`}
function applySkipEvent(eventId){if(!canEditEvent(eventId))return;const day=state.days[dayIndex],idx=day.events.findIndex(e=>e.id===eventId),e=day.events[idx];if(!e)return;if(e.done){alert('완료한 일정은 완료 취소 후 건너뛸 수 있어요.');return}undoSchedule={day:dayIndex,events:JSON.parse(JSON.stringify(day.events))};const restore=!!e.skipped;e.skipped=!restore;shiftFollowing(day,idx,(restore?1:-1)*(e.duration+Number(e.extra||0)));save();$('#modals').innerHTML='';render();showUndo(restore?'할 일로 되돌렸어요.':'오늘 건너뛰었어요. 이후 일정을 당겼어요.')}
function showUndo(message){let root=document.getElementById('schedule-undo');if(!root){root=document.createElement('div');root.id='schedule-undo';root.className='undo-toast';document.body.appendChild(root)}root.innerHTML=`<span>${esc(message)}</span><button class="btn small outline" data-action="undo-schedule">되돌리기</button><button class="mini" data-action="dismiss-undo" aria-label="알림 닫기">×</button>`}
function undoScheduleChange(){if(!undoSchedule)return;if(active){alert('진행 중인 타이머를 종료한 뒤 되돌려주세요.');return}state.days[undoSchedule.day].events=undoSchedule.events;undoSchedule=null;save();document.getElementById('schedule-undo')?.remove();render()}
function eventDetail(eventId){const e=state.days[dayIndex].events.find(x=>x.id===eventId);if(!e)return;$('#modals').innerHTML=`<div class="modal-cover"><div class="modal"><form id="edit-form"><input type="hidden" name="event" value="${e.id}"><div class="event-name-editor"><input id="event-name-input" name="name" value="${esc(eventDisplayName(e.name))}" aria-label="계획명" required readonly><button class="mini" type="button" data-action="rename-event" aria-label="계획명 수정">✎</button></div><p class="foot-note">${fmtDate(state.days[dayIndex].date)} · 예정 ${clock(e.start)} · ${dur(e.duration)}${e.skipped?' · 오늘은 하지 않음':''}</p><div class="field" style="margin-top:16px"><label>over time (추가 소요 분)</label><input name="extra" type="number" min="0" max="1440" value="${e.extra||0}" ${e.skipped||e.kind==='sleep'?'readonly':''}></div><div class="form-row" style="margin-top:14px"><div class="field"><label>예정 시작 시간</label><input name="start" type="time" value="${clock(e.start)}" required></div><div class="field"><label>예상 시간 (분)</label><input name="duration" type="number" min="${e.kind==='sleep'?0:1}" max="1440" value="${e.duration}" required></div></div>${e.kind==='study'?`<div class="field" style="margin-top:14px"><label>과목</label><select name="subject">${Object.entries(names).map(([k,v])=>`<option value="${k}" ${e.subject===k?'selected':''}>${v}</option>`).join('')}</select></div>`:''}<div class="field" style="margin-top:14px"><label>체크리스트 (한 줄에 한 항목)</label><textarea name="items" rows="4">${esc(e.items.map(x=>x.name).join('\n'))}</textarea></div><div class="controls" style="margin-top:16px"><button class="btn outline" type="button" data-action="close-modal">닫기</button><button class="btn" type="submit">변경 저장</button></div></form><div class="detail-actions event-secondary-actions"><div class="controls"><button class="btn outline" data-action="move-up" data-id="${e.id}">↑ 앞으로 이동</button><button class="btn outline" data-action="move-down" data-id="${e.id}">↓ 뒤로 이동</button></div><button class="btn outline" data-action="skip-event" data-id="${e.id}">${e.skipped?'다시 할 일로 되돌리기':'오늘 건너뛰기'}</button><button class="btn red" data-action="delete-event" data-id="${e.id}">이 일정 삭제</button></div></div></div>`}

function canEditEvent(eventId){if(active&&active.id===eventId&&active.day===dayIndex){alert('진행 중인 타이머를 종료한 뒤 이 일정을 수정해주세요.');return false}return true}
function deleteEvent(eventId){if(!canEditEvent(eventId))return;const day=state.days[dayIndex],idx=day.events.findIndex(x=>x.id===eventId),e=day.events[idx];if(!e||!confirm(`이 날짜에서 ‘${e.name}’ 일정을 삭제할까요? 완료한 시간 기록은 유지됩니다.`))return;const snapshot=JSON.parse(JSON.stringify(day.events));if(!e.skipped&&!e.done)shiftFollowing(day,idx,-(e.duration+Number(e.extra||0)));day.events.splice(idx,1);undoSchedule={day:dayIndex,events:snapshot};save();$('#modals').innerHTML='';render();showUndo('일정을 삭제했어요.')}

function moveEvent(eventId,direction){const day=state.days[dayIndex],i=day.events.findIndex(x=>x.id===eventId),j=i+direction;if(i<0||j<0||j>=day.events.length)return;if(day.events[i].kind==='sleep'||day.events[j].kind==='sleep'){alert('취침은 시작 시간을 수정해서 이동해주세요.');return}if(!canEditEvent(eventId)||!canEditEvent(day.events[j].id))return;const first=Math.min(i,j),anchor=day.events[first].start;[day.events[i],day.events[j]]=[day.events[j],day.events[i]];day.events[first].start=anchor;day.events[first+1].start=anchor+day.events[first].duration;save();$('#modals').innerHTML='';render()}
function addEventFromForm(d){const day=state.days[dayIndex],placement=d.get('placement'),duration=Number(d.get('duration')),kind=d.get('kind')||'study';let start=mins(d.get('start')),idx;if(placement==='first'){idx=0;start=day.events[0]?.start??start}else if(placement!=='time'){idx=day.events.findIndex(e=>e.id===placement)+1;const prev=schedule(day)[idx-1];start=prev?prev.endComputed:start}else{idx=day.events.findIndex(e=>e.start>=start);if(idx<0)idx=day.events.length}const item={id:id(),kind,name:String(d.get('name')).trim(),duration,start,subject:kind==='study'?d.get('subject'):'',items:String(d.get('items')||'').split('\n').map(x=>x.trim()).filter(Boolean).map(name=>({id:id(),name,checked:false})),done:false,extra:0,actual:0,logs:[]};day.events.splice(idx,0,item);save();$('#modals').innerHTML='';render()}
function applyDelay(eventId,min){const e=state.days[dayIndex].events.find(x=>x.id===eventId);if(!e||!canEditEvent(eventId))return;e.extra=Math.max(0,Math.min(1440,Number(min)||0));$('#modals').innerHTML='';save();render()}



function changeSchedule(subject,delta){let days=state.days, success=0;for(let d of days){let events=d.events.filter(e=>e.kind==='study'&&e.subject===subject);if(!events.length)continue;let e=events[0],newDur=Math.max(10,e.duration+delta);let actualChange=newDur-e.duration;e.duration=newDur;success+=actualChange;if(actualChange!==0){let i=d.events.findIndex(x=>x.id===e.id);for(let j=i+1;j<d.events.length;j++){if(d.events[j].kind==='sleep')continue;d.events[j].start+=actualChange}}}return success}
function parsePlanRequest(message){const text=message.trim(),remove=/삭제|지워|지우|제거|없애/.test(text),add=/추가|넣어|잡아/.test(text);if(!remove&&!add)return null;const base=dateISO(new Date()),dateMatch=text.match(/\d{4}-\d{2}-\d{2}/),targetDate=dateMatch?dateMatch[0]:text.includes('모레')?addDays(base,2):text.includes('내일')?addDays(base,1):text.includes('오늘')?base:state.days[dayIndex].date,day=state.days.find(d=>d.date===targetDate);if(!day)return {error:'요청한 날짜가 현재 3일 계획에 없어요. 일정에서 해당 날짜의 계획을 먼저 만들어주세요.'};if(/모두|전부|전체|하고|그리고/.test(text))return {error:'한 번에 일정 하나씩 요청해주세요. 날짜·일정 이름을 함께 적으면 정확하게 수정할 수 있어요.'};let clean=text.replace(/\d{4}-\d{2}-\d{2}/g,'').replace(/오늘|내일|모레/g,'').trim();if(remove){clean=clean.replace(/삭제.*|지워.*|지우.*|제거.*|없애.*/,'').replace(/(일정|시간)(을|를)?\s*$/,'').replace(/(을|를)\s*$/,'').replace(/[“”"']/g,'').trim();if(!clean)return {error:'어떤 일정을 삭제할까요? 예: “오늘 로즈리 기초문법 삭제해줘”'};const matches=day.events.filter(e=>eventDisplayName(e.name).replace(/\s/g,'').includes(clean.replace(/\s/g,'')));if(matches.length!==1)return {error:matches.length?'여러 일정이 해당돼요: '+matches.map(e=>e.name).join(', ')+'. 전체 이름으로 다시 요청해주세요.':'해당 이름의 일정이 없어요. 시간표에 표시된 이름으로 요청해주세요.'};return {kind:'delete',date:targetDate,eventId:matches[0].id,name:matches[0].name,summary:`${fmtDate(targetDate)} · ${matches[0].name} 삭제`}}const time=clean.match(/(?:(오전|오후|저녁|밤)\s*)?(\d{1,2})(?::(\d{2})|시(?:\s*(\d{1,2})분)?)/);if(!time){if(Object.values(names).some(n=>clean.includes(n))&&/\d+\s*분/.test(clean))return null;return {error:'시작 시간과 분량을 적어주세요. 예: “오늘 오후 3시에 산책 30분 추가해줘”'}}let hour=Number(time[2]),minute=Number(time[3]||time[4]||0);if(['오후','저녁','밤'].includes(time[1])&&hour<12)hour+=12;if(time[1]==='오전'&&hour===12)hour=0;if(hour>23||minute>59)return {error:'시작 시간은 00:00~23:59 사이로 입력해주세요.'};clean=clean.replace(time[0],'').replace(/^\s*에\s*/,'').replace(/추가.*|넣어.*|잡아.*/,'').trim();const amount=clean.match(/(?:(\d+)\s*시간)?\s*(?:(\d+)\s*분)/)||clean.match(/(\d+)\s*시간/);if(!amount)return {error:'얼마나 걸리는 일정인가요? 예: “15시에 산책 30분 추가해줘”'};const duration=Number(amount[1]||0)*60+Number(amount[2]||0);if(duration<1||duration>1440)return {error:'일정 분량은 1~1440분으로 입력해주세요.'};const name=clean.replace(amount[0],'').replace(/(을|를)\s*$/,'').replace(/[“”"']/g,'').trim();if(!name)return {error:'추가할 일정 이름도 적어주세요. 예: “15시에 산책 30분 추가해줘”'};const subject=Object.keys(names).find(k=>name.includes(names[k]));return {kind:'add',date:targetDate,start:hour*60+minute,duration,name,subject:subject||'',eventKind:subject?'study':/휴식|쉬는/.test(name)?'break':/식사|점심|저녁/.test(name)?'meal':'routine',summary:`${fmtDate(targetDate)} · ${clock(hour*60+minute)} · ${name} ${dur(duration)} 추가`}}
function processChat(message){const request=parsePlanRequest(message);if(!request)return processLegacyChat(message);state.chat.push({role:'user',text:message});state.pendingSuggestion=request.error?null:request;state.chat.push({role:'ai',text:request.error||`${request.summary}\n변경안을 확인하고 ‘적용’을 눌러주세요. 뒤 일정은 자동 조정됩니다.`});save();render()}
function applyTextRequest(request){const index=state.days.findIndex(d=>d.date===request.date);if(index<0)return;const day=state.days[index];if(active&&active.day===index){alert('해당 날짜의 타이머를 종료한 뒤 적용해주세요.');return}const snapshot=JSON.parse(JSON.stringify(day.events));if(request.kind==='delete'){const i=day.events.findIndex(e=>e.id===request.eventId);if(i<0){alert('일정이 이미 변경됐어요. 다시 요청해주세요.');return}const e=day.events[i];if(!e.skipped&&!e.done)shiftFollowing(day,i,-(e.duration+Number(e.extra||0)));day.events.splice(i,1)}else{let i=day.events.findIndex(e=>e.start>=request.start);if(i<0)i=day.events.length;day.events.splice(i,0,{id:id(),kind:request.eventKind,name:request.name,start:request.start,duration:request.duration,subject:request.subject,items:[],done:false,extra:0,actual:0,logs:[]})}undoSchedule={day:index,events:snapshot};state.chat.push({role:'ai',text:'적용했어요. '+request.summary});state.pendingSuggestion=null;save();render();showUndo('계획을 변경했어요.')}
function processLegacyChat(message){message=message.trim();if(!message)return;state.chat.push({role:'user',text:message});let subject=Object.keys(names).find(s=>message.includes(names[s]));let found=message.match(/(\d+)\s*분/);let n=found?Math.min(120,Number(found[1])):0;let reduce=/줄|빼|감소|축소/.test(message);let increase=/늘|추가|더|증가/.test(message);if(subject&&n&&(reduce||increase)){let delta=reduce?-n:n;state.pendingSuggestion={subject,subjectName:names[subject],delta};state.chat.push({role:'ai',text:`${names[subject]} 시간을 하루 ${n}분 ${reduce?'줄이는':'늘리는'} 수정안을 만들었어요.\n현재 3일 계획에 반영할까요? 오른쪽/아래의 ‘3일 계획에 적용’을 누르면 확정됩니다.\n\n※ 입력한 과목과 시간을 기준으로 만든 수정안입니다.`})}else if(/느려|오래|밀|시간 부족/.test(message)){state.pendingSuggestion=null;let o=state.days.flatMap(d=>d.events.filter(e=>e.extra>0).map(e=>({name:e.name,extra:e.extra}))).sort((a,b)=>b.extra-a.extra)[0];state.chat.push({role:'ai',text:o?`기록을 보면 ‘${o.name}’이 계획보다 ${o.extra}분 오래 걸렸어요.\n\n다음 계획에서는 이 블록에 여유시간을 추가하거나 하루 체크리스트 수를 줄이는 방향이 좋아요. “행정법 15분 늘려줘”처럼 요청하면 적용할 수 있어요.`:'시간이 자주 밀린다면 각 블록에 추가시간을 기록해보세요. 3일간 누적된 지연을 비교한 뒤 하루 목표를 낮추거나 시간을 옮기는 걸 추천해요.\n\n예: “행정학 20분 늘려줘”'})}else{state.pendingSuggestion=null;state.chat.push({role:'ai',text:'공부시간 수정 예시는 “영어 30분 늘려줘”, “국어 15분 줄여줘”처럼 과목·분량·방향을 함께 입력해주세요.\n\n개별 일정은 시간표의 수정 기능을 이용해주세요.'})}save();render()}
function newCycle(){if(!confirm('현재 3일 계획의 체크 기록을 보존하고 다음 3일 계획을 만들까요?'))return;if(active){alert('진행 중인 타이머를 먼저 종료해주세요.');return}for(const d of state.days)state.archivedDays[d.date]=JSON.parse(JSON.stringify(d));let nextStart=addDays(state.days[2].date,1);if(dateISO(new Date())>nextStart)nextStart=dateISO(new Date());let carry=state.days.flatMap(d=>d.events.filter(e=>e.kind==='study'&&!e.done&&!e.skipped)).slice(0,6);state.days=[0,1,2].map(i=>{let events=makeEvents(settingsForDate(addDays(nextStart,i)),i);if(i===0&&carry.length){let target=events.find(e=>e.kind==='study'&&e.subject==='english');target.items.push({id:id(),name:`이월 과제 확인: ${carry.map(e=>e.name).slice(0,3).join(', ')}`,checked:false})}return {date:addDays(nextStart,i),events,note:''}});state.dayStart=nextStart;state.cycle++;dayIndex=0;state.pendingSuggestion=null;save();view='days';render()}

const cards=[['실제 공부',dur(r.actual)],['공부 블록',`${r.done} / ${r.events.length}`],['체크한 과제',`${r.checked} / ${r.items.length}`]];cards.forEach((z,i)=>{let xx=pad+i*248;x.fillStyle='#f0f3f9';x.fillRect(xx,189,232,98);txt(z[0],xx+18,220,15,'#768395');txt(z[1],xx+18,265,26,'#293a5c',750)});
let y=338;txt('과목별 공부시간',pad,y,20,'#2e3b4e',700);y+=33;subjects.forEach(a=>{txt(a.name,pad,y,16,'#445069',600);x.fillStyle='#edf0f4';x.fillRect(pad+110,y-13,510,15);x.fillStyle=a.color;x.fillRect(pad+110,y-13,510*Math.min(1,a.minutes/210),15);txt(dur(a.minutes),W-pad-95,y,15,'#5f6d7d',600);y+=33});y+=19;line(y,y);y+=39;txt('하루 일정 · 체크리스트',pad,y,20,'#2e3b4e',700);y+=33;

for(const e of r.events){const actual=r.logs.filter(l=>l.name===e.name&&l.kind==='study').reduce((n,l)=>n+Number(l.minutes||0),0)||e.actual||0;txt((e.skipped?'건너뜀  ':e.done?'✓  ':'○  ')+eventDisplayName(e.name),pad,y,17,e.done?'#2e755a':'#354357',700);txt(`계획 ${dur(e.duration)} · 실제 ${dur(actual)}`,W-pad-225,y,14,'#7d8a99');y+=28;for(const t of e.items||[]){txt(`${t.checked?'☑':'□'}  ${t.name}`,pad+20,y,15,t.checked?'#4c8168':'#657081');y+=25}y+=23;line(y-8,y-8,pad,W-pad,'#e9edf3')}
y+=30;txt('시간 기록',pad,y,20,'#2e3b4e',700);y+=30;if(!r.logs.length){txt('타이머로 완료한 기록이 없습니다.',pad,y,15,'#89929f');y+=25}for(const l of r.logs){const time=l.at?new Date(l.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'';txt(`${l.kind==='break'?'휴식  ':'공부  '}${l.name}`,pad,y,15,'#455166',550);txt(`${time} 종료  ·  ${dur(l.minutes)}`,W-pad-222,y,14,'#7f8a99');y+=35}y+=20;txt('데이터 출처: 이 브라우저의 저장된 공부 기록',pad,Math.min(H-53,y+12),13,'#9aa4b2');return {canvas:c,height:H,width:W}}

function pdfBytes(pages){const enc=new TextEncoder(),out=[];let total=0,offsets=[0];const push=x=>{out.push(x);total+=x.length};const ascii=s=>push(enc.encode(s));const bytes=b=>push(b);const W=595.28,H=841.89,M=30;ascii('%PDF-1.4\n');const objs=[];const add=o=>{objs.push(o);return objs.length};const catalog=add(null),pagesId=add(null);const pageRefs=[];for(const pg of pages){let imgId=add({type:'image',data:pg.bytes,width:pg.width,height:pg.height});let drawing=`q\n${(W-2*M).toFixed(2)} 0 0 ${(pg.height/pg.width*(W-2*M)).toFixed(2)} ${M} ${(H-M-pg.height/pg.width*(W-2*M)).toFixed(2)} cm\n/Im1 Do\nQ\n`;let contentId=add({type:'stream',data:enc.encode(drawing)});let pageId=add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im1 ${imgId} 0 R >> >> /Contents ${contentId} 0 R >>`);pageRefs.push(pageId)}objs[catalog-1]=`<< /Type /Catalog /Pages ${pagesId} 0 R >>`;objs[pagesId-1]=`<< /Type /Pages /Kids [${pageRefs.map(n=>`${n} 0 R`).join(' ')}] /Count ${pageRefs.length} >>`;for(let i=0;i<objs.length;i++){offsets.push(total);ascii(`${i+1} 0 obj\n`);let o=objs[i];if(typeof o==='string')ascii(o);else if(o.type==='image'){ascii(`<< /Type /XObject /Subtype /Image /Width ${o.width} /Height ${o.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${o.data.length} >>\nstream\n`);bytes(o.data);ascii('\nendstream')}else{ascii(`<< /Length ${o.data.length} >>\nstream\n`);bytes(o.data);ascii('\nendstream')}ascii('\nendobj\n')}let xref=total;ascii(`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`);for(let i=1;i<offsets.length;i++)ascii(`${String(offsets[i]).padStart(10,'0')} 00000 n \n`);ascii(`trailer\n<< /Size ${objs.length+1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`);return new Blob(out,{type:'application/pdf'})}
