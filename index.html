function dateISO(d){let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};function addDays(s,n){let a=new Date(s+'T12:00:00');a.setDate(a.getDate()+n);return dateISO(a)};function fmtDate(s){let d=new Date(s+'T12:00:00');return `${d.getMonth()+1}/${d.getDate()} (${['일','월','화','수','목','금','토'][d.getDay()]})`};function mins(s){let [a,b]=String(s).split(':').map(Number);return a*60+b};function clock(n){if(n>=1440)return '익일 '+clock(n-1440);if(n<0)return clock(n+1440);return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`};function dur(n){return n>=60?`${Math.floor(n/60)}시간${n%60?` ${n%60}분`:''}`:`${n}분`};function id(){return `x${Math.random().toString(36).slice(2,9)}`}

// Keep the original reference times as anchors; delays propagate along subsequent blocks.
function schedule(day){let prev=-Infinity,arr=[];for(let i=0;i<day.events.length;i++){const e=day.events[i];let start=e.kind==='sleep'?e.start:Math.max(e.start,prev),length=e.duration+Number(e.extra||0);if(e.kind==='flex'){const next=day.events.slice(i+1).find(x=>x.kind!=='flex');length=next?Math.max(0,next.start-start):length}let end=e.kind==='sleep'?start:start+length;prev=end;arr.push({...e,startComputed:start,endComputed:end,shiftTotal:Math.max(0,start-e.start)})}return arr}

const views=[['today','◷','오늘'],['days','▦','3일 계획'],['report','▥','기록'],['coach','✦','AI 조정'],['settings','⚙','설정']];
function renderNav(){for(let selector of ['#nav','#mobile-nav']){$(selector).innerHTML=views.map(([key,ico,label])=>`<button data-view="${key}" class="${view===key?'active':''}"><span>${ico}</span><span>${label}</span></button>`).join('')}}
function header(){let data={today:['오늘의 공부','계획이 밀려도 다시 수정하지 않아도 돼요. 남은 일정이 자동으로 움직입니다.'],days:['3일 단위 계획','매일 새로 짜지 않고, 3일마다 한 번만 전체 방향을 정해요.'],report:['날짜별 공부 기록','원하는 날을 선택해 체크리스트·공부시간을 확인하고 JPG/PDF로 저장해요.'],coach:['대화로 계획 조정','“행정법이 오래 걸렸어”라고 말하면 계획 수정안을 보여주는 화면이에요.'],settings:['생활 리듬 설정','기상·식사·취침 시간을 기록해 내 생활에 맞춘 일정을 만드세요.']}[view];$('#page-title').textContent=data[0];$('#page-desc').textContent=data[1];$('#current-date').textContent=fmtDate(dateISO(new Date()));}
function nowCard(){let e=active?state.days[active.day].events.find(x=>x.id===active.id):null;let next=state.days[dayIndex].events.find(x=>x.kind==='study'&&!x.done);let isBreak=active?.kind==='break';let display=e||next;let time=e?elapsed():0;let scheduled=e?.duration||next?.duration||0;let target=scheduled*60;let localM=new Date().getHours()*60+new Date().getMinutes();let currentBlock=schedule(state.days[dayIndex]).find(x=>localM>=x.startComputed&&localM<x.endComputed);let runState=isBreak?'쉬는 시간':active?'진행 중':currentBlock?'현재 예정':'다음 공부';let title=isBreak?'잠깐 쉬어도 괜찮아요':display?display.name:'오늘 할 공부를 모두 마쳤어요';let note=isBreak?`휴식 ${dur(scheduled)} 후 다음 공부로 이어져요.`:active?`계획 ${dur(scheduled)} · ${time>target?'예정 시간을 넘겼어도 자동으로 종료하지 않아요.':'공부 종료를 누르면 이후 일정이 알아서 조정돼요.'}`:next?`예정 ${dur(scheduled)} · 체크리스트와 타이머를 함께 사용할 수 있어요.`:'완료한 공부는 기록에서 확인할 수 있어요.';if(!active&&currentBlock){note=`현재 시간표: ${currentBlock.name} (${clock(currentBlock.startComputed)}–${clock(currentBlock.endComputed)}) · 실제 시작/종료는 아래 버튼으로 기록하세요.`}
let pct=target?Math.min(100,time/target*100):0;
return `<div class="card now-card" id="now-card"><div class="now-top"><span class="now-tag" id="now-tag">● ${runState}</span><span class="small muted" id="live-clock">${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</span></div><h2 class="now-title" id="now-title">${esc(title)}</h2><div class="now-note" id="now-note">${esc(note)}</div><div class="timer" id="timer-display">${active?`${clockTimer(time)}`:'00:00:00'}</div><div class="muted small" id="timer-status">${active?'실제 진행 시간':'시작 버튼을 누르면 실제 시간을 기록해요'}</div><div class="durationline"><div id="timer-bar" style="width:${pct}%"></div></div><div class="controls" id="session-buttons">${buttons()}</div></div>`}
function clockTimer(n){let h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':')}
function buttons(){if(!active){let e=state.days[dayIndex].events.find(x=>x.kind==='study'&&!x.done);return e?`<button class="btn" data-action="start-next">▶ 공부 시작</button><button class="btn outline" data-action="edit-next">✎ 체크리스트 편집</button>`:''}if(active.kind==='break'){return `<button class="btn" data-action="finish-break">✓ 쉬기 완료</button><button class="btn outline" data-action="pause">${pausedAt?'▶ 재개':'Ⅱ 잠깐 멈춤'}</button>`}if(active.kind==='meal'){return `<button class="btn" data-action="finish">✓ 식사 끝났어요</button><button class="btn outline" data-action="pause">${pausedAt?'▶ 재개':'Ⅱ 일시정지'}</button>`}return `<button class="btn" data-action="finish">✓ 공부 끝났어요</button><button class="btn outline" data-action="pause">${pausedAt?'▶ 재개':'Ⅱ 일시정지'}</button><button class="btn outline" data-action="continue">↗ 계속 공부</button>`}
function shortStats(){let es=state.days[dayIndex].events,studies=es.filter(e=>e.kind==='study'),done=studies.filter(e=>e.done).length,goal=studies.reduce((a,e)=>a+e.duration,0),logged=studies.reduce((a,e)=>a+(e.actual||0),0);let delay=es.reduce((a,e)=>a+(e.extra||0),0);return `<div class="summary"><div class="stat"><div class="muted small">체크 완료</div><strong>${done}/${studies.length}</strong><div class="small muted">공부 블록</div></div><div class="stat"><div class="muted small">실제 공부</div><strong>${dur(logged)}</strong><div class="small muted">목표 ${dur(goal)}</div></div><div class="stat"><div class="muted small">일정 이동</div><strong>+${delay}분</strong><div class="small muted">자동 반영됨</div></div></div>`}
function daySwitch(){return `<div class="day-switch">${state.days.map((d,i)=>`<button class="day-button ${i===dayIndex?'active':''}" data-day="${i}"><strong>DAY ${i+1}</strong><span>${fmtDate(d.date)}</span></button>`).join('')}</div>`}
function eventHTML(e){let isStudy=e.kind==='study',time=`${clock(e.startComputed)}${e.duration?'–'+clock(e.endComputed):''}`,done=e.done?'done':'';return `<div class="event" data-id="${e.id}"><div class="time">${time}</div><div class="track"><div class="dot ${done||e.subject}"></div></div><div class="event-body ${isStudy?'':'routine'} ${e.done?'isdone':''}"><div class="ev-row"><div class="ev-title ${done}">${esc(e.name)} ${isStudy?`<span class="muted small">· ${dur(e.duration)}</span>`:''}</div><div class="ev-tools">${isStudy?`<button class="mini" title="수정" data-action="edit-event" data-id="${e.id}">✎</button><button class="mini" title="완료 체크" data-action="toggle-done" data-id="${e.id}">${e.done?'↶':'✓'}</button>`:true?`<button class="mini" title="시간 변경" data-action="edit-event" data-id="${e.id}">✎</button>`:''}<button class="mini" aria-label="위로 이동" title="위로 이동" data-action="move-up" data-id="${e.id}">↑</button><button class="mini" aria-label="아래로 이동" title="아래로 이동" data-action="move-down" data-id="${e.id}">↓</button></div></div>${isStudy&&!e.items.length?`<div style="margin-top:8px"><button class="btn small soft" data-action="start-id" data-id="${e.id}">▷ 이 공부 시작</button></div>`:''}${e.kind==='meal'?`<div class="ev-detail">식사 시간을 실제로 기록하면 남은 일정이 자동으로 움직여요.</div><div style="margin-top:8px"><button class="btn small soft" data-action="start-id" data-id="${e.id}">▷ 식사 시작</button></div>`:''}${isStudy&&e.items.length?`<div class="task-checks">${e.items.map(ch=>`<label class="tick"><input type="checkbox" data-check="${ch.id}" data-event="${e.id}" ${ch.checked?'checked':''}><span>${esc(ch.name)}</span></label>`).join('')}<div class="rowbtn">${!e.done?`<button class="btn small soft" data-action="start-id" data-id="${e.id}">▷ 이 공부 시작</button>`:''}<button class="btn small outline" data-action="delay" data-id="${e.id}">+ 걸린 시간 기록</button></div></div>`:e.kind!=='sleep'?`<div class="rowbtn" style="margin-top:8px"><button class="btn small outline" data-action="delay" data-id="${e.id}">+ 걸린 시간 기록</button></div>`:''}${e.kind!=='sleep'?`<button class="mini small" style="margin-top:8px" data-action="add-after" data-id="${e.id}">＋ 이 일정 다음에 추가</button>`:''}${e.extra?`<div class="shift">예정보다 +${e.extra}분 · 이후 일정에 반영</div>`:''}</div></div>`}
function today(){let d=state.days[dayIndex];return `<div class="grid cols"><div class="grid"><div class="card"><div class="card-head"><h2>오늘의 흐름</h2><span class="pill">3일 계획 · ${state.cycle}회차</span></div>${daySwitch()}<div style="height:20px"></div>${shortStats()}</div><div class="card"><div class="card-head"><h2>유연하게 움직이는 시간표</h2><button class="btn small soft" data-action="add-task">+ 할 일 추가</button></div><div class="foot-note" style="margin:-6px 0 15px">선택한 날짜만 수정돼요. 일정의 ✎로 시간을 바꾸거나 ↑↓로 순서를 옮기세요. 사이에 추가하면 이후 일정이 자동 조정돼요.</div><div class="timeline">${schedule(d).map(eventHTML).join('')}</div>${scheduleWarning(d)}<p class="foot-note">※ 로그인 상태에서는 계정에 자동 저장돼요. 취침 이후로 밀린 일정은 시간표의 겹침 안내를 확인하세요.</p></div></div><div class="grid" style="align-content:start"><div>${nowCard()}</div><div class="card"><div class="card-head"><h3>미뤄진 시간은 자동 조정</h3><span class="pill green">자동 재배치</span></div><p class="muted" style="line-height:1.8">아침 식사가 5분 길어지거나 구문에 20분 더 걸려도 이후 블록을 일일이 수정하지 않아요.</p><div class="chips"><button class="chip" data-action="quick-extra" data-m="5">아침 +5분</button><button class="chip" data-action="quick-extra" data-m="15">행정법 +15분</button><button class="chip" data-action="quick-extra" data-m="20">구문 +20분</button></div><div class="foot-note">취침 전까지 끝내지 못한 과제는 체크 상태를 유지하고, 다음 3일 계획을 만들 때 재배치할 수 있어요.</div></div><div class="card"><div class="card-head"><h3>오늘 꼭 해야 할 것</h3></div><div style="display:grid;gap:13px">${d.events.filter(e=>e.kind==='study'&&!e.done).slice(0,4).map(e=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span>${esc(e.name)}</span><span class="muted small">${dur(e.duration)}</span></div>`).join('')||'<p class="muted small">모든 공부 완료!</p>'}</div></div></div></div>`}
function days(){let dayCards=state.days.map((d,i)=>{let tasks=d.events.filter(e=>e.kind==='study'),done=tasks.filter(e=>e.done).length;return `<div class="day-card ${i===dayIndex?'selected':''}"><span class="pill">DAY ${i+1} · ${fmtDate(d.date)}</span><h3>${['기초를 쌓는 날','배운 내용을 연결하는 날','복습하며 다듬는 날'][i]}</h3><div class="muted small">${done}/${tasks.length} 블록 완료</div><div class="day-list">${tasks.map(e=>`<div><span><i class="list-bullet" style="background:${colors[e.subject]||'#cdd3da'}"></i>${esc(e.name)}</span><span>${dur(e.duration)}</span></div>`).join('')}</div><button class="btn outline small" data-day="${i}" data-go="today">DAY ${i+1} 열기</button></div>`}).join('');return `<div class="card" style="margin-bottom:18px"><div class="card-head"><h2>계획은 3일에 한 번만</h2><span class="pill gray">과도한 매일 계획 방지</span></div><p class="section-intro">하루를 못 지켰다고 다음 날 계획을 새로 쓰지 않아요. 체크한 실제 기록을 바탕으로 3일마다 할 일을 조정해요.</p><div class="controls"><button class="btn" data-action="new-cycle">다음 3일 계획 만들기 ↗</button><button class="btn outline" data-action="export">계획·기록 백업</button></div></div><div class="three">${dayCards}</div><p class="foot-note">다음 회차를 만들면 지난 3일의 미완료 공부 중 일부가 다음 계획의 체크리스트로 넘어갑니다. 현재 기록은 분석에 보존돼요.</p>`}
function allDates(){return [...new Set([...Object.keys(state.archivedDays||{}),...state.days.map(d=>d.date),...(state.logs||[]).map(l=>l.date).filter(Boolean)])].sort()}
function getDay(date){return state.days.find(d=>d.date===date) || state.archivedDays?.[date] || null}
function reportInfo(date){let day=getDay(date);let logs=(state.logs||[]).filter(l=>l.date===date),studies=day?day.events.filter(e=>e.kind==='study'):[],planned=studies.reduce((s,e)=>s+e.duration,0),actual=logs.filter(l=>l.kind==='study').reduce((s,e)=>s+Number(e.minutes||0),0),done=studies.filter(e=>e.done).length,items=studies.flatMap(e=>e.items||[]),checked=items.filter(x=>x.checked).length;return {day,logs,studies,planned,actual,done,items,checked}}
function report(){let info=reportInfo(reportDate),all=allDates();let summary=info.studies.map(e=>{let actual=info.logs.filter(l=>l.kind==='study'&&l.name===e.name).reduce((n,l)=>n+Number(l.minutes||0),0)||e.actual||0;return `<div class="archive-task"><h3>${e.done?'✓ ':'○ '}${esc(e.name)}</h3><small>예정 ${dur(e.duration)} · 실제 ${dur(actual)}${e.extra?` · 지연 +${e.extra}분`:''}</small>${(e.items||[]).map(t=>`<div class="item ${t.checked?'checked':''}">${t.checked?'☑':'□'} ${esc(t.name)}</div>`).join('')}</div>`}).join('');let recent=all.filter(x=>x<=dateISO(new Date())).slice(-5).reverse();return `<div class="grid layouttwo"><div class="grid"><div class="card"><div class="card-head"><h2>날짜별 공부 기록</h2><span class="pill green">기록 자동 저장</span></div><p class="section-intro">어제, 오늘, 이전 3일 계획까지 날짜별로 확인하고 내보낼 수 있어요.</p><div class="archive-bar"><button class="btn outline small" data-action="report-prev">← 전날</button><input type="date" id="report-date" aria-label="보고 싶은 날짜 선택" value="${reportDate}"><button class="btn outline small" data-action="report-next">다음 날 →</button><button class="btn soft small" data-action="report-today">오늘</button></div><div class="archive-stats"><div class="stat"><span class="small muted">실제 공부</span><strong>${dur(info.actual)}</strong></div><div class="stat"><span class="small muted">공부 블록</span><strong>${info.done}/${info.studies.length}</strong></div><div class="stat"><span class="small muted">체크 과제</span><strong>${info.checked}/${info.items.length}</strong></div></div><h3>${esc(fmtDate(reportDate))} 학습 상세</h3>${info.day?summary||'<div class="empty">등록된 공부 블록이 없어요.</div>':'<div class="empty" style="margin-top:12px">선택한 날짜의 계획이 없어요. 타이머 기록이 남아 있다면 아래에서 볼 수 있어요.</div>'}${info.logs.length?`<div style="margin-top:19px"><h3>실제 진행 기록</h3><div class="report-list" style="margin-top:9px">${info.logs.map(l=>`<div class="report-row"><strong>${esc(l.name)}</strong><div class="meta">${new Date(l.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})} 종료 · ${dur(l.minutes)}</div></div>`).join('')}</div></div>`:''}<div class="archive-notice">JPG·PDF는 선택한 날짜의 학습 현황을 이미지 보고서로 내보냅니다. 전체 데이터 복구는 설정의 JSON 백업을 사용하세요.</div><div class="backup-tools"><button class="btn" data-action="export-jpg">↓ JPG 저장</button><button class="btn outline" data-action="export-pdf">↓ PDF 저장</button></div></div></div><div class="grid" style="align-content:start"><div class="card"><h2>최근 날짜 바로가기</h2><div class="chips">${recent.map(d=>`<button class="chip" data-action="report-date" data-date="${d}">${fmtDate(d)}</button>`).join('')||'<span class="muted small">아직 기록이 없습니다.</span>'}</div></div><div class="card"><h2>공부시간 누적</h2>${['english','law','admin','korean'].map(sub=>{let total=(state.logs||[]).filter(l=>l.kind==='study'&&l.subject===sub).reduce((n,l)=>n+Number(l.minutes||0),0);return `<div class="reportbar"><strong>${names[sub]}</strong><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,total/420*100)}%;background:${colors[sub]}"></div></div><span class="muted">${dur(total)}</span></div>`}).join('')}<p class="foot-note">시간 기록은 타이머 종료를 기준으로 집계됩니다. 체크만 한 과제는 실제 공부시간에 합산되지 않습니다.</p></div><div class="card"><h2>시간이 오래 걸린 공부</h2>${[...state.days,...Object.values(state.archivedDays||{})].flatMap(d=>d.events.filter(e=>e.extra>0).map(e=>({...e,date:d.date}))).sort((a,b)=>b.extra-a.extra).slice(0,5).map(e=>`<div class="report-row" style="margin-top:9px"><strong>${esc(e.name)}</strong><span style="float:right;color:#b17845">+${e.extra}분</span><div class="meta">${fmtDate(e.date)}</div></div>`).join('')||'<p class="foot-note">아직 초과 기록이 없어요.</p>'}</div></div></div>`}
function coach(){let messages=state.chat.map(m=>`<div class="bubble ${m.role}">${esc(m.text)}</div>`).join('');let s=state.pendingSuggestion;return `<div class="grid layouttwo"><div class="card"><div class="card-head"><h2>대화로 시간 조정</h2><span class="pill amber">AI 연동 전 체험</span></div><p class="section-intro">현재 시안은 실제 AI가 아니라 키워드·숫자를 인식하는 간단한 조정 기능입니다. 실제 AI 서비스 연결은 별도 개발이 필요해요.</p><div class="chips"><button class="chip" data-prompt="영어 30분 늘려줘">영어 30분 늘려줘</button><button class="chip" data-prompt="국어 15분 줄여줘">국어 15분 줄여줘</button><button class="chip" data-prompt="행정법 20분 늘려줘">행정법 20분 늘려줘</button></div><div class="chat-feed" id="chat-feed">${messages}</div>${s?`<div class="recommend"><strong>계획 수정 제안</strong><div class="muted small">${esc(s.subjectName)} · ${s.delta>0?'+':''}${s.delta}분 (하루 기준, 현재 3일 계획)</div><div class="controls" style="margin-top:12px"><button class="btn small" data-action="apply-suggestion">3일 계획에 적용</button><button class="btn outline small" data-action="dismiss-suggestion">취소</button></div></div>`:''}<form id="chat-form" class="sendbox"><input name="message" aria-label="계획 변경 요청" placeholder="예: 행정학 15분 더 늘려줘" autocomplete="off" required><button class="btn" type="submit">보내기</button></form></div><div class="grid" style="align-content:start"><div class="card"><h3>완성형 AI 코치에서 할 일</h3><div style="display:grid;gap:15px;margin-top:19px;line-height:1.7"><div><strong>① 학습시간 비교</strong><div class="muted small">계획한 시간과 실제 소요시간을 분석</div></div><div><strong>② 무리한 목표 탐지</strong><div class="muted small">3일 연속 미달성 과제를 찾아 분량 재설계</div></div><div><strong>③ 대화로 승인</strong><div class="muted small">“영어 더 하고 국어 줄여줘”를 일정 수정안으로 제시</div></div><div><strong>④ 수정 전 확인</strong><div class="muted small">사용자가 승인해야 실제 일정에 반영</div></div></div></div></div></div>`}
function settings(){let c=state.settings;return `<div class="grid layouttwo"><div class="card"><div class="card-head"><h2>고정 생활 리듬</h2><span class="pill">08:00 기상 · 23:00 취침</span></div><p class="section-intro">기상과 취침은 고정하고, 식사와 휴식은 조금 늘어져도 다음 일정에 자동 반영해요.</p><form id="settings-form"><div class="form-row"><div class="field"><label>기상</label><input name="wake" type="time" value="${c.wake}" required></div><div class="field"><label>점심</label><input name="lunch" type="time" value="${c.lunch}" required></div><div class="field"><label>저녁</label><input name="dinner" type="time" value="${c.dinner}" required></div><div class="field"><label>취침</label><input name="sleep" type="time" value="${c.sleep}" required></div><div class="field"><label>기본 휴식시간(분)</label><input name="breakMin" type="number" min="5" max="60" value="${c.breakMin}" required></div></div><div class="controls" style="margin-top:21px"><button class="btn" type="submit">생활패턴 저장</button></div></form><p class="foot-note">기존 3일 계획에서 이미 편집한 학습 블록은 유지하고, 이후 새 3일 계획을 생성할 때 생활시간 변경을 적용합니다.</p></div><div class="grid" style="align-content:start"><div class="card"><h3>데이터 관리</h3><p class="muted" style="line-height:1.7;margin:11px 0 18px">로그인 후 서버 저장 완료가 표시되면 같은 계정의 다른 기기에서도 기록을 불러올 수 있어요. JSON 백업도 내려받을 수 있어요.</p><div class="controls"><button class="btn soft" data-action="export">↓ 기록 백업(JSON)</button><button class="btn outline" data-action="import">↑ 기록 가져오기</button></div><input id="import-file" type="file" accept="application/json" class="hidden" /></div><div class="card"><h3>저장 방식 · 꼭 확인해주세요</h3><p class="muted" style="line-height:1.8;margin-top:11px">로그인 후 변경 내용은 기기와 서버에 저장됩니다. <strong>서버 저장 완료</strong>를 확인한 뒤 다른 기기로 이동하세요. 다른 기기 기록은 접속·로그인할 때 또는 상단 동기화 버튼으로 불러옵니다. 동시에 수정하면 자동 덮어쓰기를 멈추고 충돌을 안내합니다. 서버 기록은 수정하는 날 첫 수정 직전 상태를 자동 보관합니다. 자동 보관본에서 JSON을 내려받아 복원할 수 있습니다. 비로그인 기록과 미전송 변경은 해당 브라우저에만 남습니다. 서버 저장과 별도로 중요한 기록은 JSON으로 보관하세요. 푸시 알림·실제 AI 대화는 아직 지원하지 않습니다.</p></div></div></div>`}
function render(){paintAccount();renderNav();header();let body={today,days,report,coach,settings}[view]();$('#content').innerHTML=body;const feed=$('#chat-feed');if(feed)feed.scrollTop=feed.scrollHeight;updateClock()}
function updateClock(){const c=$('#live-clock');if(c)c.textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});const t=$('#timer-display');if(t&&active){let sec=elapsed(),total=active.duration*60;t.textContent=clockTimer(sec);let bar=$('#timer-bar');if(bar)bar.style.width=`${total?Math.min(100,sec/total*100):0}%`;let status=$('#timer-status');if(status)status.textContent=sec>total&&!active.kind?.includes('break')?`예정 시간보다 ${dur(Math.ceil((sec-total)/60))} 더 공부 중 · 강제로 종료되지 않아요`:pausedAt?'일시정지됨':active.kind==='break'?'휴식 중 · 원할 때 완료할 수 있어요':'실제 진행 시간';let note=$('#now-note');if(note&&sec>total&&active.kind!=='break')note.textContent='예정된 쉬는 시간이 되어도 공부를 이어갈 수 있어요. 완료 버튼을 누르면 그때부터 휴식이 시작됩니다.'}}
function startTask(id){if(active){alert('진행 중인 공부 또는 휴식을 먼저 종료해주세요.');return}let e=state.days[dayIndex].events.find(e=>e.id===id);if(!e)return;let plan=schedule(state.days[dayIndex]).find(x=>x.id===e.id),now=new Date(),nowMin=now.getHours()*60+now.getMinutes();let sameDay=state.days[dayIndex].date===dateISO(now);let startLag=sameDay?Math.max(0,nowMin-(plan?.startComputed||0)):0;active={id,kind:e.kind,day:dayIndex,duration:e.duration,startLag,startedAtIso:now.toISOString()};held=0;startedAt=Date.now();pausedAt=null;persistSession();render()}
function pause(){if(!active)return;if(!pausedAt){held=elapsed();pausedAt=Date.now()}else{startedAt=Date.now();pausedAt=null}persistSession();render()}
function finishSession(){if(!active)return;let a=active;let secs=elapsed();let day=state.days[a.day],e=day.events.find(e=>e.id===a.id);if(!e)return;let actual=Math.max(1,Math.ceil(secs/60));e.actual=(e.actual||0)+actual;e.done=true;e.extra=(e.extra||0)+Math.max(0,(a.startLag||0)+actual-e.duration);(e.logs||(e.logs=[])).push({minutes:actual,at:new Date().toISOString()});state.logs.push({kind:e.kind,name:e.name,subject:e.subject,minutes:actual,at:new Date().toISOString(),startAt:a.startedAtIso||new Date(Date.now()-secs*1000).toISOString(),date:day.date});active=null;pausedAt=null;held=0;persistSession();let i=day.events.findIndex(x=>x.id===e.id);let next=day.events[i+1];if(next?.kind==='break'){active={id:next.id,kind:'break',day:a.day,duration:next.duration};startedAt=Date.now();pausedAt=null;held=0;persistSession()}render()}
function finishBreak(){if(!active||active.kind!=='break')return;let b=active,sec=elapsed(),day=state.days[b.day],e=day.events.find(x=>x.id===b.id);let actual=Math.max(1,Math.ceil(sec/60));e.done=true;e.actual=actual;e.extra=(e.extra||0)+Math.max(0,actual-e.duration);state.logs.push({kind:'break',name:'휴식',subject:'',minutes:actual,at:new Date().toISOString(),date:day.date});active=null;held=0;pausedAt=null;persistSession();render()}
function delayModal(eventId){let e=state.days[dayIndex].events.find(x=>x.id===eventId);if(!e)return;$('#modals').innerHTML=`<div class="modal-cover"><div class="modal"><h3>예정보다 오래 걸렸나요?</h3><p class="muted" style="line-height:1.7">${esc(e.name)}에 추가로 걸린 시간을 넣으면 이후 일정이 자동으로 이동해요.</p><div class="chips"><button class="chip" data-action="set-delay" data-id="${e.id}" data-min="5">+5분</button><button class="chip" data-action="set-delay" data-id="${e.id}" data-min="10">+10분</button><button class="chip" data-action="set-delay" data-id="${e.id}" data-min="15">+15분</button><button class="chip" data-action="set-delay" data-id="${e.id}" data-min="20">+20분</button></div><form id="delay-form"><input type="hidden" name="event" value="${e.id}"><div class="field"><label>직접 입력 (분)</label><input name="minutes" type="number" min="1" max="240" value="5" required></div><div class="controls"><button type="button" data-action="close-modal" class="btn outline">닫기</button><button class="btn" type="submit">일정에 반영</button></div></form></div></div>`}
function editModal(eventId){let e=state.days[dayIndex].events.find(x=>x.id===eventId);if(!e)return;$('#modals').innerHTML=`<div class="modal-cover"><div class="modal"><h3>일정 수정 · ${fmtDate(state.days[dayIndex].date)}</h3><p class="foot-note">이 날짜의 일정만 바뀌어요. 시작 시간을 바꾸면 해당 시간 순서로 이동해요.</p><form id="edit-form"><input type="hidden" name="event" value="${e.id}"><div class="field"><label>일정 이름</label><input name="name" value="${esc(e.name)}" required></div><div class="form-row"><div class="field"><label>예정 시작 시간</label><input name="start" type="time" value="${clock(e.start)}" required></div><div class="field"><label>예상 시간 (분)</label><input name="duration" type="number" min="${e.kind==='sleep'?0:1}" max="1440" value="${e.duration}" required></div></div>${e.kind==='study'?`<div class="field"><label>과목</label><select name="subject">${Object.entries(names).map(([k,v])=>`<option value="${k}" ${e.subject===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>체크리스트 (한 줄에 한 항목)</label><textarea name="items" rows="4">${esc(e.items.map(x=>x.name).join('\n'))}</textarea></div>`:''}<div class="controls" style="justify-content:space-between"><button type="button" class="btn red" data-action="delete-event" data-id="${e.id}">일정 삭제</button><div class="controls"><button type="button" data-action="close-modal" class="btn outline">취소</button><button class="btn" type="submit">저장</button></div></div></form></div></div>`}

function addModal(afterId){let d=state.days[dayIndex],computed=schedule(d),after=d.events.find(x=>x.id===afterId);const options=[['time','시작 시간으로 배치'],['first','하루 맨 앞에 추가'],...d.events.filter(e=>e.kind!=='sleep').map(e=>[e.id,`${clock(e.start)} ${e.name} 다음`])];let selected=after&&after.kind!=='sleep'?after.id:'time',start=after?computed.find(x=>x.id===after.id).endComputed:mins('09:00');$('#modals').innerHTML=`<div class="modal-cover"><div class="modal"><h3>할 일 추가 · ${fmtDate(d.date)}</h3><p class="foot-note">공부·약속·이동·휴식 등 오늘 필요한 일정을 넣으세요.</p><form id="add-form"><div class="field"><label>일정 이름</label><input name="name" placeholder="예: 영어 복습 / 병원 / 외출" required></div><div class="form-row"><div class="field"><label>일정 종류</label><select name="kind"><option value="study">공부</option><option value="routine">개인 일정 · 이동</option><option value="break">휴식</option><option value="meal">식사</option></select></div><div class="field"><label>시간 (분)</label><input name="duration" type="number" min="1" max="1440" value="30" required></div></div><div class="field"><label>추가할 위치</label><select name="placement" id="add-placement">${options.map(([k,v])=>`<option value="${esc(k)}" ${k===selected?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="field" id="add-time-field" style="margin-top:12px;${selected==='time'?'':'display:none'}"><label>시작 시간</label><input name="start" type="time" value="${clock(Math.min(1439,start))}" required></div><div class="field" style="margin-top:12px"><label>과목 (공부 일정에 적용)</label><select name="subject">${Object.entries(names).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>체크리스트 (한 줄에 한 항목)</label><textarea name="items" rows="3" placeholder="선택 입력"></textarea></div><div class="controls"><button type="button" data-action="close-modal" class="btn outline">취소</button><button class="btn" type="submit">이 날짜에 추가</button></div></form></div></div>`}

function scheduleWarning(day){const plan=schedule(day),sleep=plan.find(e=>e.kind==='sleep');if(!sleep)return '';const over=plan.filter(e=>e.kind!=='sleep'&&e.kind!=='flex'&&e.endComputed>sleep.startComputed);return over.length?`<div class="backup-alert">${over.length}개 일정이 취침 시간과 겹치거나 이후에 끝나요. 일정 시간·분량을 줄이거나 오늘 취침 시간을 수정하세요.</div>`:''}
function canEditEvent(eventId){if(active&&active.id===eventId&&active.day===dayIndex){alert('진행 중인 타이머를 종료한 뒤 이 일정을 수정해주세요.');return false}return true}

function moveEvent(eventId,direction){const day=state.days[dayIndex],i=day.events.findIndex(x=>x.id===eventId),j=i+direction;if(i<0||j<0||j>=day.events.length)return;if(day.events[i].kind==='sleep'||day.events[j].kind==='sleep'){alert('취침은 시작 시간을 수정해서 이동해주세요.');return}if(!canEditEvent(eventId)||!canEditEvent(day.events[j].id))return;const first=Math.min(i,j),anchor=day.events[first].start;[day.events[i],day.events[j]]=[day.events[j],day.events[i]];day.events[first].start=anchor;day.events[first+1].start=anchor+day.events[first].duration;save();render()}

function paintAccount(){let root=document.getElementById('cloud-account');if(!root)return;root.innerHTML=`<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div><strong>${cloudUser?esc(cloudUser.email):'공부루틴 · 계정 연결'}</strong><p style="font-size:12px;margin-top:7px;line-height:1.7" role="status">${esc(cloudMessage)}</p></div><div class="controls">${cloudUser?'<button class="btn small outline" data-cloud="retry">동기화</button><button class="btn small outline" data-cloud="backups">자동 보관본</button><button class="btn small plain" data-cloud="logout">로그아웃</button>':'<button class="btn small" data-cloud="login">로그인 / 가입</button>'}${cloudConflict?'<button class="btn small soft" data-cloud="resolve">충돌 해결</button>':''}</div></div>`}
function queueCloud(){if(!cloudUser)return;cloudDirty=true;try{localStorage.setItem(cloudMetaKey(),JSON.stringify({revision:cloudRevision,dirty:true}))}catch(e){}if(!cloudReady||cloudConflict)return;cloudStatus('기기에 저장됨 · 서버 저장 대기');clearTimeout(cloudTimer);cloudTimer=setTimeout(flushCloud,1000)}
async function flushCloud(){if(!cloudClient||!cloudUser||!cloudReady||cloudConflict||cloudBusy||!cloudDirty)return;cloudBusy=true;const uid=cloudUser.id, payload=JSON.stringify(state),rev=cloudRevision;cloudStatus('서버에 저장 중…');try{const data=JSON.parse(payload);let result=rev===0?await cloudClient.from('study_state').insert({user_id:uid,data,revision:1}).select('revision').single():await cloudClient.from('study_state').update({data,revision:rev+1}).eq('user_id',uid).eq('revision',rev).select('revision').maybeSingle();if(result.error){if(result.error.code==='23505')throw new Error('CONFLICT');throw result.error}if(!result.data)throw new Error('CONFLICT');cloudRevision=result.data.revision;cloudDirty=JSON.stringify(state)!==payload;localStorage.setItem(cloudMetaKey(),JSON.stringify({revision:cloudRevision,dirty:cloudDirty}));cloudStatus(cloudDirty?'추가 변경 저장 대기':'서버 저장 완료 · '+new Date().toLocaleTimeString('ko-KR'));}catch(e){if(e.message==='CONFLICT'){cloudConflict=true;cloudStatus('다른 기기에서 변경됐어요. 이 기기 기록은 유지 중 · 충돌 해결을 눌러주세요.')}else cloudStatus('서버 저장 실패 · 기기 기록 유지 중. 연결·DB 설정 확인 후 동기화해주세요.')}finally{cloudBusy=false;if(cloudDirty&&!cloudConflict)cloudTimer=setTimeout(flushCloud,15000)}}
function installStudy(s){if(!validStudy(s))throw Error('기록 형식을 확인할 수 없어요.');state=s;state.archivedDays=state.archivedDays||{};const a=state.activeSession;active=a?.active||null;startedAt=a?.startedAt||null;pausedAt=a?.pausedAt||null;held=a?.held||0;dayIndex=a?.dayIndex||0;view='today';localStorage.setItem(storageKey(),JSON.stringify(state));render()}
async function hydrateUser(user){if(cloudLoading)return;cloudLoading=true;document.querySelector('.layout').inert=true;try{cloudReady=false;cloudUser=user;paintAccount();const saved=localStorage.getItem(storageKey());let local=saved?JSON.parse(saved):null,meta=JSON.parse(localStorage.getItem(cloudMetaKey())||'{}');const {data,error}=await cloudClient.from('study_state').select('data,revision').eq('user_id',user.id).maybeSingle();if(error)throw error;if(data){if(meta.dirty&&local){installStudy(local);cloudRevision=Number(meta.revision)||0;cloudDirty=true;if(cloudRevision!==data.revision){cloudConflict=true;cloudStatus('다른 기기의 변경과 미전송 기록이 있어요. 충돌 해결을 눌러주세요.')}}else{installStudy(data.data);cloudRevision=data.revision;cloudDirty=false;cloudStatus('서버 기록 불러옴 · 자동 저장 켜짐')}}else{cloudRevision=0;const guest=JSON.parse(localStorage.getItem(guestKey)||'null');if(local)installStudy(local);else if(validStudy(guest)&&confirm('이 브라우저의 기존 공부 기록을 로그인한 계정으로 옮길까요?'))installStudy(guest);else installStudy(createState());cloudDirty=true;cloudStatus('첫 계정 기록을 서버에 저장할 준비가 됐어요.')}cloudReady=true;if(cloudDirty&&!cloudConflict)await flushCloud();}catch(e){cloudReady=false;cloudStatus('계정 기록을 불러오지 못했어요. 아직 서버 연결이 완료되지 않았습니다.');}finally{cloudLoading=false;document.querySelector('.layout').inert=false;paintAccount()}}
function accountModal(){document.getElementById('modals').innerHTML=`<div class="modal-cover"><div class="modal"><h3>공부루틴 로그인</h3><p class="foot-note">Supabase 관리자 계정과 별개인 공부루틴 계정이에요. 모든 기기에서 같은 이메일로 로그인하세요.</p><form id="cloud-login-form"><div class="field" style="margin:16px 0"><label>이메일</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>비밀번호 (8자 이상)</label><input name="password" type="password" minlength="8" autocomplete="current-password" required></div><p id="cloud-auth-note" class="foot-note" role="status"></p><div class="controls"><button type="button" class="btn outline" data-action="close-modal">닫기</button><button class="btn outline" name="mode" value="signup">처음 가입</button><button class="btn" name="mode" value="login">로그인</button></div></form></div></div>`}
async function resolveCloud(){if(active){alert('타이머를 종료한 뒤 충돌을 해결해주세요.');return}exportData();if(!confirm('현재 기기 기록의 JSON 백업을 내려받았습니다. 서버의 최신 기록을 불러올까요? 이 기기의 미전송 변경은 백업 파일에 남고 자동 병합되지 않습니다.'))return;cloudBusy=true;try{const {data,error}=await cloudClient.from('study_state').select('data,revision').eq('user_id',cloudUser.id).single();if(error)throw error;installStudy(data.data);cloudRevision=data.revision;cloudDirty=false;cloudConflict=false;localStorage.setItem(cloudMetaKey(),JSON.stringify({revision:cloudRevision,dirty:false}));cloudStatus('서버 최신 기록 불러옴 · 기기 변경은 JSON 백업으로 보관');}catch(e){cloudStatus('불러오기 실패 · 기존 기기 기록 유지')}finally{cloudBusy=false}}
async function showCloudBackups(){const {data,error}=await cloudClient.from('study_backups').select('backup_day,created_at').eq('user_id',cloudUser.id).order('backup_day',{ascending:false}).limit(30);if(error){alert('자동 보관본을 불러오지 못했어요. DB 설정을 확인해주세요.');return}document.getElementById('modals').innerHTML=`<div class="modal-cover"><div class="modal"><h3>자동 보관본</h3><p class="foot-note">서버 기록을 수정하는 날, 첫 수정 직전 기록을 따로 보관해요. 아래 날짜를 누르면 복구용 JSON을 내려받습니다.</p><div class="controls" style="max-height:300px;overflow:auto;margin-top:14px">${data.length?data.map(b=>`<button class="btn outline small" data-cloud-backup="${esc(b.backup_day)}">${esc(b.backup_day)} JSON</button>`).join(''):'아직 보관본이 없어요.'}</div><div class="controls"><button class="btn outline" data-action="close-modal">닫기</button></div></div></div>`}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-cloud],[data-cloud-backup]');if(!b)return;if(b.dataset.cloudBackup){const {data,error}=await cloudClient.from('study_backups').select('data').eq('user_id',cloudUser.id).eq('backup_day',b.dataset.cloudBackup).single();if(error){alert('다운로드 실패');return}downloadBlob(new Blob([JSON.stringify(data.data,null,2)],{type:'application/json'}),'공부루틴_자동보관_'+b.dataset.cloudBackup+'.json');return}const action=b.dataset.cloud;if(action==='login'){if(!cloudClient){alert('로그인 모듈을 불러오는 중이거나 연결되지 않았어요. 인터넷 연결 후 새로고침해주세요.');return}accountModal()}else if(action==='retry'){if(!cloudReady)await hydrateUser(cloudUser);else if(cloudConflict)await resolveCloud();else if(cloudDirty)await flushCloud();else{if(active){cloudStatus('타이머 종료 후 다른 기기 기록을 불러올 수 있어요.');return}await hydrateUser(cloudUser)}}else if(action==='resolve')await resolveCloud();else if(action==='backups')await showCloudBackups();else if(action==='logout'){if(active){alert('진행 중인 타이머를 종료해주세요.');return}await flushCloud();if(cloudDirty){alert('미전송 기록이 있어요. 동기화 또는 충돌 해결 후 로그아웃해주세요.');return}const {error}=await cloudClient.auth.signOut({scope:'local'});if(error){cloudStatus('로그아웃 실패 · 다시 시도해주세요.');return}cloudUser=null;cloudReady=false;cloudRevision=0;cloudConflict=false;cloudDirty=false;installStudy(JSON.parse(localStorage.getItem(guestKey)||'null')||createState());cloudStatus('로그아웃됨 · 이 브라우저의 비로그인 기록')}});
document.addEventListener('submit',async e=>{if(e.target.id!=='cloud-login-form')return;e.preventDefault();const f=e.target,form=new FormData(f),note=document.getElementById('cloud-auth-note'),mode=e.submitter?.value||'login';const email=String(form.get('email')).trim(),password=String(form.get('password'));for(const b of f.querySelectorAll('button'))b.disabled=true;note.textContent='처리 중…';try{const r=mode==='signup'?await cloudClient.auth.signUp({email,password,options:{emailRedirectTo:'https://y-inny.github.io/gongbu-routine/'}}):await cloudClient.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(r.data.session){document.getElementById('modals').innerHTML='';await hydrateUser(r.data.user)}else note.textContent='가입 확인 메일을 확인해주세요. 인증 후 같은 이메일과 비밀번호로 로그인하세요.';}catch(err){note.textContent='처리하지 못했어요: '+err.message}finally{for(const b of f.querySelectorAll('button'))b.disabled=false}});
window.addEventListener('online',()=>{if(cloudUser){if(cloudReady)flushCloud();else hydrateUser(cloudUser)}});
window.addEventListener('beforeunload',e=>{if(cloudUser&&cloudDirty){e.preventDefault();e.returnValue=''}});
async function initCloud(){paintAccount();try{const lib=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');cloudClient=lib.createClient(cloudUrl,cloudKey);const {data,error}=await cloudClient.auth.getSession();if(error)throw error;if(data.session)await hydrateUser(data.session.user);cloudClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'&&cloudUser&&!cloudLoading){cloudReady=false;cloudStatus('로그인 세션이 종료됐어요. 다시 로그인해주세요.')}});}catch(e){cloudStatus('로그인 연결 실패 · 인터넷 연결 후 새로고침해주세요. 기기 저장은 계속됩니다.')}}

bind();render();tickHandle=setInterval(updateClock,1000);initCloud();
})();
</script></body></html>
