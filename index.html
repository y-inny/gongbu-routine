function longDate(date){const d=new Date(date+'T12:00:00');return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${['일','월','화','수','목','금','토'][d.getDay()]}요일`}

function dayCompositionHTML(info){const mode=reportCompositionMode==='auto'?(info.logs.length?'actual':'plan'):reportCompositionMode,segments=compositionSegments(info,mode),sum=segments.reduce((n,e)=>n+e.chartMinutes,0),C=2*Math.PI*105;let offset=0;const labels=[];const rings=segments.map((e,index)=>{const length=e.chartMinutes/sum*C,visible=Math.max(length*.75,length-1.6),selected=reportSelectedRecord===e.recordKey,angle=(offset+length/2)/C*2*Math.PI-Math.PI/2,x=150+105*Math.cos(angle),y=150+105*Math.sin(angle);if(length>=21)labels.push(`<g class="composition-number" aria-hidden="true"><circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="9.5"/><text x="${x.toFixed(2)}" y="${(y+3.1).toFixed(2)}" text-anchor="middle">${index+1}</text></g>`);const svg=`<circle class="composition-slice ${selected?'selected':''}" cx="150" cy="150" r="105" fill="none" stroke="${recordTone(e)}" stroke-width="${selected?39:33}" stroke-dasharray="${visible.toFixed(3)} ${(C-visible).toFixed(3)}" stroke-dashoffset="${(-offset).toFixed(3)}" transform="rotate(-90 150 150)" tabindex="0" role="button" aria-label="${index+1}. ${esc(eventDisplayName(e.name))} ${dur(e.chartMinutes)} 상세 보기" data-action="focus-day-record" data-record="${esc(e.recordKey)}"><title>${index+1}. ${esc(eventDisplayName(e.name))} · ${dur(e.chartMinutes)}</title></circle>`;offset+=length;return svg}).join('');return `<section class="card day-composition"><div class="composition-heading"><h2>하루 시간 구성</h2><div class="composition-mode" aria-label="시간 구성 기준"><button type="button" data-action="composition-mode" data-mode="actual" aria-pressed="${mode==='actual'}" class="${mode==='actual'?'active':''}">실제 기록</button><button type="button" data-action="composition-mode" data-mode="plan" aria-pressed="${mode==='plan'}" class="${mode==='plan'?'active':''}">시간표</button></div></div><div class="composition-visual"><svg viewBox="0 0 300 300" class="composition-ring" role="group" aria-label="${mode==='actual'?'실제 기록':'목표 시간'} 구성 · ${dur(sum)}"><circle cx="150" cy="150" r="105" fill="none" stroke="#f0efed" stroke-width="33"/>${rings}${labels.join('')}<text x="150" y="141" class="composition-center-label" text-anchor="middle">${mode==='actual'?'실제 기록 합계':'목표 시간 합계'}</text><text x="150" y="172" class="composition-center-total" text-anchor="middle">${dur(sum)}</text></svg><div class="composition-events" aria-label="원형 그래프 일정 설명">${segments.map((e,index)=>`<button type="button" class="composition-event ${reportSelectedRecord===e.recordKey?'selected':''}" data-action="focus-day-record" data-record="${esc(e.recordKey)}"><span class="composition-event-index" style="border-color:${recordTone(e)}">${index+1}</span><span class="composition-event-name"><strong>${esc(eventDisplayName(e.name))}</strong><small>${e.kind==='study'?(names[e.subject]||'공부'):'생활 · 휴식'}</small></span><b>${dur(e.chartMinutes)}</b></button>`).join('')}</div></div><p class="composition-note">${sum?'번호 옆의 일정명·시간으로 조각을 확인하세요. 누르면 상세 기록이 열려요.':mode==='actual'?'아직 시간 기록이 없어요. 시간표를 누르면 공부 목표 구성을 볼 수 있어요.':'등록된 공부 일정이 없어요.'}<br><span>${mode==='actual'?'실제로 기록한 소요시간의 비중이에요.':'공부 일정의 예상 시간만 합산해요. 생활·휴식·초과 시간은 제외합니다.'}</span></p></section>`}

function reportUnifiedEntry(row,info){const study=row.kind==='study',actual=row.actualMinutes,checked=(row.items||[]).filter(i=>i.checked).length;return `<details id="record-${esc(row.recordKey)}" class="day-record-entry ${study?'is-study':'is-routine'} ${reportSelectedRecord===row.recordKey?'record-selected':''}" ${reportFoldAttrs('record:'+reportDate+':'+row.recordKey)}><summary><span class="record-subject-stripe" style="background:${recordTone(row)}" aria-hidden="true"></span><div class="unified-record-time">${row.source==='event'?`<strong>${clock(row.start)}</strong><span>예정</span>`:'<span>시간<br>기록</span>'}</div><div class="unified-record-heading"><h3>${esc(eventDisplayName(row.name))}</h3><span>${study?(names[row.subject]||'공부'):row.kind==='meal'?'식사':row.kind==='break'?'휴식':row.kind==='sleep'?'취침':row.kind==='flex'?'free time':'일상'}${row.source==='event'&&row.duration?' · 예정 '+dur(row.duration):''}${row.items?.length?' · 체크 '+checked+'/'+row.items.length:''}</span></div><div class="record-study-result"><strong>${dur(actual)}</strong>${reportStatus(row)}</div><span class="record-chevron" aria-hidden="true">${uiIcon('chevron')}</span></summary><div class="record-study-body"><div class="archive-task-time">${row.source==='event'?`<span>예정 <strong>${dur(row.duration)}</strong></span>`:''}<span>실제 <strong>${dur(actual)}</strong></span>${row.extra?`<span class="archive-extra">초과 ${row.extra}분</span>`:''}</div>${reportChecklist(row.items)}</div></details>`}
function focusDayRecord(key){reportSelectedRecord=key;reportDisclosure.add('record:'+reportDate+':'+key);reportDisclosure.add('day-records:'+reportDate);render();const entry=document.getElementById('record-'+key);if(entry){entry.open=true;entry.scrollIntoView({behavior:'smooth',block:'center'})}}

function reportStudyEntry(event,info){return reportUnifiedEntry(dayRecordRows(info).find(r=>r.recordKey===event.id),info)}
function reportRoutineEntry(event,info){return reportUnifiedEntry(dayRecordRows(info).find(r=>r.recordKey===event.id),info)}
function timeRecordsHTML(date){const logs=state.logs.filter(l=>l.date===date);return `<details id="time-records" class="card record-fold time-records" ${reportFoldAttrs('logs:'+date)}><summary><div><h2>시간 기록 수정 · 취소</h2><span>타이머 기록 ${logs.length}건</span></div><span class="record-chevron" aria-hidden="true">${uiIcon('chevron')}</span></summary><div class="record-fold-body"><p class="foot-note record-help">완료한 타이머의 소요시간을 수정하거나 기록을 취소할 수 있어요.</p>${logs.length?`<div class="report-list">${logs.map(l=>`<div class="report-row"><div class="log-row-heading"><div><span class="record-log-kind ${l.kind==='study'?'study':''}">${l.kind==='study'?'공부':'생활'}</span><strong>${esc(eventDisplayName(l.name))}</strong></div><button class="btn small outline" data-action="edit-log" data-log="${l.id}">수정 · 취소</button></div><div class="meta">${new Date(l.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})} 종료 · ${dur(l.minutes)}</div></div>`).join('')}</div>`:'<div class="empty">완료한 타이머 기록이 없어요.<br>체크 완료만 한 일정은 시간 기록에 포함되지 않습니다.</div>'}</div></details>`}
function report(){const info=reportInfo(reportDate),routines=info.events.filter(e=>e.kind!=='study'),overruns=[...state.days,...Object.values(state.archivedDays||{})].flatMap(day=>day.events.filter(e=>e.kind==='study'&&e.extra>0).map(e=>({...e,date:day.date}))).sort((a,b)=>b.extra-a.extra).slice(0,5),totalStudy=state.logs.filter(l=>l.kind==='study').reduce((n,l)=>n+Number(l.minutes||0),0);return `<div class="report-layout"><div class="report-main"><section class="card report-date-card"><div class="card-head"><h2>날짜별 기록</h2><span class="record-save-label">자동 저장</span></div><div class="archive-bar"><button class="btn outline small" data-action="report-prev">← 전날</button><input type="date" id="report-date" aria-label="보고 싶은 날짜 선택" value="${reportDate}"><button class="btn outline small" data-action="report-next">다음 날 →</button><button class="btn soft small" data-action="report-today">오늘</button></div><details class="report-calendar-fold" ${reportFoldAttrs('calendar')}><summary><span>달력으로 날짜 선택</span><span class="record-chevron" aria-hidden="true">${uiIcon('chevron')}</span></summary>${calendarHTML()}</details><div class="record-day-overview"><div class="record-primary-stat"><span>실제 공부</span><strong>${dur(info.actual)}</strong></div><div class="record-overview-meta"><span>완료한 공부 <strong>${info.done}<small> / ${info.studies.length}</small></strong></span><span>체크 완료 <strong>${info.checked}<small> / ${info.items.length}</small></strong></span></div></div></section>${dayCompositionHTML(info)}<details class="card record-fold unified-day-records" ${reportFoldAttrs('day-records:'+reportDate)}><summary><div><h2>하루 기록</h2><span>${esc(fmtDate(reportDate))} · ${dayRecordRows(info).length}개 일정 · 시간순</span></div><span class="record-chevron" aria-hidden="true">${uiIcon('chevron')}</span></summary><div class="record-fold-body"><div class="record-study-column-head"><span>일정 · 체크리스트</span><span>실제 시간</span></div>${dayRecordRows(info).length?dayRecordRows(info).map(row=>reportUnifiedEntry(row,info)).join(''):'<div class="empty">선택한 날짜의 일정이나 시간 기록이 없어요.</div>'}</div></details>${timeRecordsHTML(reportDate)}<section class="card record-export"><h2>이 날짜 기록 저장</h2><p class="foot-note">JPG·PDF로 선택한 날짜의 학습 현황을 내보냅니다.<br>전체 데이터 복구는 설정의 JSON 백업을 사용하세요.</p><div class="backup-tools"><button class="btn" data-action="export-jpg">JPG 저장 ${uiIcon('download')}</button><button class="btn outline" data-action="export-pdf">PDF 저장 ${uiIcon('download')}</button></div></section></div><aside class="report-aside"><details class="card record-fold record-cumulative" ${reportFoldAttrs('cumulative')}><summary><div><h2>공부시간 누적</h2><span>전체 ${dur(totalStudy)}</span></div><span class="record-chevron" aria-hidden="true">${uiIcon('chevron')}</span></summary><div class="record-fold-body">${Object.keys(names).map(sub=>{const total=state.logs.filter(l=>l.kind==='study'&&l.subject===sub).reduce((n,l)=>n+Number(l.minutes||0),0);return `<div class="reportbar"><strong>${names[sub]}</strong><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,total/420*100)}%;background:${colors[sub]}"></div></div><span class="muted">${dur(total)}</span></div>`}).join('')}<p class="foot-note cumulative-note">시간 기록은 타이머 종료를 기준으로 집계됩니다.<br>체크만 한 과제는 실제 공부시간에 합산되지 않습니다.</p></div></details><details class="card record-fold" ${reportFoldAttrs('overruns')}><summary><div><h2>시간이 오래 걸린 공부</h2><span>초과 시간이 큰 순서 · 최대 5개</span></div><span class="record-chevron" aria-hidden="true">${uiIcon('chevron')}</span></summary><div class="record-fold-body">${overruns.map(e=>`<div class="record-overrun"><div><strong>${esc(eventDisplayName(e.name))}</strong><span>${fmtDate(e.date)}</span></div><b>+${e.extra}분</b></div>`).join('')||'<p class="record-no-checks">아직 초과 기록이 없어요.</p>'}</div></details></aside></div>`}

function prunePlanChat(){const chat=Array.isArray(state.chat)?state.chat:[],requests=chat.map((m,i)=>m.role==='user'?i:-1).filter(i=>i>=0),retained=requests.length?chat.slice(requests[Math.max(0,requests.length-3)]):[];if(retained.length!==chat.length){state.chat=retained;save()}return retained}
function setPlanPanelOpen(open){const input=$('#chat-form input');if(input)planDraft=input.value;prunePlanChat();planPanelOpen=open;renderPlanPanel();const next=$('#chat-form input');if(open&&next&&window.matchMedia('(pointer:fine)').matches)next.focus()}
function coach(){const messages=(state.chat||[]).map(m=>`<div class="bubble ${m.role}">${esc(m.text)}</div>`).join(''),suggestion=state.pendingSuggestion;return `<div class="compact-coach"><p class="section-intro">바꿀 일정과 원하는 내용을 입력하고, 변경안을 확인해 적용하세요.</p><div class="chat-feed" id="chat-feed">${messages||'<div class="coach-empty">최근 요청이 여기에 표시돼요.</div>'}</div>${suggestion?`<div class="recommend"><strong>변경안</strong><div class="muted small">${suggestion.kind?esc(suggestion.summary):`${esc(suggestion.subjectName)} · ${suggestion.delta>0?'+':''}${suggestion.delta}분 (현재 3일 계획)`}</div><div class="controls"><button class="btn small" data-action="apply-suggestion">적용</button><button class="btn outline small" data-action="dismiss-suggestion">취소</button></div></div>`:''}<form id="chat-form" class="sendbox"><input name="message" aria-label="계획 변경 요청" placeholder="예: 로즈리 20분 미뤄줘" autocomplete="off" required><button class="btn" type="submit">보내기</button></form></div>`}

function routineTimeLabel(value){const [h,m]=value.split(':').map(Number);if(!Number.isFinite(h)||!Number.isFinite(m))return '시간 선택';return `${h<12?'오전':'오후'} ${String(h%12||12).padStart(2,'0')}:${String(m).padStart(2,'0')}`}
function settings(){let c=state.settings;const goal=Number.isFinite(state.studyGoalMinutes)?state.studyGoalMinutes:420;return `<div class="grid layouttwo"><div class="card"><div class="settings-heading"><h2>기본 시간</h2><p>변경한 시간은 내일부터 적용됩니다.</p></div><form id="settings-form" class="routine-form"><h3>수면</h3><div class="routine-group">${[['wake','기상'],['sleep','취침']].map(([key,label])=>`<div class="routine-row"><label for="routine-${key}">${label}</label><div class="routine-value routine-time-control"><span class="routine-time-display" aria-hidden="true">${routineTimeLabel(c[key])}</span><input id="routine-${key}" name="${key}" type="time" lang="ko-KR" value="${c[key]}" required aria-label="${label} 시간"></div></div>`).join('')}</div><h3>식사</h3><div class="routine-group">${[['lunch','점심'],['dinner','저녁']].map(([key,label])=>`<div class="routine-row"><label for="routine-${key}">${label}</label><div class="routine-value routine-time-control"><span class="routine-time-display" aria-hidden="true">${routineTimeLabel(c[key])}</span><input id="routine-${key}" name="${key}" type="time" lang="ko-KR" value="${c[key]}" required aria-label="${label} 시간"></div></div>`).join('')}</div><div class="routine-row routine-break"><label for="routine-break">휴식</label><div class="routine-value"><input id="routine-break" name="breakMin" type="number" min="5" max="60" value="${c.breakMin}" required inputmode="numeric" aria-label="휴식 분"><span class="routine-unit" aria-hidden="true">분</span></div></div><button class="btn routine-save">저장 · 내일부터 적용</button></form><p class="foot-note routine-explanation">오늘과 지난 기록은 유지됩니다.<br>내일부터의 기존 일정은 변경된 생활시간에 맞춰 이동하며 체크리스트·완료 기록은 유지됩니다.</p></div><div class="grid" style="align-content:start"><div class="card"><h2>공부 목표 시간</h2><p class="foot-note">저장하면 날짜별 예정 공부시간에 바로 적용됩니다.<br>단, 날짜 옆 연필로 따로 지정한 값이 우선합니다.<br>공부 일정의 분량 자체는 바꾸지 않습니다.</p><form id="study-goal-form"><div class="goal-inputs"><label class="goal-quantity"><input name="hours" aria-label="공부 목표 시간" type=" function startTask(id){if(active){alert('진행 중인 공부 또는 휴식을 먼저 종료해주세요.');return}let e=state.days[dayIndex].events.find(e=>e.id===id);if(!e||e.skipped)return;if(isPastEvent(state.days[dayIndex],id)){alert('지난 일정입니다. 계획명을 눌러 예정 시작 시간을 먼저 수정해주세요.');return}if(!confirm(`‘${eventDisplayName(e.name)}’ 타이머를 지금 시작할까요?`))return;let plan=schedule(state.days[dayIndex]).find(x=>x.id===e.id),now=new Date(),nowMin=now.getHours()*60+now.getMinutes();let sameDay=state.days[dayIndex].date===dateISO(now);let startLag=sameDay?Math.max(0,nowMin-(plan?.startComputed||0)):0;active={id,kind:e.kind,day:dayIndex,duration:e.duration,startLag,startedAtIso:now.toISOString(),plannedEndMs:new Date(state.days[dayIndex].date+'T00:00:00').getTime()+plan.endComputed*60000};held=0;startedAt=Date.now();pausedAt=null;persistSession();render()}

function finishSession(advance=false){if(!active)return;if(!confirm('진행 중인 타이머를 완료할까요? 실제 소요시간을 기록하고, 예정시간을 초과한 만큼 이후 일정을 조정합니다.'))return;let a=active;let secs=elapsed();let day=state.days[a.day],e=day.events.find(e=>e.id===a.id);if(!e)return;let actual=Math.max(1,Math.ceil(secs/60));e.actual=(e.actual||0)+actual;e.done=true;e.manualExtra=e.manualExtra??Math.max(0,Number(e.extra||0)-Number(e.timerExtra||0));e.timerExtra=Math.max(0,actual-e.duration);e.extra=Math.max(e.manualExtra,e.timerExtra);(e.logs||(e.logs=[])).push({minutes:actual,at:new Date().toISOString()});state.logs.push({id:id(),eventId:e.id,kind:e.kind,name:e.name,subject:e.subject,minutes:actual,at:new Date().toISOString(),startAt:a.startedAtIso||new Date(Date.now()-secs*1000).toISOString(),date:day.date});active=null;pausedAt=null;held=0;persistSession();let i=day.events.findIndex(x=>x.id===e.id);let next=day.events[i+1];if(!advance&&next?.kind==='break'&&!next.done&&!next.skipped){active={id:next.id,kind:'break',day:a.day,duration:next.duration,startedAtIso:new Date().toISOString(),plannedEndMs:Date.now()+next.duration*60000};startedAt=Date.now();pausedAt=null;held=0;persistSession()}render()}

function setupDay(){if(active){alert('진행 중인 타이머를 종료한 뒤 하루를 세팅해주세요.');return false}const day=state.days[dayIndex],base=makeEvents(settingsForDate(day.date),dayIndex),counts=new Map();for(const event of day.events){const key=event.kind+'|'+quickPlanKey(event);counts.set(key,(counts.get(key)||0)+1)}const missing=base.filter(event=>{const key=event.kind+'|'+quickPlanKey(event),n=counts.get(key)||0;if(n){counts.set(key,n-1);return false}return true});if(!missing.length){alert('기상부터 취침까지 기본 일정이 이미 있어요.');return false}const before=checkpointFeature();day.events.push(...missing);day.events.sort((a,b)=>a.start-b.start);state.pendingSuggestion=null;finishFeature(before,day.events.length===missing.length?'기상부터 취침까지 하루를 세팅했어요.':'기존 일정은 유지하고 기본 일정 '+missing.length+'개를 채웠어요.');return true}

function scheduleWarning(day){const plan=schedule(day),sleep=plan.find(e=>e.kind==='sleep');if(!sleep)return '';const over=plan.filter(e=>e.kind!=='sleep'&&e.kind!=='flex'&&e.endComputed>sleep.startComputed);return over.length?`<div class="backup-alert">${over.length}개 일정이 취침 시간과 겹치거나 이후에 끝나요. 일정 시간·분량을 줄이거나 오늘 취침 시간을 수정하세요.</div>`:''}

function skipEvent(eventId){if(!canEditEvent(eventId))return;const e=state.days[dayIndex].events.find(x=>x.id===eventId);if(!e)return;if(e.skipped)return applySkipEvent(eventId);if(e.done){alert('완료한 일정은 완료 취소 후 건너뛸 수 있어요.');return}$('#modals').innerHTML=`<div class="modal-cover"><div class="modal"><h3>오늘 건너뛰기</h3><p style="line-height:1.7;margin-bottom:16px">‘${esc(eventDisplayName(e.name))}’을 오늘 하지 않는 일정으로 표시할까요?</p><ul class="skip-explanation"><li>일정과 체크리스트는 남고 ‘건너뜀’으로 표시됩니다.</li><li>이 일정에 배정된 시간을 빼고 뒤 일정을 당깁니다. 취침 시간은 유지됩니다.</li><li>완료로 처리하거나 다른 날짜로 미루지 않습니다.</li><li>‘다시 할 일로’를 누르면 되돌릴 수 있습니다.</li></ul><div class="controls"><button class="btn outline" data-action="close-modal">취소</button><button class="btn" data-action="confirm-skip" data-id="${e.id}">오늘 건너뛰기</button></div></div></div>`}
function applySkipEvent(eventId){if(!canEditEvent(eventId))return;const day=state.days[dayIndex],idx=day.events.findIndex(e=>e.id===eventId),e=day.events[idx];if(!e)return;if(e.done){alert('완료한 일정은 완료 취소 후 건너뛸 수 있어요.');return}undoSchedule={day:dayIndex,events:JSON.parse(JSON.stringify(day.events))};const restore=!!e.skipped;e.skipped=!restore;shiftFollowing(day,idx,(restore?1:-1)*(e.duration+Number(e.extra||0)));save();$('#modals').innerHTML='';render();showUndo(restore?'할 일로 되돌렸어요.':'오늘 건너뛰었어요. 이후 일정을 당겼어요.')}

async function flushCloud(){if(!cloudClient||!cloudUser||!cloudReady||cloudConflict||cloudBusy||!cloudDirty)return;cloudBusy=true;const uid=cloudUser.id, payload=JSON.stringify(state),rev=cloudRevision;cloudStatus('서버에 저장 중…');try{const data=JSON.parse(payload);let result=rev===0?await cloudClient.from('study_state').insert({user_id:uid,data,revision:1}).select('revision').single():await cloudClient.from('study_state').update({data,revision:rev+1}).eq('user_id',uid).eq('revision',rev).select('revision').maybeSingle();if(result.error){if(result.error.code==='23505')throw new Error('CONFLICT');throw result.error}if(!result.data)throw new Error('CONFLICT');cloudRevision=result.data.revision;cloudDirty=JSON.stringify(state)!==payload;localStorage.setItem(cloudMetaKey(),JSON.stringify({revision:cloudRevision,dirty:cloudDirty}));cloudStatus(cloudDirty?'추가 변경 저장 대기':'서버 저장 완료 · '+new Date().toLocaleTimeString('ko-KR'));}catch(e){if(e.message==='CONFLICT'){cloudConflict=true;cloudStatus('다른 기기에서 변경됐어요. 이 기기 기록은 유지 중 · 충돌 해결을 눌러주세요.')}else cloudStatus('서버 저장 실패 · 기기 기록 유지 중. 연결·DB 설정 확인 후 동기화해주세요.')}finally{cloudBusy=false;if(cloudDirty&&!cloudConflict)cloudTimer=setTimeout(flushCloud,15000)}}
function installStudy(s){if(!validStudy(s))throw Error('기록 형식을 확인할 수 없어요.');state=s;state.archivedDays=state.archivedDays||{};const a=state.activeSession;active=a?.active||null;startedAt=a?.startedAt||null;pausedAt=a?.pausedAt||null;held=a?.held||0;dayIndex=a?.dayIndex||0;view='today';localStorage.setItem(storageKey(),JSON.stringify(state));render()}
async function hydrateUser(user){if(cloudLoading)return;cloudLoading=true;document.querySelector('.layout').inert=true;try{cloudReady=false;cloudUser=user;paintAccount();const saved=localStorage.getItem(storageKey());let local=saved?JSON.parse(saved):null,meta=JSON.parse(localStorage.getItem(cloudMetaKey())||'{}');const {data,error}=await cloudClient.from('study_state').select('data,revision').eq('user_id',user.id).maybeSingle();if(error)throw error;if(data){if(meta.dirty&&local){installStudy(local);cloudRevision=Number(meta.revision)||0;cloudDirty=true;if(cloudRevision!==data.revision){cloudConflict=true;cloudStatus('다른 기기의 변경과 미전송 기록이 있어요. 충돌 해결을 눌러주세요.')}}else{installStudy(data.data);cloudRevision=data.revision;cloudDirty=false;cloudStatus('서버 기록 불러옴 · 자동 저장 켜짐')}}else{cloudRevision=0;const guest=JSON.parse(localStorage.getItem(guestKey)||'null');if(local)installStudy(local);else if(validStudy(guest)&&confirm('이 브라우저의 기존 공부 기록을 로그인한 계정으로 옮길까요?'))installStudy(guest);else installStudy(createState());cloudDirty=true;cloudStatus('첫 계정 기록을 서버에 저장할 준비가 됐어요.')}cloudReady=true;if(cloudDirty&&!cloudConflict)await flushCloud();}catch(e){cloudReady=false;cloudStatus('계정 기록을 불러오지 못했어요. 아직 서버 연결이 완료되지 않았습니다.');}finally{cloudLoading=false;document.querySelector('.layout').inert=false;paintAccount()}}
function accountModal(){document.getElementById('modals').innerHTML=`<div class="modal-cover"><div class="modal"><h3>공부루틴 로그인</h3><p class="foot-note">Supabase 관리자 계정과 별개인 공부루틴 계정이에요.<br>모든 기기에서 같은 이메일로 로그인하세요.</p><form id="cloud-login-form"><div class="field" style="margin:16px 0"><label>이메일</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>비밀번호 (8자 이상)</label><input name="password" type="password" minlength="8" autocomplete="current-password" required></div><p id="cloud-auth-note" class="foot-note" role="status"></p><div class="controls"><button type="button" class="btn outline" data-action="close-modal">닫기</button><button class="btn outline" name="mode" value="signup">처음 가입</button><button class="btn" name="mode" value="login">로그인</button></div></form></div></div>`}
async function resolveCloud(){if(active){alert('타이머를 종료한 뒤 충돌을 해결해주세요.');return}exportData();if(!confirm('현재 기기 기록의 JSON 백업을 내려받았습니다. 서버의 최신 기록을 불러올까요? 이 기기의 미전송 변경은 백업 파일에 남고 자동 병합되지 않습니다.'))return;cloudBusy=true;try{const {data,error}=await cloudClient.from('study_state').select('data,revision').eq('user_id',cloudUser.id).single();if(error)throw error;installStudy(data.data);cloudRevision=data.revision;cloudDirty=false;cloudConflict=false;localStorage.setItem(cloudMetaKey(),JSON.stringify({revision:cloudRevision,dirty:false}));cloudStatus('서버 최신 기록 불러옴 · 기기 변경은 JSON 백업으로 보관');}catch(e){cloudStatus('불러오기 실패 · 기존 기기 기록 유지')}finally{cloudBusy=false}}
async function showCloudBackups(){const {data,error}=await cloudClient.from('study_backups').select('backup_day,created_at').eq('user_id',cloudUser.id).order('backup_day',{ascending:false}).limit(30);if(error){alert('자동 보관본을 불러오지 못했어요. DB 설정을 확인해주세요.');return}document.getElementById('modals').innerHTML=`<div class="modal-cover"><div class="modal"><h3>자동 보관본</h3><p class="foot-note">서버 기록을 수정하는 날, 첫 수정 직전 기록을 따로 보관해요.<br>아래 날짜를 누르면 복구용 JSON을 내려받습니다.</p><div class="controls" style="max-height:300px;overflow:auto;margin-top:14px">${data.length?data.map(b=>`<button class="btn outline small" data-cloud-backup="${esc(b.backup_day)}">${esc(b.backup_day)} JSON</button>`).join(''):'아직 보관본이 없어요.'}</div><div class="controls"><button class="btn outline" data-action="close-modal">닫기</button></div></div></div>`}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-cloud],[data-cloud-backup]');if(!b)return;if(b.dataset.cloudBackup){const {data,error}=await cloudClient.from('study_backups').select('data').eq('user_id',cloudUser.id).eq('backup_day',b.dataset.cloudBackup).single();if(error){alert('다운로드 실패');return}downloadBlob(new Blob([JSON.stringify(data.data,null,2)],{type:'application/json'}),'공부루틴_자동보관_'+b.dataset.cloudBackup+'.json');return}const action=b.dataset.cloud;if(action==='login'){if(!cloudClient){alert('로그인 모듈을 불러오는 중이거나 연결되지 않았어요. 인터넷 연결 후 새로고침해주세요.');return}accountModal()}else if(action==='retry'){if(!cloudReady)await hydrateUser(cloudUser);else if(cloudConflict)await resolveCloud();else if(cloudDirty)await flushCloud();else{if(active){cloudStatus('타이머 종료 후 다른 기기 기록을 불러올 수 있어요.');return}await hydrateUser(cloudUser)}}else if(action==='resolve')await resolveCloud();else if(action==='backups')await showCloudBackups();else if(action==='logout'){if(active){alert('진행 중인 타이머를 종료해주세요.');return}await flushCloud();if(cloudDirty){alert('미전송 기록이 있어요. 동기화 또는 충돌 해결 후 로그아웃해주세요.');return}const {error}=await cloudClient.auth.signOut({scope:'local'});if(error){cloudStatus('로그아웃 실패 · 다시 시도해주세요.');return}cloudUser=null;cloudReady=false;cloudRevision=0;cloudConflict=false;cloudDirty=false;installStudy(JSON.parse(localStorage.getItem(guestKey)||'null')||createState());cloudStatus('로그아웃됨 · 이 브라우저의 비로그인 기록')}});
document.addEventListener('submit',async e=>{if(e.target.id!=='cloud-login-form')return;e.preventDefault();const f=e.target,form=new FormData(f),note=document.getElementById('cloud-auth-note'),mode=e.submitter?.value||'login';const email=String(form.get('email')).trim(),password=String(form.get('password'));for(const b of f.querySelectorAll('button'))b.disabled=true;note.textContent='처리 중…';try{const r=mode==='signup'?await cloudClient.auth.signUp({email,password,options:{emailRedirectTo:'https://y-inny.github.io/gongbu-routine/'}}):await cloudClient.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(r.data.session){document.getElementById('modals').innerHTML='';await hydrateUser(r.data.user)}else note.textContent='가입 확인 메일을 확인해주세요. 인증 후 같은 이메일과 비밀번호로 로그인하세요.';}catch(err){note.textContent='처리하지 못했어요: '+err.message}finally{for(const b of f.querySelectorAll('button'))b.disabled=false}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateClock()});
window.addEventListener('online',()=>{if(cloudUser){if(cloudReady)flushCloud();else hydrateUser(cloudUser)}});
window.addEventListener('beforeunload',e=>{if(cloudUser&&cloudDirty){e.preventDefault();e.returnValue=''}});
async function initCloud(){paintAccount();try{const lib=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');cloudClient=lib.createClient(cloudUrl,cloudKey);const {data,error}=await cloudClient.auth.getSession();if(error)throw error;if(data.session)await hydrateUser(data.session.user);cloudClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'&&cloudUser&&!cloudLoading){cloudReady=false;cloudStatus('로그인 세션이 종료됐어요. 다시 로그인해주세요.')}});}catch(e){cloudStatus('로그인 연결 실패 · 인터넷 연결 후 새로고침해주세요. 기기 저장은 계속됩니다.')}}

bind();render();tickHandle=setInterval(updateClock,1000);initCloud();
})();
</script></body></html>
