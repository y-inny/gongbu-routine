function longDate(date){const d=new Date(date+'T12:00:00');return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${['일','월','화','수','목','금','토'][d.getDay()]}요일`}
function titleModal(index){const d=state.days[index];$('#modals').innerHTML=`<div class="modal-cover"><div class="modal"><h3>${longDate(d.date)}</h3><form id="day-title-form"><input type="hidden" name="index" value="${index}"><div class="field"><label>제목 (선택)</label><input name="title" maxlength="80" value="${esc(d.title||'')}" placeholder="직접 제목을 입력하세요"></div><div class="controls"><button type="button" class="btn outline" data-action="close-modal">취소</button><button class="btn">저장</button></div></form></div></div>`}
function settingsForDate(date){const history=state.settingsHistory||[];return history.filter(x=>x.from<=date).sort((a,b)=>b.from.localeCompare(a.from))[0]?.values||state.settings}
function saveDailySettings(values,todayDate=dateISO(new Date())){const tomorrow=addDays(todayDate,1);const previous=state.days.map(d=>({...settingsForDate(d.date)}));if(!state.settingsHistory)state.settingsHistory=[{from:'0000-01-01',values:{...state.settings}}];state.settingsHistory=state.settingsHistory.filter(x=>x.from!==tomorrow);state.settingsHistory.push({from:tomorrow,values:{...values}});state.settings={...values};state.days.forEach((day,i)=>{if(day.date<tomorrow)return;const old=previous[i],wakeDelta=mins(values.wake)-mins(old.wake),lunchDelta=mins(values.lunch)-mins(old.lunch),dinnerDelta=mins(values.dinner)-mins(old.dinner),sleepDelta=mins(values.sleep)-mins(old.sleep);for(const e of day.events){if(e.done)continue;if(e.kind==='sleep')e.start=mins(values.sleep);else if(e.name==='취침 준비')e.start=mins(values.sleep)-e.duration;else{const delta=e.start<mins(old.lunch)?wakeDelta:e.start<mins(old.dinner)?lunchDelta:dinnerDelta;e.start=Math.max(0,Math.min(1439,e.start+delta));if(e.name==='점심 식사')e.start=mins(values.lunch);if(e.name==='저녁 식사')e.start=mins(values.dinner);if(e.kind==='break'&&e.duration===Number(old.breakMin))e.duration=Number(values.breakMin)}}});return tomorrow}

function currentCardModel(now=new Date()){const today=dateISO(now),index=active?active.day:state.days.findIndex(d=>d.date===today),day=state.days[index],minute=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;const plan=day?schedule(day):[];const current=[...plan].reverse().find(e=>!e.skipped&&e.startComputed<=minute&&minute<(e.kind==='sleep'?1440:e.endComputed));const event=active?day?.events.find(e=>e.id===active.id):current;const anchor=event?plan.find(e=>e.id===event.id):null;let deadline=active?.plannedEndMs;if(active&&!deadline&&day&&anchor)deadline=new Date(day.date+'T00:00:00').getTime()+anchor.endComputed*60000;const over=!!active&&Number.isFinite(deadline)&&now.getTime()>=deadline;const next=active?plan.slice(plan.findIndex(e=>e.id===event?.id)+1).find(e=>!e.skipped&&!e.done):plan.find(e=>!e.skipped&&e.startComputed>minute);return {index,day,event,anchor,next,over,overSeconds:over?Math.floor((now.getTime()-deadline)/1000):0}}

function timePhases(day,now=new Date()){const today=dateISO(now),minute=now.getHours()*60+now.getMinutes(),plan=schedule(day);let current=-1;if(day.date===today){for(let i=0;i<plan.length;i++){const e=plan[i],end=e.kind==='sleep'?1440:e.endComputed;if(!e.skipped&&e.startComputed<=minute&&minute<end)current=i}}return plan.map((e,i)=>({id:e.id,phase:day.date<today?'past':day.date>today?'future':i===current?'current':e.skipped||e.endComputed<=minute?'past':'future'}))}

let calendarMonth=null;
function calendarHTML(){const month=calendarMonth||reportDate.slice(0,7),first=new Date(month+'-01T12:00:00'),year=first.getFullYear(),m=first.getMonth(),count=new Date(year,m+1,0).getDate(),todayDate=dateISO(new Date());let cells=Array.from({length:first.getDay()},()=>'<span class="calendar-blank" aria-hidden="true"></span>');for(let n=1;n<=count;n++){const date=`${month}-${String(n).padStart(2,'0')}`,r=reportInfo(date),hasActivity=r.logs.length||r.checked||r.events.some(e=>e.done||e.skipped),hasPlan=!!r.day;const label=hasActivity?(r.actual?dur(r.actual):r.checked?`체크 ${r.checked}`:'기록'):hasPlan?'계획':'';cells.push(`<button class="calendar-day ${date===reportDate?'selected':''} ${date===todayDate?'is-today':''}" data-action="calendar-date" data-date="${date}" aria-label="${date} ${hasActivity?'기록 있음':hasPlan?'계획 있음':'기록 없음'}" aria-pressed="${date===reportDate}"><span>${n}</span><small>${esc(label)||'&nbsp;'}</small></button>`)}return `<section class="calendar" aria-label="월별 기록 달력"><div class="calendar-head"><button class="btn small outline" data-action="calendar-prev" aria-label="이전 달">‹</button><h3>${year}년 ${m+1}월</h3><button class="btn small outline" data-action="calendar-next" aria-label="다음 달">›</button></div><div class="calendar-week">${['일','월','화','수','목','금','토'].map(d=>`<span>${d}</span>`).join('')}</div><div class="calendar-grid">${cells.join('')}</div><p class="foot-note">날짜를 누르면 아래에 상세 기록이 표시돼요.</p></section>`}

function dayRecordRows(info){const rows=info.events.map((event,index)=>({...event,recordKey:event.id,order:Number(event.start)||0,actualMinutes:0,source:'event',originalIndex:index})),byId=new Map(rows.map(row=>[row.id,row]));for(const log of info.logs){const found=log.eventId?info.events.find(e=>e.id===log.eventId):findLogEvent(log).event,row=found?byId.get(found.id):null;if(row){row.actualMinutes+=Number(log.minutes||0);continue}const end=new Date(log.at),order=Number.isFinite(end.getTime())?end.getHours()*60+end.getMinutes()-Number(log.minutes||0):1440;rows.push({id:log.id,recordKey:'log-'+log.id,name:log.name,kind:log.kind,subject:log.subject,items:[],done:true,skipped:false,actualMinutes:Number(log.minutes||0),duration:0,order:Math.max(0,order),source:'log',extra:0})}return rows.sort((a,b)=>a.order-b.order||Number(a.originalIndex||0)-Number(b.originalIndex||0))}

function compositionNameLines(value){const width=text=>Array.from(text).reduce((n,ch)=>n+(/[A-Za-z0-9]/.test(ch)?.55:/\s/.test(ch)?.35:1),0),lines=[];let current='';for(const word of String(value).split(/\s+/)){if(current&&width(current+' '+word)>5.5){lines.push(current);current=''}for(const ch of Array.from(word)){if(width(current+ch)>5.5){lines.push(current);current=''}current+=ch}current+=' '}if(current.trim())lines.push(current.trim());const trimmed=lines.map(line=>line.trim());if(trimmed.length>2)return [trimmed[0],trimmed[1].slice(0,-1)+'…'];return trimmed.length?trimmed:['일정']}

function dayCompositionHTML(info){const mode=reportCompositionMode==='auto'?(info.logs.length?'actual':'plan'):reportCompositionMode,segments=compositionSegments(info,mode),{items,height,total}=compositionCallouts(segments),cx=200,cy=height/2,R=76,C=2*Math.PI*R;let offset=0;const rings=items.map(e=>{const length=e.chartMinutes/total*C,visible=Math.max(length*.75,length-1.5),selected=reportSelectedRecord===e.recordKey;const svg=`<circle class="composition-slice ${selected?'selected':''}" cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${recordTone(e)}" stroke-width="${selected?29:25}" stroke-dasharray="${visible.toFixed(3)} ${(C-visible).toFixed(3)}" stroke-dashoffset="${(-offset).toFixed(3)}" transform="rotate(-90 ${cx} ${cy})" tabindex="0" role="button" aria-label="${esc(eventDisplayName(e.name))} ${dur(e.chartMinutes)} 상세 보기" data-action="focus-day-record" data-record="${esc(e.recordKey)}"><title>${esc(eventDisplayName(e.name))} · ${dur(e.chartMinutes)}</title></circle>`;offset+=length;return svg}).join('');const callouts=items.map(e=>{const right=e.side==='right',x=cx+91*Math.cos(e.angle),y=cy+91*Math.sin(e.angle),elbow=right?298:102,end=right?303:97,textX=right?308:92,anchor=right?'start':'end',lines=compositionNameLines(eventDisplayName(e.name)),firstY=e.labelY-(lines.length===2?13:4);return `<g class="composition-callout" role="button" tabindex="0" aria-label="${esc(eventDisplayName(e.name))} ${dur(e.chartMinutes)} 상세 보기" data-action="focus-day-record" data-record="${esc(e.recordKey)}"><title>${esc(eventDisplayName(e.name))} · ${dur(e.chartMinutes)}</title><polyline class="composition-leader" points="${x.toFixed(2)},${y.toFixed(2)} ${elbow},${y.toFixed(2)} ${end},${e.labelY}"/><circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="2" fill="${recordTone(e)}"/><text class="composition-direct-name" x="${textX}" text-anchor="${anchor}">${lines.map((line,i)=>`<tspan x="${textX}" y="${firstY+i*18}">${esc(line)}</tspan>`).join('')}</text><text class="composition-direct-duration" x="${textX}" y="${firstY+lines.length*18+3}" text-anchor="${anchor}">${dur(e.chartMinutes)}</text></g>`}).join('');return `<section class="card day-composition"><div class="composition-heading"><h2>하루 시간 구성</h2><div class="composition-mode" aria-label="시간 구성 기준"><button type="button" data-action="composition-mode" data-mode="actual" aria-pressed="${mode==='actual'}" class="${mode==='actual'?'active':''}">실제 기록</button><button type="button" data-action="composition-mode" data-mode="plan" aria-pressed="${mode==='plan'}" class="${mode==='plan'?'active':''}">시간표</button></div></div><div class="composition-direct-visual"><svg viewBox="0 0 400 ${height}" class="composition-direct-ring" role="group" aria-label="${mode==='actual'?'실제 기록':'목표 시간'} 구성 · ${dur(total)}"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#f0efed" stroke-width="25"/>${rings}${callouts}<text x="${cx}" y="${cy-7}" class="composition-center-label" text-anchor="middle">${mode==='actual'?'실제 기록 합계':'목표 시간 합계'}</text><text x="${cx}" y="${cy+23}" class="composition-center-total" text-anchor="middle">${dur(total)}</text></svg></div><p class="composition-note">${total?(mode==='actual'?'실제로 기록한 소요시간 기준이에요.':'공부 일정만 합산해요. 생활·휴식·초과 시간은 제외합니다.'):mode==='actual'?'아직 시간 기록이 없어요. 시간표에서 공부 목표를 볼 수 있어요.':'등록된 공부 일정이 없어요.'}</p></section>`}

function reportUnifiedEntry(row,info){const study=row.kind==='study',actual=row.actualMinutes,checked=(row.items||[]).filter(i=>i.checked).length;return `<details id="record-${esc(row.recordKey)}" class="day-record-entry ${study?'is-study':'is-routine'} ${reportSelectedRecord===row.recordKey?'record-selected':''}" ${reportFoldAttrs('record:'+reportDate+':'+row.recordKey)}><summary><span class="record-subject-stripe" style="background:${recordTone(row)}" aria-hidden="true"></span><div class="unified-record-time">${row.source==='event'?`<strong>${clock(row.start)}</strong><span>예정</span>`:'<span>시간<br>기록</span>'}</div><div class="unified-record-heading"><h3>${esc(eventDisplayName(row.name))}</h3><span>${study?(names[row.subject]||'공부'):row.kind==='meal'?'식사':row.kind==='break'?'휴식':row.kind==='sleep'?'취침':row.kind==='flex'?'free time':'일상'}${row.source==='event'&&row.duration?' · 예정 '+dur(row.duration):''}${row.items?.length?' · 체크 '+checked+'/'+row.items.length:''}</span></div><div class="record-study-result"><strong>${dur(actual)}</strong>${reportStatus(row)}</div><span class="record-chevron" aria-hidden="true">${uiIcon('chevron')}</span></summary><div class="record-study-body"><div class="archive-task-time">${row.source==='event'?`<span>예정 <strong>${dur(row.duration)}</strong></span>`:''}<span>실제 <strong>${dur(actual)}</strong></span>${row.extra?`<span class="archive-extra">초과 ${row.extra}분</span>`:''}</div>${reportChecklist(row.items)}</div></details>`}
function focusDayRecord(key){reportSelectedRecord=key;reportDisclosure.add('record:'+reportDate+':'+key);reportDisclosure.add('day-records:'+reportDate);render();const entry=document.getElementById('record-'+key);if(entry){entry.open=true;entry.scrollIntoView({behavior:'smooth',block:'center'})}}

function reportStudyEntry(event,info){return reportUnifiedEntry(dayRecordRows(info).find(r=>r.recordKey===event.id),info)}
function reportRoutineEntry(event,info){return reportUnifiedEntry(dayRecordRows(info).find(r=>r.recordKey===event.id),info)}
function timeRecordsHTML(date){const logs=state.logs.filter(l=>l.date===date);return `<details id="time-records" class="card record-fold time-records" ${reportFoldAttrs('logs:'+date)}><summary><div><h2>시간 기록 수정 · 취소</h2><span>기존 시간 기록 ${logs.length}건</span></div><span class="record-chevron" aria-hidden="true">${uiIcon('chevron')}</span></summary><div class="record-fold-body"><p class="foot-note record-help">저장된 공부시간을 수정하거나 기록을 취소할 수 있어요.</p>${logs.length?`<div class="report-list">${logs.map(l=>`<div class="report-row"><div class="log-row-heading"><div><span class="record-log-kind ${l.kind==='study'?'study':''}">${l.kind==='study'?'공부':'생활'}</span><strong>${esc(eventDisplayName(l.name))}</strong></div>${Number.isInteger(l.plannerSlot)?'<span class="p-muted">10분 칸에서 수정</span>':`<button class="btn small outline" data-action="edit-log" data-log="${l.id}">수정 · 취소</button>`}</div><div class="meta">${new Date(l.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})} 종료 · ${dur(l.minutes)}</div></div>`).join('')}</div>`:'<div class="empty">완료한 기존 시간 기록이 없어요.<br>체크 완료만 한 일정은 시간 기록에 포함되지 않습니다.</div>'}</div></details>`}

/* Planner: additive records, shared with account sync and JSON backups. */
let plannerView='day',plannerBrush='english';
const plannerTabs={day:'일간',week:'주간',month:'월간',year:'연간',progress:'회독',exams:'모의고사',errors:'오답',notes:'메모',stats:'누적'};
const pSubjects={english:{label:'영어',short:'영',tone:'#686868'},korean:{label:'국어',short:'국',tone:'#a0a0a0'},law:{label:'행정법',short:'법',tone:'#4a4a4a'},admin:{label:'행정학',short:'학',tone:'#858585'}};
const pTagPresets=['오늘 완료','목표 달성','집중','복습','암기','오답 체크','모의고사','휴식','국어','영어','행정법','행정학','회독 완료','시험일','원서 접수'];
function ensurePlanner(){if(!state.planner||typeof state.planner!=='object')state.planner={};const p=state.planner;for(const k of ['days','months','weeks','progress','profile'])if(!p[k]||typeof p[k]!=='object'||Array.isArray(p[k]))p[k]={};for(const k of ['exams','errors','notes','customTags','customSubjects'])if(!Array.isArray(p[k]))p[k]=[];return p}
function pDay(date=reportDate){const p=ensurePlanner();return p.days[date]||(p.days[date]={goal:'',note:getDay(date)?.note||'',tags:[],tasks:[]})}
function pMonth(month=reportDate.slice(0,7)){const p=ensurePlanner();return p.months[month]||(p.months[month]={goals:[],review:''})}
function pMonday(date=reportDate){const d=new Date(date+'T12:00:00');return addDays(date,-((d.getDay()+6)%7))}
function pWeek(date=reportDate){const p=ensurePlanner(),key=pMonday(date);return p.weeks[key]||(p.weeks[key]={goal:'',keep:'',problem:'',try:''})}
function pSubjectName(key){return pSubjects[key]?.label||'공부'}
function pButton(action,text,extra='',cls=''){return '<button type="button" class="p-btn '+cls+'" data-action="p-'+action+'" '+extra+'>'+text+'</button>'}
function pScope(scope,key){return ' data-p-scope="'+scope+'" data-p-key="'+esc(key)+'"'}
function pInput(scope,key,field,value,placeholder='',multiline=false){const attrs=pScope(scope,key)+' data-p-field="'+field+'" aria-label="'+esc(placeholder||field)+'"';return multiline?'<textarea class="p-writing" '+attrs+' placeholder="'+esc(placeholder)+'">'+esc(value||'')+'</textarea>':'<input class="p-input" '+attrs+' value="'+esc(value||'')+'" placeholder="'+esc(placeholder)+'">'}
function pHeading(title,caption='',actions=''){return '<div class="p-section-head"><div><h3>'+title+'</h3>'+(caption?'<span>'+caption+'</span>':'')+'</div>'+actions+'</div>'}
function pTags(date,compact=false){return (pDay(date).tags||[]).map(tag=>compact?'<span class="p-tag">'+esc(tag)+'</span>':'<button type="button" class="p-tag" data-action="p-remove-tag" data-date="'+date+'" data-tag="'+esc(tag)+'" aria-label="'+esc(tag)+' 태그 삭제">'+esc(tag)+' <span aria-hidden="true">×</span></button>').join('')}
function pTotals(dates){const totals=Object.fromEntries(Object.keys(pSubjects).map(k=>[k,0]));for(const l of state.logs||[])if(l.kind==='study'&&dates.includes(l.date)){const k=Object.hasOwn(totals,l.subject)?l.subject:'other';totals[k]=(totals[k]||0)+Number(l.minutes||0)}return totals}
function pTotalsHTML(dates){const t=pTotals(dates);return '<div class="p-totals">'+Object.entries(t).map(([k,n])=>'<div><span>'+pSubjectName(k)+'</span><strong>'+dur(n)+'</strong></div>').join('')+'</div><div class="p-total-line"><span>실제 공부 합계</span><strong>'+dur(Object.values(t).reduce((a,b)=>a+b,0))+'</strong></div>'}
function pDateLabel(date){const d=new Date(date+'T12:00:00');return (d.getMonth()+1)+'월 '+d.getDate()+'일 <span>'+['일','월','화','수','목','금','토'][d.getDay()]+'요일</span>'}

function pDayPlans(date){const info=reportInfo(date),d=pDay(date),events=info.day?schedule(info.day):[];return '<div class="p-plan-list">'+events.map(ev=>'<div class="p-linked-plan"><details class="p-plan-row '+(ev.done||ev.skipped?'is-done':'')+'" '+reportFoldAttrs('p-plan:'+date+':'+ev.id)+'><summary><span class="p-plan-status">'+(ev.done?'✓':ev.skipped?'–':'')+'</span><span class="p-plan-name">'+esc(eventDisplayName(ev.name))+'</span><span class="p-plan-meta">'+(ev.skipped?'건너뜀':clock(ev.startComputed)+' · '+dur(ev.duration))+'</span><span class="p-caret">⌄</span></summary><div class="p-plan-detail">'+(ev.items?.length?ev.items.map(item=>'<label class="p-checkline"><input type="checkbox" data-p-event="'+esc(ev.id)+'" data-p-item="'+esc(item.id)+'" data-p-date="'+date+'" '+(item.checked?'checked':'')+'><span>'+esc(item.name)+'</span></label>').join(''):'<p class="p-muted">체크리스트 없음</p>')+'<span class="p-muted">실제 '+dur(info.logs.filter(l=>l.eventId===ev.id||(!l.eventId&&findLogEvent(l).event?.id===ev.id)).reduce((n,l)=>n+Number(l.minutes||0),0))+'</span></div></details>'+pButton('edit-plan',uiIcon('edit'),'data-date="'+date+'" data-id="'+esc(ev.id)+'" aria-label="'+esc(eventDisplayName(ev.name))+' 수정"','p-plan-edit')+'</div>').join('')+(d.tasks||[]).map(task=>'<div class="p-task-row p-legacy-task"><input type="checkbox" aria-label="할 일 완료" data-p-task="'+task.id+'" data-p-date="'+date+'" '+(task.checked?'checked':'')+'><input class="p-task-text" data-p-task-text="'+task.id+'" data-p-date="'+date+'" value="'+esc(task.text)+'" aria-label="할 일 내용">'+pButton('place-task','시간표에 배치','data-date="'+date+'" data-id="'+task.id+'"')+'<button class="p-icon-btn" type="button" data-action="p-delete-task" data-date="'+date+'" data-id="'+task.id+'" aria-label="할 일 삭제">×</button></div>').join('')+(!events.length&&!d.tasks?.length?'<p class="p-empty">아직 계획이 없어요. 할 일을 추가해보세요.</p>':'')+'</div>'}
function placePlannerTask(date,taskId){const task=pDay(date).tasks.find(t=>t.id===taskId);if(!task)return;addModal(null,date);const form=$('#add-form');form.elements.namedItem('name').value=task.text;const field=document.createElement('input');field.type='hidden';field.name='plannerTask';field.value=taskId;form.appendChild(field)}

function pGridCells(date){const dayStart=new Date(date+'T00:00:00').getTime(),end=dayStart+86400000,cells=Array.from({length:144},()=>({logs:[],minutes:0,subject:null,manual:null}));let unplaced=0;for(const log of state.logs||[]){if(log.date!==date||log.kind!=='study'||!Number(log.minutes))continue;if(Number.isInteger(log.plannerSlot)&&log.plannerSlot>=0&&log.plannerSlot<144){const c=cells[log.plannerSlot];c.logs.push(log);c.minutes+=Number(log.minutes);c.subject=log.subject;c.manual=log;continue}const to=new Date(log.at).getTime(),from=log.startAt?new Date(log.startAt).getTime():to-Number(log.minutes)*60000;if(log.manualCorrection||!Number.isFinite(from)||!Number.isFinite(to)||to<=from){unplaced+=Number(log.minutes);continue}let minutes=Number(log.minutes),span=(to-from)/60000;const ratio=Math.min(1,minutes/span);let placed=0;for(let i=0;i<144;i++){const overlap=Math.max(0,Math.min(to,dayStart+(i+1)*600000,end)-Math.max(from,dayStart+i*600000));if(overlap){const c=cells[i],n=overlap/60000*ratio;c.logs.push(log);c.minutes+=n;c.subject=log.subject;placed+=n}}unplaced+=Math.max(0,minutes-placed)}return {cells,unplaced}}
function pTimetable(date){const {cells,unplaced}=pGridCells(date);let html='<div class="p-grid-top"><span>시</span>'+['00','10','20','30','40','50'].map(s=>'<span>'+s+'</span>').join('')+'</div>';for(let h=0;h<24;h++)html+='<div class="p-grid-hour"><span>'+String(h).padStart(2,'0')+'</span>'+Array.from({length:6},(_,m)=>{const slot=h*6+m,c=cells[slot],manualOnly=c.manual&&c.logs.every(l=>l.plannerSlot===slot),label=clock(slot*10)+'–'+clock((slot+1)*10),title=c.logs.length?c.logs.map(l=>eventDisplayName(l.name)).join(' / ')+' · '+Math.round(c.minutes*10)/10+'분'+(manualOnly?' (직접 기록)':' (기존 시간 기록)'):label+' 공부 기록';return '<button type="button" class="p-time-cell '+(c.logs.length?'filled':'')+' '+(manualOnly?'manual':'')+'" style="'+(c.logs.length?'--cell-tone:'+(pSubjects[c.subject]?.tone||'#777')+';':'')+'" data-action="p-grid" data-date="'+date+'" data-slot="'+slot+'" title="'+esc(label+' · '+title)+'" aria-label="'+esc(label+' · '+title)+'">'+(c.logs.length?pSubjects[c.subject]?.short||'공':'')+'</button>'}).join('')+'</div>';return '<section class="p-paper-section p-timetable">'+pHeading('타임테이블','한 칸 10분')+'<div class="p-brushes" aria-label="공부 기록 과목">'+Object.entries(pSubjects).map(([k,s])=>pButton('brush',s.label,'data-brush="'+k+'" aria-pressed="'+(plannerBrush===k)+'"',plannerBrush===k?'selected':'')).join('')+pButton('brush','지우기','data-brush="erase" aria-pressed="'+(plannerBrush==='erase')+'"',plannerBrush==='erase'?'selected':'')+'</div><p class="p-caption">과목을 선택하고 빈 칸을 누르면 실제 공부시간에 저장돼요.<br>기존 시간 기록은 아래 ‘시간 기록 수정 · 취소’에서 수정해요.</p><div class="p-time-grid">'+html+'</div>'+(unplaced>0?'<p class="p-caption">시각 정보 없는 기록 '+dur(Math.round(unplaced))+'도 공부 합계에 포함돼요.</p>':'')+'</section>'}
function pDaily(){const info=reportInfo(reportDate),d=pDay();return '<div class="p-day-title"><div class="p-eyebrow">'+reportDate.slice(0,4)+' DAILY RECORD</div><h2>'+pDateLabel(reportDate)+'</h2><div class="p-tags">'+pTags(reportDate)+pButton('tags','+ 태그','data-date="'+reportDate+'"','tag-add')+'</div></div><div class="p-daily-layout"><div class="p-daily-left"><section class="p-paper-section p-daily-goal">'+pHeading('오늘의 목표')+pInput('day',reportDate,'goal',d.goal,'오늘의 목표를 적어보세요')+'</section><section class="p-paper-section p-planner-plans"><details '+reportFoldAttrs('p-plans:'+reportDate)+'><summary class="p-plans-summary"><div><h3>계획 · 할 일</h3><span>'+info.events.length+'개 일정 · '+(d.tasks||[]).length+'개 할 일</span></div><span class="p-caret">⌄</span></summary><div class="p-plans-expanded"><div class="p-section-head"><span class="p-muted">일정을 누르면 체크리스트가 열려요.</span>'+pButton('add-task','+ 할 일','data-date="'+reportDate+'"')+'</div>'+pDayPlans(reportDate)+'</div></details></section><section class="p-paper-section p-daily-totals">'+pHeading('과목별 공부시간')+pTotalsHTML([reportDate])+'<p class="p-caption">목표 시간 합계 '+dur(info.studies.filter(e=>!e.skipped).reduce((n,e)=>n+Number(e.duration||0),0))+'</p></section><section class="p-paper-section p-daily-note">'+pHeading('오늘의 메모')+pInput('day',reportDate,'note',d.note,'오늘 남기고 싶은 기록',true)+'</section></div>'+pTimetable(reportDate)+'</div><div class="p-day-utilities">'+timeRecordsHTML(reportDate)+'<div class="p-export-row">'+pButton('export-jpg','JPG 저장 '+uiIcon('download'))+pButton('export-pdf','PDF 저장 '+uiIcon('download'))+'</div><p class="p-caption">선택한 날짜의 플래너를 저장해요.<br>전체 데이터 보관·복원은 설정의 JSON 백업을 사용하세요.</p></div>'}
function pMonthDays(month){const first=new Date(month+'-01T12:00:00'),count=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();return Array.from({length:count},(_,i)=>month+'-'+String(i+1).padStart(2,'0'))}
function pMiniCalendar(month){const dates=pMonthDays(month),offset=(new Date(dates[0]+'T12:00:00').getDay()+6)%7;return '<section class="p-mini-month"><button class="p-month-link" data-action="p-date" data-date="'+month+'-01" data-mode="month">'+Number(month.slice(5))+'월</button><div class="p-mini-grid">'+['월','화','수','목','금','토','일'].map(x=>'<span class="p-weekday">'+x+'</span>').join('')+'<span class="p-mini-blank" style="grid-column:span '+(offset||1)+';'+(!offset?'display:none;':'')+'"></span>'+dates.map(date=>'<button data-action="p-date" data-date="'+date+'" data-mode="day" class="'+(date===dateISO(new Date())?'today':'')+' '+(reportInfo(date).actual?'has-record':'')+'" title="'+date+'">'+Number(date.slice(8))+'</button>').join('')+'</div></section>'}
function pAnnual(){const year=reportDate.slice(0,4),p=ensurePlanner(),profile=p.profile,dd=profile.targetDate?Math.ceil((new Date(profile.targetDate+'T00:00:00')-new Date(dateISO(new Date())+'T00:00:00'))/86400000):null;return '<div class="p-year-heading"><div><div class="p-eyebrow">STUDY PLANNER</div><h2>'+year+'</h2></div>'+(dd!==null?'<div class="p-dday">D'+(dd>0?'−'+dd:dd===0?'-DAY':'+'+Math.abs(dd))+'</div>':'')+'</div><div class="p-profile"><label>이름'+pInput('profile','main','name',profile.name,'이름')+'</label><label>목표'+pInput('profile','main','goal',profile.goal,'나의 목표')+'</label><label>목표 날짜<input type="date" data-p-scope="profile" data-p-key="main" data-p-field="targetDate" value="'+esc(profile.targetDate||'')+'" aria-label="목표 날짜"></label></div><div class="p-annual-grid">'+Array.from({length:12},(_,i)=>pMiniCalendar(year+'-'+String(i+1).padStart(2,'0'))).join('')+'</div>'}
function pMonthly(){const month=reportDate.slice(0,7),dates=pMonthDays(month),start=pMonday(dates[0]),weeks=Math.ceil(((new Date(dates[0]+'T12:00:00').getDay()+6)%7+dates.length)/7),d=pMonth();let rows='';for(let w=0;w<weeks;w++){const monday=addDays(start,w*7);rows+='<div class="p-month-week">'+pButton('date','W'+(w+1),'data-date="'+monday+'" data-mode="week"','week-link')+Array.from({length:7},(_,i)=>{const date=addDays(monday,i),inside=date.slice(0,7)===month,info=reportInfo(date);return '<button data-action="p-date" data-date="'+date+'" data-mode="day" class="p-calendar-day '+(!inside?'outside':'')+' '+(date===dateISO(new Date())?'today':'')+'"><strong>'+Number(date.slice(8))+'</strong><div class="p-calendar-tags">'+pTags(date,true)+'</div><span class="p-calendar-agenda">'+[...info.events.map(e=>e.name),...pDay(date).tasks.map(t=>t.text)].slice(0,2).map(esc).join('<br>')+'</span><span class="p-calendar-total">'+(info.actual?dur(info.actual):'')+'</span></button>'}).join('')+'</div>'}return '<div class="p-section-title"><h2>'+Number(month.slice(5))+'월 <span>'+month.slice(0,4)+'</span></h2></div><div class="p-month-layout"><div class="p-month-calendar"><div class="p-month-weekdays"><span></span>'+['월','화','수','목','금','토','일'].map(x=>'<span>'+x+'</span>').join('')+'</div>'+rows+'</div><aside><section class="p-paper-section">'+pHeading('이달의 목표','',pButton('add-month-goal','+ 목표','data-month="'+month+'"'))+'<div class="p-goals">'+d.goals.map(g=>'<label class="p-month-goal"><input type="checkbox" data-p-month-check="'+g.id+'" data-p-month="'+month+'" '+(g.checked?'checked':'')+'><input class="p-task-text" data-p-month-text="'+g.id+'" data-p-month="'+month+'" value="'+esc(g.text)+'" aria-label="이달의 목표"><button type="button" class="p-icon-btn" data-action="p-delete-month-goal" data-month="'+month+'" data-id="'+g.id+'" aria-label="목표 삭제">×</button></label>').join('')+(!d.goals.length?'<p class="p-empty">이번 달의 목표를 추가해보세요.</p>':'')+'</div></section><section class="p-paper-section">'+pHeading('이달의 공부시간')+pTotalsHTML(dates)+'</section><section class="p-paper-section">'+pHeading('한 달 회고')+pInput('month',month,'review',d.review,'이번 달을 돌아보며',true)+'</section></aside></div>'}
function pWeekly(){const monday=pMonday(),dates=Array.from({length:7},(_,i)=>addDays(monday,i)),w=pWeek();return '<div class="p-section-title"><h2>주간 기록 <span>'+monday.slice(5).replace('-','.')+' — '+dates[6].slice(5).replace('-','.')+'</span></h2></div><section class="p-paper-section p-week-goal">'+pHeading('이번 주 목표')+pInput('week',monday,'goal',w.goal,'이번 주에 해낼 것')+'</section><div class="p-week-scroll"><div class="p-week-columns">'+dates.map((date,i)=>{const info=reportInfo(date),d=pDay(date),items=[...info.events.map(e=>({text:eventDisplayName(e.name),checked:e.done||e.skipped})),...(d.tasks||[])];return '<section class="p-week-day '+(date===dateISO(new Date())?'today':'')+'"><button class="p-week-date" data-action="p-date" data-mode="day" data-date="'+date+'">'+['월','화','수','목','금','토','일'][i]+' <span>'+date.slice(5).replace('-','/')+'</span></button><div class="p-week-tags">'+pTags(date,true)+'</div>'+(d.goal?'<p class="p-week-day-goal">'+esc(d.goal)+'</p>':'')+'<ul>'+items.slice(0,10).map(item=>'<li class="'+(item.checked?'checked':'')+'"><span>'+(item.checked?'✓':'□')+'</span>'+esc(item.text)+'</li>').join('')+'</ul>'+pButton('date',items.length>10?'+'+(items.length-10)+'개 · 일간 보기':'일간 열기','data-date="'+date+'" data-mode="day"','p-day-link')+'<div class="p-week-time"><span>실제 공부</span><strong>'+dur(info.actual)+'</strong></div></section>'}).join('')+'</div></div><div class="p-week-review"><section class="p-paper-section">'+pHeading('이번 주 공부시간')+pTotalsHTML(dates)+'</section>'+[['keep','Keep','이어갈 것'],['problem','Problem','아쉬웠던 것'],['try','Try','다음 주에 해볼 것']].map(([field,title,ph])=>'<section class="p-paper-section">'+pHeading(title,ph)+pInput('week',monday,field,w[field],ph,true)+'</section>').join('')+'</div>'}

function pProgress(){const p=ensurePlanner(),subjects=p.customSubjects;return '<div class="p-section-title"><h2>회독 진도</h2>'+pButton('add-subject','+ 교재 · 과목')+'</div><p class="p-caption">완료한 회독을 누르면 날짜와 함께 저장돼요.</p><div class="p-table-scroll"><table class="p-table p-progress"><thead><tr><th>교재 · 과목</th>'+Array.from({length:10},(_,i)=>'<th>'+(i+1)+'회독</th>').join('')+'</tr></thead><tbody>'+subjects.map(s=>{const passes=p.progress[s.id]||[];return '<tr><th>'+esc(s.name)+pButton('edit-subject',uiIcon('edit'),'data-id="'+s.id+'" aria-label="교재 수정"','p-subject-delete')+'</th>'+Array.from({length:10},(_,i)=>'<td><button type="button" class="p-pass '+(passes[i]?'done':'')+'" data-action="p-pass" data-id="'+s.id+'" data-pass="'+i+'" aria-pressed="'+!!passes[i]+'" aria-label="'+esc(s.name)+' '+(i+1)+'회독"><strong>'+(passes[i]?'✓':'○')+'</strong><small>'+(passes[i]?passes[i].slice(5).replace('-','/'):'')+'</small></button></td>').join('')+'</tr>'}).join('')+'</tbody></table></div>'}
function pExamAverage(exam){const scores=Object.values(exam.scores||{}).filter(v=>v!==''&&v!==null&&v!==undefined).map(Number).filter(Number.isFinite);return scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:null}
function pExams(){const exams=ensurePlanner().exams.slice().sort((a,b)=>a.date.localeCompare(b.date)),points=exams.filter(e=>pExamAverage(e)!==null).slice(-12),coords=points.map((e,i)=>[40+(points.length===1?240:i*480/(points.length-1)),210-pExamAverage(e)*1.8]);return '<div class="p-section-title"><h2>모의고사</h2>'+pButton('exam','+ 성적 기록')+'</div><div class="p-table-scroll"><table class="p-table"><thead><tr><th>날짜 / 시험</th>'+Object.values(pSubjects).map(s=>'<th>'+s.label+'</th>').join('')+'<th>평균</th><th>소요 시간</th><th></th></tr></thead><tbody>'+exams.map(e=>'<tr><th>'+e.date+'<small>'+esc(e.name)+'</small></th>'+Object.keys(pSubjects).map(k=>'<td>'+(e.scores?.[k]!==''&&e.scores?.[k]!=null?esc(e.scores[k]):'—')+'</td>').join('')+'<td><strong>'+(pExamAverage(e)!==null?pExamAverage(e).toFixed(1):'—')+'</strong></td><td>'+(e.minutes!=null?esc(e.minutes)+'분':'—')+'</td><td>'+pButton('exam','수정','data-id="'+e.id+'"')+'</td></tr>').join('')+'</tbody></table></div>'+(!exams.length?'<div class="p-empty">시험별 점수를 추가해보세요.</div>':'')+'<section class="p-paper-section p-exam-chart">'+pHeading('평균 점수 추이','최근 12회 · 입력한 과목 기준')+(points.length?'<svg viewBox="0 0 560 255" role="img" aria-label="모의고사 평균 점수 추이">'+[0,25,50,75,100].map(n=>'<line x1="40" x2="525" y1="'+(210-n*1.8)+'" y2="'+(210-n*1.8)+'" stroke="#e8e8e8"/><text x="5" y="'+(214-n*1.8)+'" fill="#777" font-size="11">'+n+'</text>').join('')+'<polyline fill="none" stroke="#333" stroke-width="2" points="'+coords.map(c=>c.join(',')).join(' ')+'"/>'+coords.map(([x,y],i)=>'<circle cx="'+x+'" cy="'+y+'" r="4" fill="#333"/><text x="'+x+'" y="'+(y-10)+'" text-anchor="middle" font-size="11" fill="#333">'+pExamAverage(points[i]).toFixed(1)+'</text><text x="'+x+'" y="238" text-anchor="middle" font-size="9" fill="#777">'+points[i].date.slice(5)+'</text>').join('')+'</svg>':'<p class="p-empty">성적을 입력하면 추이가 표시돼요.</p>')+'</section>'}

function pErrors(){const rows=ensurePlanner().errors.slice().sort((a,b)=>b.date.localeCompare(a.date)),groups=new Map();for(const row of rows){if(!groups.has(row.date))groups.set(row.date,[]);groups.get(row.date).push(row)}return '<div class="p-section-title"><h2>오답 노트</h2>'+pButton('error','+ 오답 기록')+'</div><div class="p-error-dates">'+[...groups].map(([date,items])=>'<details class="p-error-date" '+reportFoldAttrs('error-day:'+date,date===reportDate)+'><summary><strong>'+fmtDate(date)+'</strong><span>'+items.length+'건 · 복습 완료 '+items.filter(e=>e.done).length+'/'+items.length+'</span><span class="p-caret">⌄</span></summary><div class="p-error-list">'+items.map(e=>'<details class="p-error-entry" '+reportFoldAttrs('error:'+e.id)+'><summary><span class="p-tag">'+pSubjectName(e.subject)+'</span><div><strong>'+esc(e.topic)+'</strong><span>'+(e.done?'복습 완료':'복습 전')+'</span></div><span>⌄</span></summary><div class="p-error-body"><h4>틀린 내용</h4><p>'+esc(e.problem||'—')+'</p><h4>정리 · 다시 볼 내용</h4><p>'+esc(e.correction||'—')+'</p><div class="p-row-actions">'+pButton('error-done',e.done?'복습 완료 취소':'복습 완료','data-id="'+e.id+'"')+pButton('error','수정','data-id="'+e.id+'"')+'</div></div></details>').join('')+'</div></details>').join('')+(!rows.length?'<div class="p-empty">다시 확인할 내용을 짧게 남겨보세요.</div>':'')+'</div>'}

let plannerNoteId='';
function pNotes(){const p=ensurePlanner();if(!p.notes.some(n=>n.id===plannerNoteId))plannerNoteId=p.notes[0]?.id||'';const note=p.notes.find(n=>n.id===plannerNoteId);return '<div class="p-section-title"><h2>자유 메모</h2>'+pButton('add-note','+ 메모')+'</div><div class="p-notes-layout"><div class="p-notes-list">'+p.notes.map(n=>pButton('select-note',esc(n.title||'제목 없는 메모'),'data-id="'+n.id+'"',n.id===plannerNoteId?'selected':'')).join('')+'</div><section class="p-paper-section p-note-editor">'+(note?'<p class="p-note-save" role="status">'+esc(note.createdAt?new Date(note.createdAt).toLocaleString('ko-KR'):note.date||'')+' · 자동 저장</p>'+pInput('note',note.id,'title',note.title,'메모 제목')+pInput('note',note.id,'body',note.body,'내용을 자유롭게 적어보세요',true)+'<div class="p-row-actions">'+pButton('delete-note','메모 삭제','data-id="'+note.id+'"','danger')+'</div>':'<div class="p-empty">새 메모를 추가해보세요.</div>')+'</section></div>'}
function pStats(){const dates=[...new Set(state.logs.map(l=>l.date))].filter(Boolean),overruns=[...state.days,...Object.values(state.archivedDays||{})].flatMap(day=>day.events.filter(e=>e.kind==='study'&&e.extra>0).map(e=>({...e,date:day.date}))).sort((a,b)=>b.extra-a.extra).slice(0,10);return '<div class="p-section-title"><h2>누적 기록</h2></div><div class="p-stats-layout"><section class="p-paper-section">'+pHeading('전체 공부시간')+pTotalsHTML(dates)+'<p class="p-caption">체크 완료와 별개로 실제 저장된 시간 기록을 합산해요.</p></section><section class="p-paper-section">'+pHeading('추가 소요시간','가장 오래 걸린 순서')+'<div class="p-stat-rows">'+overruns.map(e=>'<div><span>'+esc(eventDisplayName(e.name))+'<small>'+e.date+'</small></span><strong>+'+e.extra+'분</strong></div>').join('')+(!overruns.length?'<p class="p-empty">초과 기록이 없어요.</p>':'')+'</div></section></div>'}
function report(){ensurePlanner();const date=reportDate,month=Number(date.slice(5,7)),year=date.slice(0,4),pages={day:pDaily,week:pWeekly,month:pMonthly,year:pAnnual,progress:pProgress,exams:pExams,errors:pErrors,notes:pNotes,stats:pStats};return '<div class="planner"><div class="p-toolbar"><div class="p-mode-tabs" aria-label="기록 보기">'+Object.entries(plannerTabs).map(([key,label])=>pButton('view',label,'data-mode="'+key+'" aria-pressed="'+(plannerView===key)+'"',plannerView===key?'selected':'')).join('')+'</div><div class="p-date-nav">'+pButton('shift','‹','data-step="-1" aria-label="이전 기간"')+'<input type="date" value="'+date+'" id="p-date-picker" aria-label="플래너 날짜">'+pButton('shift','›','data-step="1" aria-label="다음 기간"')+pButton('today','오늘')+'</div></div><div class="p-book"><main class="p-sheet">'+pages[plannerView]()+'</main><nav class="p-month-rail" aria-label="월 바로가기"><span>'+year+'</span>'+Array.from({length:12},(_,i)=>pButton('date',(i+1)+'월','data-date="'+year+'-'+String(i+1).padStart(2,'0')+'-01" data-mode="month"',i+1===month?'selected':'')).join('')+'</nav></div><div class="p-save-status">로그인 상태에서는 계정에 자동 저장돼요.</div></div>'}
function pModal(title,body){$('#modals').innerHTML='<div class="modal-cover"><div class="modal p-modal" role="dialog" aria-modal="true" aria-label="'+title+'"><div class="p-section-title"><h3>'+title+'</h3><button type="button" class="p-icon-btn" data-action="close-modal" aria-label="닫기">×</button></div>'+body+'</div></div>'}
function pTagModal(date){const p=ensurePlanner(),tags=[...new Set([...pTagPresets,...p.customTags,...(pDay(date).tags||[])])];pModal('날짜 태그','<p class="p-caption">'+date+' · 태그를 누르면 붙이거나 뗄 수 있어요.</p><div class="p-tag-picker">'+tags.map(tag=>pButton('toggle-tag',esc(tag),'data-date="'+date+'" data-tag="'+esc(tag)+'" aria-pressed="'+pDay(date).tags.includes(tag)+'"',pDay(date).tags.includes(tag)?'selected':'')).join('')+'</div><form id="p-tag-form" class="p-inline-form"><input type="hidden" name="date" value="'+date+'"><input name="tag" required maxlength="24" placeholder="나만의 태그" aria-label="새 태그"><button class="p-btn selected">추가</button></form>')}
function pRecordModal(type,recordId){const p=ensurePlanner(),e=(type==='exam'?p.exams:p.errors).find(x=>x.id===recordId)||{date:reportDate,scores:{}},exam=type==='exam';pModal(exam?'모의고사 성적':'오답 기록','<form id="p-record-form" class="p-record-form"><input type="hidden" name="type" value="'+type+'"><input type="hidden" name="id" value="'+(e.id||'')+'"><label>날짜<input type="date" name="date" required value="'+e.date+'"></label>'+(exam?'<label>시험 이름<input name="name" maxlength="120" required value="'+esc(e.name||'')+'" placeholder="모의고사 이름"></label><label>소요 시간 (분)<input type="number" name="minutes" min="0" max="1440" value="'+esc(e.minutes??'')+'" placeholder="미입력"></label><div class="p-score-inputs">'+Object.entries(pSubjects).map(([key,s])=>'<label>'+s.label+'<input type="number" name="'+key+'" min="0" max="100" step="0.1" value="'+esc(e.scores?.[key]??'')+'" placeholder="미입력"></label>').join('')+'</div>':'<label>과목<select name="subject">'+Object.entries(pSubjects).map(([key,s])=>'<option value="'+key+'" '+(e.subject===key?'selected':'')+'>'+s.label+'</option>').join('')+'</select></label><label>제목<input name="topic" maxlength="200" required value="'+esc(e.topic||'')+'" placeholder="문제 · 단원 · 개념"></label><label>틀린 내용<textarea name="problem">'+esc(e.problem||'')+'</textarea></label><label>정리 · 다시 볼 내용<textarea name="correction">'+esc(e.correction||'')+'</textarea></label>')+'<div class="p-modal-footer">'+(e.id?pButton('delete-record','삭제','data-type="'+type+'" data-id="'+e.id+'"','danger'):'')+'<button type="submit" class="p-btn selected">저장</button></div></form>')}
function pFieldTarget(scope,key){const p=ensurePlanner();if(scope==='day')return pDay(key);if(scope==='month')return pMonth(key);if(scope==='week')return pWeek(key);if(scope==='profile')return p.profile;if(scope==='note')return p.notes.find(n=>n.id===key);return null}
function plannerInput(event){const t=event.target,ds=t.dataset||{};if(ds.pField){const allowed={day:['goal','note'],month:['review'],week:['goal','keep','problem','try'],profile:['name','goal','targetDate'],note:['title','body']};if(!allowed[ds.pScope]?.includes(ds.pField))return;const target=pFieldTarget(ds.pScope,ds.pKey);if(target){target[ds.pField]=t.value;save();if(ds.pScope==='note'){const label=document.querySelector('[data-action="p-select-note"][data-id="'+ds.pKey+'"]'),status=document.querySelector('.p-note-save');if(label&&ds.pField==='title')label.textContent=t.value||'제목 없는 메모';if(status)status.textContent=cloudUser?'기기에 저장됨 · 서버 자동 저장':'이 기기에 저장됨'}}}else if(ds.pTaskText){const task=pDay(ds.pDate).tasks.find(x=>x.id===ds.pTaskText);if(task){task.text=t.value;save()}}else if(ds.pMonthText){const task=pMonth(ds.pMonth).goals.find(x=>x.id===ds.pMonthText);if(task){task.text=t.value;save()}}}
function plannerChange(event){const t=event.target,ds=t.dataset||{};if(t.id==='p-date-picker'){if(/^\d{4}-\d{2}-\d{2}$/.test(t.value)){reportDate=t.value;render()}return}if(ds.pField){if(ds.pScope==='profile'&&ds.pField==='targetDate')render();return}if(ds.pEvent){const ev=getDay(ds.pDate)?.events.find(x=>x.id===ds.pEvent),item=ev?.items?.find(x=>x.id===ds.pItem);if(item){item.checked=t.checked;save()}return}if(ds.pTask){const task=pDay(ds.pDate).tasks.find(x=>x.id===ds.pTask);if(task){task.checked=t.checked;save()}return}if(ds.pMonthCheck){const task=pMonth(ds.pMonth).goals.find(x=>x.id===ds.pMonthCheck);if(task){task.checked=t.checked;save()}}}
function pGridChange(date,slot){if(active){alert('진행 중인 타이머를 마친 뒤 직접 기록해주세요.');return}if(!Number.isInteger(slot)||slot<0||slot>143)return;const c=pGridCells(date).cells[slot],others=c.logs.filter(l=>l.plannerSlot!==slot);if(others.length){alert('이 칸에는 기존 시간 기록이 있어요. 아래 ‘시간 기록 수정 · 취소’에서 변경해주세요.');return}if(plannerBrush==='erase'&&!c.manual)return;if(plannerBrush!=='erase'&&!pSubjects[plannerBrush])return;const before=checkpointFeature();state.logs=state.logs.filter(l=>!(l.date===date&&l.plannerSlot===slot));if(plannerBrush!=='erase'&&!(c.manual&&c.manual.subject===plannerBrush)){const end=new Date(date+'T00:00:00');end.setMinutes((slot+1)*10);const start=new Date(end.getTime()-600000);state.logs.push({id:id(),date,kind:'study',subject:plannerBrush,name:pSubjectName(plannerBrush)+' · 직접 기록',minutes:10,at:end.toISOString(),startAt:start.toISOString(),plannerSlot:slot})}finishFeature(before,'10분 공부 기록을 변경했어요.')}
function handlePlannerAction(act,ds){if(!act?.startsWith('p-'))return false;const p=ensurePlanner(),action=act.slice(2);if(action==='view'){if(Object.hasOwn(plannerTabs,ds.mode))plannerView=ds.mode;render()}
else if(action==='date'){if(/^\d{4}-\d{2}-\d{2}$/.test(ds.date)){reportDate=ds.date;plannerView=Object.hasOwn(plannerTabs,ds.mode)?ds.mode:'day';render()}}
else if(action==='shift'){const step=Number(ds.step),d=new Date(reportDate+'T12:00:00');if(plannerView==='year')d.setFullYear(d.getFullYear()+step);else if(plannerView==='month'){d.setDate(1);d.setMonth(d.getMonth()+step)}else d.setDate(d.getDate()+step*(plannerView==='week'?7:1));reportDate=dateISO(d);render()}
else if(action==='today'){reportDate=dateISO(new Date());render()}
else if(action==='brush'){plannerBrush=ds.brush;render()}
else if(action==='grid')pGridChange(ds.date,Number(ds.slot));
else if(action==='tags')pTagModal(ds.date);
else if(action==='toggle-tag'){const d=pDay(ds.date);d.tags=d.tags.includes(ds.tag)?d.tags.filter(t=>t!==ds.tag):[...d.tags,ds.tag];save();render();pTagModal(ds.date)}
else if(action==='remove-tag'){const d=pDay(ds.date);d.tags=d.tags.filter(t=>t!==ds.tag);save();render()}
else if(action==='add-task')addModal(null,ds.date);
else if(action==='edit-plan')eventDetail(ds.id,ds.date);
else if(action==='place-task')placePlannerTask(ds.date,ds.id);
else if(action==='delete-task'){const before=checkpointFeature();pDay(ds.date).tasks=pDay(ds.date).tasks.filter(t=>t.id!==ds.id);finishFeature(before,'할 일을 삭제했어요.')}
else if(action==='add-month-goal'){const goal={id:id(),text:'',checked:false};pMonth(ds.month).goals.push(goal);save();render();document.querySelector('[data-p-month-text="'+goal.id+'"]')?.focus()}
else if(action==='delete-month-goal'){const before=checkpointFeature();pMonth(ds.month).goals=pMonth(ds.month).goals.filter(t=>t.id!==ds.id);finishFeature(before,'월간 목표를 삭제했어요.')}
else if(action==='pass'){const i=Number(ds.pass);if(i>=0&&i<10){const passes=p.progress[ds.id]||(p.progress[ds.id]=[]);passes[i]=passes[i]?null:dateISO(new Date());save();render()}}
else if(action==='edit-subject'){const row=p.customSubjects.find(x=>x.id===ds.id);if(row)pModal('회독 항목 수정','<form id="p-subject-form" class="p-record-form"><input type="hidden" name="id" value="'+row.id+'"><label>교재 · 과목<input name="name" required maxlength="60" value="'+esc(row.name)+'"></label><div class="p-modal-footer">'+pButton('delete-subject','삭제','data-id="'+row.id+'"','danger')+'<button class="p-btn selected">저장</button></div></form>')}
else if(action==='add-subject'){pModal('교재 · 과목 추가','<form id="p-subject-form" class="p-inline-form"><input name="name" required maxlength="60" placeholder="교재 또는 과목 이름" aria-label="교재 또는 과목 이름"><button class="p-btn selected">추가</button></form>')}
else if(action==='delete-subject'){if(confirm('이 교재의 회독 기록을 삭제할까요?')){const before=checkpointFeature();p.customSubjects=p.customSubjects.filter(s=>s.id!==ds.id);delete p.progress[ds.id];finishFeature(before,'회독 항목을 삭제했어요.')}}
else if(action==='exam'||action==='error')pRecordModal(action,ds.id);
else if(action==='delete-record'){if(confirm('이 기록을 삭제할까요?')){const before=checkpointFeature(),key=ds.type==='exam'?'exams':'errors';p[key]=p[key].filter(r=>r.id!==ds.id);finishFeature(before,'기록을 삭제했어요.')}}
else if(action==='error-done'){const e=p.errors.find(e=>e.id===ds.id);if(e){e.done=!e.done;save();render()}}
else if(action==='add-note'){const n={id:id(),title:'',body:'',date:dateISO(new Date()),createdAt:new Date().toISOString()};p.notes.unshift(n);plannerNoteId=n.id;save();render();document.querySelector('[data-p-scope="note"][data-p-field="title"]')?.focus()}
else if(action==='select-note'){plannerNoteId=ds.id;render()}
else if(action==='delete-note'){if(confirm('이 메모를 삭제할까요?')){const before=checkpointFeature();p.notes=p.notes.filter(n=>n.id!==ds.id);finishFeature(before,'메모를 삭제했어요.')}}

else if(action==='export-pdf')exportPdf();

function plannerSubmit(event){const form=event.target,formId=form.getAttribute('id');if(!['p-tag-form','p-subject-form','p-record-form'].includes(formId))return;event.preventDefault();const data=new FormData(form),p=ensurePlanner();if(formId==='p-tag-form'){const tag=String(data.get('tag')||'').trim().slice(0,24),date=String(data.get('date'));if(!tag)return;if(!pTagPresets.includes(tag)&&!p.customTags.includes(tag))p.customTags.push(tag);const d=pDay(date);if(!d.tags.includes(tag))d.tags.push(tag);save();render();pTagModal(date);return}if(formId==='p-subject-form'){const name=String(data.get('name')||'').trim();if(!name)return;const old=p.customSubjects.find(x=>x.id===data.get('id'));if(old)old.name=name;else p.customSubjects.push({id:id(),name});save();$('#modals').innerHTML='';render();return}const type=data.get('type'),key=type==='exam'?'exams':'errors',old=p[key].find(e=>e.id===data.get('id')),date=String(data.get('date')),before=checkpointFeature();if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;const row={id:old?.id||id(),date};if(type==='exam'){row.name=String(data.get('name')||'').trim();if(!row.name)return;const minutes=String(data.get('minutes')||'');if(minutes!==''&&(!Number.isFinite(Number(minutes))||Number(minutes)<0||Number(minutes)>1440))return;row.minutes=minutes===''?null:Number(minutes);row.scores={};for(const k of Object.keys(pSubjects)){const raw=data.get(k),v=raw===''?'':Number(raw);if(v!==''&&(!Number.isFinite(v)||v<0||v>100))return;row.scores[k]=v}}else{row.subject=String(data.get('subject'));row.topic=String(data.get('topic')||'').trim();row.problem=String(data.get('problem')||'');row.correction=String(data.get('correction')||'');row.done=old?.done||false;if(!row.topic||!pSubjects[row.subject])return}if(old)Object.assign(old,row);else p[key].push(row);finishFeature(before,'기록을 저장했어요.')}

function createPlannerCanvas(date){const W=1100,pad=48,gap=32,leftW=470,rightX=pad+leftW+gap,rightW=W-pad-rightX,ops=[],canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');let y=48;const family='"Apple SD Gothic Neo", "Malgun Gothic", sans-serif';function txt(value,x,top,width,size=15,weight=400,color='#555'){ctx.font=weight+' '+size+'px '+family;const lines=[];for(const paragraph of String(value||'').split('\n')){let row='';for(const char of Array.from(paragraph)){if(row&&ctx.measureText(row+char).width>width){lines.push(row);row=''}row+=char}lines.push(row)}for(const line of lines){ops.push({type:'text',text:line,x,y:top+size,size,weight,color});top+=size*1.65}return top}function rect(x,y,w,h,color){ops.push({type:'rect',x,y,w,h,color})}function rule(x,y,w){rect(x,y,w,1,'#e5e5e2')}function heading(title){y=txt(title,pad,y,leftW,18,700,'#292929')+13}const d=pDay(date),info=reportInfo(date);y=txt('공부루틴 · DAILY PLANNER',pad,y,W-2*pad,13,500,'#999')+8;y=txt(date+'  '+['일','월','화','수','목','금','토'][new Date(date+'T12:00:00').getDay()]+'요일',pad,y,W-2*pad,32,750,'#292929')+10;if(d.tags.length)y=txt(d.tags.map(t=>'#'+t).join('   '),pad,y,W-2*pad,13,500,'#777')+12;rule(pad,y,W-2*pad);y+=27;const gridTop=y;heading('오늘의 목표');y=txt(d.goal||'—',pad,y,leftW,16,500)+26;rule(pad,y-11,leftW);heading('계획 · 할 일');const events=info.day?schedule(info.day):[];for(const ev of events){const top=y;y=txt((ev.done?'✓ ':ev.skipped?'– ':'□ ')+eventDisplayName(ev.name),pad,y,leftW-150,15,650,'#333');txt(ev.skipped?'건너뜀':clock(ev.startComputed)+' · '+dur(ev.duration),pad+leftW-140,top,140,12,400,'#888');y=Math.max(y,top+26)+3;for(const item of ev.items||[])y=txt((item.checked?'✓ ':'□ ')+item.name,pad+20,y,leftW-20,13,400,item.checked?'#999':'#777');y+=10;rule(pad,y,leftW);y+=12}for(const task of d.tasks||[])y=txt((task.checked?'✓ ':'□ ')+task.text,pad,y,leftW,15,500)+13;if(!events.length&&!d.tasks.length)y=txt('기록 없음',pad,y,leftW,14,400,'#aaa')+15;y+=15;heading('과목별 공부시간');for(const [key,n] of Object.entries(pTotals([date]))){const top=y;y=txt(pSubjectName(key),pad,y,leftW/2,14);txt(dur(n),pad+leftW/2,top,leftW/2,14,600)}y+=12;rule(pad,y,leftW);y+=14;y=txt('실제 공부 합계  '+dur(info.actual),pad,y,leftW,18,700,'#333')+8;y=txt('목표 시간 합계  '+dur(info.studies.filter(e=>!e.skipped).reduce((n,e)=>n+Number(e.duration||0),0)),pad,y,leftW,12,400,'#999')+30;heading('오늘의 메모');y=txt(d.note||'—',pad,y,leftW,15,400)+30;txt('타임테이블',rightX,gridTop,rightW,18,700,'#292929');txt('한 칸 10분 · 실제 공부 기록',rightX,gridTop+34,rightW,12,400,'#999');const gy=gridTop+78,rh=35,timeW=32,cw=(rightW-timeW)/6;for(let c=0;c<6;c++)txt(String(c*10).padStart(2,'0'),rightX+timeW+c*cw+15,gy-22,cw,10,400,'#999');const cells=pGridCells(date).cells;for(let h=0;h<24;h++){txt(String(h).padStart(2,'0'),rightX,gy+h*rh+8,timeW,11,400,'#999');for(let m=0;m<6;m++){const cell=cells[h*6+m],x=rightX+timeW+m*cw,cy=gy+h*rh;rect(x,cy,cw-1,rh-1,cell.logs.length?(pSubjects[cell.subject]?.tone||'#777'):'#f7f7f5');if(cell.logs.length)txt(pSubjects[cell.subject]?.short||'공',x+cw/2-6,cy+9,cw,11,500,'#fff')}}const below=gy+24*rh+18;txt('영 영어   국 국어   법 행정법   학 행정학',rightX,below,rightW,11,400,'#888');const unplaced=pGridCells(date).unplaced;if(unplaced>0)txt('시각 정보 없는 기록 '+dur(Math.round(unplaced))+' 포함',rightX,below+25,rightW,11,400,'#999');const H=Math.max(y,below+75)+pad,scale=Math.min(2,14000/H,Math.sqrt(16000000/(W*H)));canvas.width=Math.ceil(W*scale);canvas.height=Math.ceil(H*scale);ctx.scale(scale,scale);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.textBaseline='alphabetic';for(const op of ops){ctx.fillStyle=op.color;if(op.type==='rect')ctx.fillRect(op.x,op.y,op.w,op.h);else{ctx.font=op.weight+' '+op.size+'px '+family;ctx.fillText(op.text,op.x,op.y)}}return {canvas,height:H,width:W,layout:ops}}

function prunePlanChat(){const chat=Array.isArray(state.chat)?state.chat:[],requests=chat.map((m,i)=>m.role==='user'?i:-1).filter(i=>i>=0),retained=requests.length?chat.slice(requests[Math.max(0,requests.length-3)]):[];if(retained.length!==chat.length){state.chat=retained;save()}return retained}

function eventDetail(eventId,date=null){editorDate=date;const day=editorDay();const e=day.events.find(x=>x.id===eventId);if(!e)return;$('#modals').innerHTML=`<div class="modal-cover"><div class="modal event-modal" role="dialog" aria-modal="true" aria-label="일정 관리"><form id="edit-form"><input type="hidden" name="eventDate" value="${day.date}"><input type="hidden" name="event" value="${e.id}"><header class="editor-header"><div class="editor-header-top"><span>${fmtDate(day.date)}${e.skipped?' · 오늘은 하지 않음':''}</span><button class="mini" type="button" data-action="close-modal" aria-label="창 닫기">${uiIcon('close')}</button></div><div class="event-name-editor"><input id="event-name-input" name="name" type="text" inputmode="text" enterkeyhint="done" value="${esc(eventDisplayName(e.name))}" aria-label="계획명 수정" required><button class="mini" type="button" data-action="rename-event" aria-label="계획명 수정">${uiIcon('edit')}</button></div></header><section class="editor-section editor-time"><div class="form-row"><div class="field"><label for="edit-start">시작 시간</label><input id="edit-start" name="start" type="time" value="${clock(e.start)}" required></div><div class="field"><label for="edit-duration">예상 시간 <span>· 분</span></label><input id="edit-duration" name="duration" type="number" min="${e.kind==='sleep'?0:1}" max="1440" value="${e.duration}" required></div></div><div class="field editor-subject"><label for="edit-subject">과목</label><select id="edit-subject" name="subject" ${e.kind==='study'?'':'disabled'}>${e.kind!=='study'?'<option value="">공부 일정에만 적용</option>':Object.entries(names).map(([k,v])=>`<option value="${k}" ${e.subject===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="editor-overtime"><label for="edit-extra"><strong>over time</strong><span class="editor-label-divider" aria-hidden="true">|</span><span>초과 시간 · 분</span></label><input id="edit-extra" name="extra" type="number" min="0" max="1440" value="${e.extra||0}" ${e.skipped||e.kind==='sleep'?'reado function canEditEvent(eventId){if(active&&active.id===eventId&&state.days[active.day]?.date===editorDay().date){alert('진행 중인 타이머를 종료한 뒤 이 일정을 수정해주세요.');return false}return true}
function deleteEvent(eventId){if(!canEditEvent(eventId))return;const day=editorDay(),idx=day.events.findIndex(x=>x.id===eventId),e=day.events[idx];if(!e||!confirm(`이 날짜에서 ‘${e.name}’ 일정을 삭제할까요? 완료한 시간 기록은 유지됩니다.`))return;const snapshot=JSON.parse(JSON.stringify(day.events));if(!e.skipped&&!e.done)shiftFollowing(day,idx,-(e.duration+Number(e.extra||0)));day.events.splice(idx,1);undoSchedule={date:day.date,day:dayIndex,events:snapshot};save();$('#modals').innerHTML='';render();showUndo('일정을 삭제했어요.')}

function moveEvent(eventId,direction){const day=editorDay(),i=day.events.findIndex(x=>x.id===eventId),j=i+direction;if(i<0||j<0||j>=day.events.length)return;if(isWakeEvent(day.events[i])||isWakeEvent(day.events[j])){alert('기상은 하루의 첫 일정이에요. 시작 시간을 수정하면 뒤 일정이 함께 이동합니다.');return}if(day.events[i].kind==='sleep'||day.events[j].kind==='sleep'){alert('취침은 시작 시간을 수정해서 이동해주세요.');return}if(!canEditEvent(eventId)||!canEditEvent(day.events[j].id))return;const first=Math.min(i,j),anchor=day.events[first].start;[day.events[i],day.events[j]]=[day.events[j],day.events[i]];day.events[first].start=anchor;day.events[first+1].start=anchor+day.events[first].duration;save();$('#modals').innerHTML='';render()}
function addEventFromForm(d){const targetDate=String(d.get('eventDate')||'');if(targetDate)editorDate=targetDate;const day=editorDay(),placement=d.get('placement'),duration=Number(d.get('duration')),kind=d.get('kind')||'study',name=String(d.get('name')||'').trim();if(!name||!Number.isInteger(duration)||duration<(kind==='sleep'?0:1)||duration>1440){alert('일정 이름과 예상 시간을 확인해주세요.');return false}if(active&&!pausedAt&&state.days[active.day]?.date===day.date){alert('타이머를 일시정지한 뒤 일정을 추가해주세요.');return false}let start=mins(d.get('start')),idx;if(placement==='first'){idx=0;start=day.events[0]?.start??start}else if(placement!=='time'){const anchor=day.events.findIndex(e=>e.id===placement);if(anchor<0){alert('앞 일정이 변경됐어요. 추가할 위치를 다시 선택해주세요.');return false}idx=anchor+1;start=schedule(day)[anchor].endComputed}else{idx=day.events.findIndex(e=>e.start>=start);if(idx<0)idx=day.events.length}if(!Number.isInteger(start)||start<0||start>1439){alert('시작 시간을 입력해주세요. 같은 날짜의 00:00~23:59 사이로 지정할 수 있어요.');return false}rememberQuickPlans();const item={id:id(),kind,name,duration,start,subject:kind==='study'?(d.get('subject')||'english'):'',items:checklistFromForm(d),done:false,skipped:false,extra:0,actual:0,logs:[]};const legacyId=d.get('plannerTask'),legacy=legacyId?pDay(day.date).tasks.find(t=>t.id===legacyId):null;if(legacy){item.done=!!legacy.checked;pDay(day.date).tasks=pDay(day.date).tasks.filter(t=>t.id!==legacyId)}if(editorDate&&!getDay(editorDate))state.archivedDays[editorDate]=day;day.events.splice(idx,0,item);rememberQuickPlans();save();$('#modals').innerHTML='';render();return true}
function applyDelay(eventId,min){const e=state.days[dayIndex].events.find(x=>x.id===eventId);if(!e||!canEditEvent(eventId))return;e.manualExtra=Math.max(0,Math.min(1440,Number(min)||0));e.extra=e.manualExtra;$('#modals').innerHTML='';save();render()}



function changeSchedule(subject,delta){let days=state.days, success=0;for(let d of days){let events=d.events.filter(e=>e.kind==='study'&&e.subject===subject);if(!events.length)continue;let e=events[0],newDur=Math.max(10,e.duration+delta);let actualChange=newDur-e.duration;e.duration=newDur;success+=actualChange;if(actualChange!==0){let i=d.events.findIndex(x=>x.id===e.id);for(let j=i+1;j<d.events.length;j++){if(d.events[j].kind==='sleep')continue;d.events[j].start+=actualChange}}}return success}
function normalizePlanName(value){return String(value).toLowerCase().replace(/인강|강의|계획|일정|공부|실제|시간|기록/g,'').replace(/[^a-z0-9가-힣]/g,'').replace(/(으로|로|만|의|을|를)$/,'')}
function fuzzyPlanMatch(day,query){const needle=normalizePlanName(query);if(!needle)return {error:'일정 이름을 적어주세요.'};const candidates=day.events.map(e=>({event:e,name:normalizePlanName(e.name)}));const exact=candidates.filter(c=>c.name===needle);if(exact.length===1)return {event:exact[0].event};let matches=candidates.filter(c=>(needle.length>=3||['점심','저녁','아침','기상','취침','휴식','산책','국어','영어'].includes(needle))&&(c.name.includes(needle)||needle.includes(c.name)&&c.name.length>=3));if(!matches.length&&needle.length>=3){let scored=candidates.map(c=>{let best=0;for(let i=0;i<needle.length;i++)for(let j=i+3;j<=needle.length;j++)if(c.name.includes(needle.slice(i,j)))best=Math.max(best,j-i);return {...c,score:best}}).filter(c=>c.score>=3);const max=Math.max(0,...scored.map(c=>c.score));matches=scored.filter(c=>c.score===max)}if(matches.length===1)return {event:matches[0].event};return {error:matches.length?'여러 일정이 비슷해요: '+matches.map(c=>c.event.name).join(' / ')+'. 구분되는 이름을 넣어 다시 요청해주세요.':'비슷한 일정을 찾지 못했어요. 시간표 이름 중 3글자 이상을 넣어주세요.'}}
function commandDate(text){const match=text.match(/\d{4}-\d{2}-\d{2}/);const md=text.match(/(?:(\d{4})년\s*)?(\d{1,2})월\s*(\d{1,2})일/);if(md)return (md[1]||(view==='report'?reportDate:state.days[dayIndex].date).slice(0,4))+'-'+md[2].padStart(2,'0')+'-'+md[3].padStart(2,'0');return match?match[0]:text.includes('모레')?addDays(dateISO(new Date()),2):text.includes('내일')?addDays(dateISO(new Date()),1):text.includes('오늘')?dateISO(new Date()):view==='report'?reportDate:state.days[dayIndex].date}
function studyCommandFingerprint(day){return JSON.stringify({events:day.events,logs:state.logs.filter(l=>l.date===day.date)})}
function parseStudyCommand(message){const text=message.trim(),date=commandDate(text),day=getDay(date),check=/체크\s*리스트|체크\s*항목/.test(text),reset=/초기화|리셋|제로|(?:^|[^\d])0\s*분으로/.test(text),actual=/실제|누적|기록|공부\s*시간/.test(text);if(!check&&!reset&&!(actual&&/수정|변경|바꿔|맞춰|설정|해줘/.test(text)))return null;if(!day)return {error:'해당 날짜의 일정이 없어요. 날짜를 확인해주세요.'};let clean=text.replace(/\d{4}-\d{2}-\d{2}/g,'').replace(/오늘의?|내일의?|모레의?/g,'').trim();if(/그리고|동시에|하고 나서/.test(clean))return {error:'한 번에 요청 하나씩 적어주세요. 변경 대상을 확인하고 적용합니다.'};if(check){let match=clean.match(/^(.+?)(?:계획|일정)?(?:에다가|에다|에)\s*(.+?)\s*(?:체크\s*리스트|체크\s*항목)\s*(?:만들|추가|넣|등록|생성)/);if(!match)match=clean.match(/^(.+?)\s*(?:체크\s*리스트|체크\s*항목)(?:에|로)?\s+(.+?)\s*(?:만들|추가|넣|등록|생성)/);if(!match)return {error:'어느 일정에 어떤 항목을 넣을까요? 예: “로즈리 인강계획에 day3 듣기 체크리스트 만들어줘”'};const found=fuzzyPlanMatch(day,match[1]);if(found.error)return found;const item=match[2].replace(/[“”"']/g,'').trim();if(!item)return {error:'추가할 체크리스트 내용을 적어주세요.'};if(found.event.items.some(i=>i.name.trim()===item))return {error:'해당 일정에 같은 체크리스트가 이미 있어요.'};return {kind:'study-command',operation:'checklist',date,eventId:found.event.id,item,signature:studyCommandFingerprint(day),summary:`${fmtDate(date)} · ‘${found.event.name}’에 ‘${item}’ 추가`}}
const duration=clean.match(/(?:(\d+)\s*시간\s*)?(\d+)\s*분/);const hoursOnly=clean.match(/(\d+)\s*시간/);const minutes=reset?0:duration?Number(duration[1]||0)*60+Number(duration[2]):hoursOnly?Number(hoursOnly[1])*60:null;if(minutes===null||minutes>1440)return {error:'실제 공부시간을 몇 분으로 바꿀까요? 예: “행정학 실제 공부시간을 90분으로 수정해줘”'};let target=clean.replace(/실제\s*공부\s*시간|실제\s*시간|공부\s*시간|누적\s*시간|시간\s*기록/g,'').replace(/(?:(\d+)\s*시간\s*)?(\d+)\s*분/g,'').replace(/\d+\s*시간/g,'').replace(/초기화.*|리셋.*|제로.*|수정.*|변경.*|바꿔.*|맞춰.*|설정.*|해줘.*/,'').replace(/(으로|로|을|를|의)\s*$/,'').trim();const all=/전부|전체|모두|모든/.test(target)||!normalizePlanName(target);let eventIds=[],subject=null,label='전체 공부';if(all){if(!reset)return {error:'전체 시간을 한 번에 배분하기보다 과목이나 일정 이름을 지정해주세요.'};eventIds=day.events.filter(e=>e.kind==='study').map(e=>e.id)}else{const subjectName=target.replace(/[^가-힣]/g,'').replace(/(으로|로|만|을|를)$/,'');subject=Object.keys(names).find(k=>names[k]===subjectName)||null;if(subject){label=names[subject];eventIds=day.events.filter(e=>e.kind==='study'&&e.subject===subject).map(e=>e.id)}else{const found=fuzzyPlanMatch(day,target);if(found.error)return found;if(found.event.kind!=='study')return {error:'실제 공부시간 변경은 공부 일정에 적용됩니다.'};eventIds=[found.event.id];label=found.event.name}}const logs=state.logs.filter(l=>l.date===date&&l.kind==='study'&&(all||subject&&l.subject===subject||eventIds.includes(findLogEvent(l).event?.id)));if(!eventIds.length&&!logs.length)return {error:'해당 과목의 일정이나 공부 기록이 없어요.'};const old=logs.reduce((n,l)=>n+Number(l.minutes||0),0);return {kind:'study-command',operation:'actual',date,eventIds,subject,all,minutes,logIds:logs.map(l=>l.id),signature:studyCommandFingerprint(day),summary:`${fmtDate(date)} · ${label} 실제 공부시간 ${dur(old)} → ${dur(minutes)}${minutes===0?' (초기화)':''} · ${eventIds.length}개 일정 / ${logs.length}개 시간 기록. 체크리스트는 유지됩니다.${minutes>0&&!logs.length?' 기록이 없어 첫 해당 일정에 반영합니다.':''}`}}
function applyStudyCommand(request){if(active){alert('진행 중인 타이머를 종료한 뒤 적용해주세요.');return false}const day=getDay(request.date);if(!day||request.signature!==studyCommandFingerprint(day)){alert('일정이나 기록이 바뀌었어요. 같은 요청을 다시 입력해주세요.');return false}const before=checkpointFeature();if(request.operation==='checklist'){const e=day.events.find(e=>e.id===request.eventId);if(!e)return false;e.items.push({id:id(),name:request.item,checked:false})}else{const ids=new Set(request.eventIds),logs=state.logs.filter(l=>request.logIds.includes(l.id));for(const log of logs){const found=findLogEvent(log).event;if(found){log.eventId=found.id;ids.add(found.id)}}if(request.minutes===0){state.logs=state.logs.filter(l=>!request.logIds.includes(l.id))}else if(logs.length){const total=logs.reduce((n,l)=>n+Number(l.minutes||0),0);let assigned=0;logs.forEach((l,i)=>{const value=i===logs.length-1?request.minutes-assigned:Math.floor(request.minutes*(total?Number(l.minutes)/total:1/logs.length));l.minutes=value;assigned+=value});state.logs=state.logs.filter(l=>!request.logIds.includes(l.id)||l.minutes>0)}else{const event=day.events.find(e=>request.eventIds.includes(e.id));if(!event)return false;state.logs.push({id:id(),eventId:event.id,name:event.name,kind:'study',subject:event.subject,date:day.date,minutes:request.minutes,at:new Date().toISOString(),manualCorrection:true})}for(const e of day.events.filter(e=>ids.has(e.id))){const remaining=state.logs.filter(l=>l.date===day.date&&l.eventId===e.id);const oldAuto=e.timerExtra===undefined?Math.max(0,Number(e.actual||0)-e.duration):Number(e.timerExtra);const manual=e.manualExtra===undefined?(Number(e.extra||0)>oldAuto?Number(e.extra||0):0):Number(e.manualExtra);e.actual=remaining.reduce((n,l)=>n+Number(l.minutes||0),0);e.done=remaining.length>0;e.timerExtra=Math.max(0,e.actual-e.duration);e.manualExtra=manual;e.extra=Math.max(manual,e.timerExtra);e.logs=remaining.map(l=>({minutes:l.minutes,at:l.at}))}}state.chat.push({role:'ai',text:'반영했어요.'+' '+request.sum function processLegacyChat(message){message=message.trim();if(!message)return;state.chat.push({role:'user',text:message});let subject=Object.keys(names).find(s=>message.includes(names[s]));let found=message.match(/(\d+)\s*분/);let n=found?Math.min(120,Number(found[1])):0;let reduce=/줄|빼|감소|축소/.test(message);let increase=/늘|추가|더|증가/.test(message);if(subject&&n&&(reduce||increase)){let delta=reduce?-n:n;state.pendingSuggestion={subject,subjectName:names[subject],delta};state.chat.push({role:'ai',text:`${names[subject]} 시간을 하루 ${n}분 ${reduce?'줄이는':'늘리는'} 수정안을 만들었어요.\n현재 3일 계획에 반영할까요? 오른쪽/아래의 ‘3일 계획에 적용’을 누르면 확정됩니다.\n\n※ 입력한 과목과 시간을 기준으로 만든 수정안입니다.`})}else if(/느려|오래|밀|시간 부족/.test(message)){state.pendingSuggestion=null;let o=state.days.flatMap(d=>d.events.filter(e=>e.extra>0).map(e=>({name:e.name,extra:e.extra}))).sort((a,b)=>b.extra-a.extra)[0];state.chat.push({role:'ai',text:o?`기록을 보면 ‘${o.name}’이 계획보다 ${o.extra}분 오래 걸렸어요.\n\n다음 계획에서는 이 블록에 여유시간을 추가하거나 하루 체크리스트 수를 줄이는 방향이 좋아요. “행정법 15분 늘려줘”처럼 요청하면 적용할 수 있어요.`:'시간이 자주 밀린다면 각 블록에 추가시간을 기록해보세요. 3일간 누적된 지연을 비교한 뒤 하루 목표를 낮추거나 시간을 옮기는 걸 추천해요.\n\n예: “행정학 20분 늘려줘”'})}else{state.pendingSuggestion=null;state.chat.push({role:'ai',text:'공부시간 수정 예시는 “영어 30분 늘려줘”, “국어 15분 줄여줘”처럼 과목·분량·방향을 함께 입력해주세요.\n\n개별 일정은 시간표의 수정 기능을 이용해주세요.'})}save();render()}
function newCycle(){if(!confirm('현재 3일 계획의 체크 기록을 보존하고 다음 3일 계획을 만들까요?'))return;if(active){alert('진행 중인 타이머를 먼저 종료해주세요.');return}for(const d of state.days)state.archivedDays[d.date]=JSON.parse(JSON.stringify(d));let nextStart=addDays(state.days[2].date,1);if(dateISO(new Date())>nextStart)nextStart=dateISO(new Date());let carry=state.days.flatMap(d=>d.events.filter(e=>e.kind==='study'&&!e.done&&!e.skipped)).slice(0,6);state.days=[0,1,2].map(i=>{let events=makeEvents(settingsForDate(addDays(nextStart,i)),i);if(i===0&&carry.length){let target=events.find(e=>e.kind==='study'&&e.subject==='english');target.items.push({id:id(),name:`이월 과제 확인: ${carry.map(e=>e.name).slice(0,3).join(', ')}`,checked:false})}const date=addDays(nextStart,i);return state.archivedDays[date]?JSON.parse(JSON.stringify(state.archivedDays[date])):{date,events,note:''}});state.dayStart=nextStart;state.cycle++;dayIndex=0;state.pendingSuggestion=null;applyRepeatRules(state.days);save();view='today';dateSummaryOpen=true;render()}

function createDailyCanvas(date){const {r,subjects}=getDailySummary(date),W=860,pad=52,usable=W-pad*2,canvas=document.createElement('canvas'),measure=canvas.getContext('2d'),ops=[];let y=52;const family='"Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';function font(size,weight){return `${weight} ${size}px ${family}`}function text(value,size=16,color='#38465b',weight=400,indent=0){measure.font=font(size,weight);const width=usable-indent,lines=[];for(const paragraph of String(value??'').split('\n')){let row='';for(const char of Array.from(paragraph)){if(row&&measure.measureText(row+char).width>width){lines.push(row);row=char}else row+=char}lines.push(row)}for(const row of lines){ops.push({type:'text',value:row,x:pad+indent,y:y+size,font:font(size,weight),color});y+=Math.ceil(size*1.65)}return lines.length}function gap(n){y+=n}function rule(){ops.push({type:'rule',y});y+=1}function heading(value){gap(22);text(value,21,'#26364f',700);gap(12)}text('공부루틴 · 날짜별 기록',17,'#6b7c99',600);gap(12);text(longDate(date),30,'#22314a',700);const day=getDay(date);if(day?.title){gap(6);text(day.title,18,'#64748c',500)}gap(20);rule();gap(18);text(`실제 공부  ${dur(r.actual)}     공부 완료  ${r.done}/${r.studies.length}`,19,'#30435f',600);text(`체크리스트  ${r.checked}/${r.items.length}`,17,'#64748c',500);heading('과목별 공부시간');const subjectBox={type:'box',x:pad-14,y:y-5,width:usable+28,height:0,color:'#eef1f8'};ops.push(subjectBox);gap(12);for(const subject of subjects){text(`${subject.name}    ${dur(subject.minutes)}`,16,'#465fa5',500,4)}gap(12);subjectBox.height=y-subjectBox.y;heading('하루 일정 · 체크리스트');if(!r.events.length)text('등록된 일정이 없습니다.',16,'#8993a2');for(const e of r.events){text(eventDisplayName(e.name),19,'#34435a',700);const actual=r.logs.filter(l=>l.eventId?l.eventId===e.id:findLogEvent(l).event?.id===e.id).reduce((n,l)=>n+Number(l.minutes||0),0)||e.actual||0;const status=e.skipped?'오늘은 하지 않음':e.done?'완료':'미완료';text(`${status}  ·  예정 ${clock(e.start)} / ${dur(e.duratio function pdfBytes(pages){const enc=new TextEncoder(),out=[];let total=0,offsets=[0];const push=x=>{out.push(x);total+=x.length};const ascii=s=>push(enc.encode(s));const bytes=b=>push(b);const W=595.28,H=841.89,M=30;ascii('%PDF-1.4\n');const objs=[];const add=o=>{objs.push(o);return objs.length};const catalog=add(null),pagesId=add(null);const pageRefs=[];for(const pg of pages){let imgId=add({type:'image',data:pg.bytes,width:pg.width,height:pg.height});let drawing=`q\n${(W-2*M).toFixed(2)} 0 0 ${(pg.height/pg.width*(W-2*M)).toFixed(2)} ${M} ${(H-M-pg.height/pg.width*(W-2*M)).toFixed(2)} cm\n/Im1 Do\nQ\n`;let contentId=add({type:'stream',data:enc.encode(drawing)});let pageId=add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im1 ${imgId} 0 R >> >> /Contents ${contentId} 0 R >>`);pageRefs.push(pageId)}objs[catalog-1]=`<< /Type /Catalog /Pages ${pagesId} 0 R >>`;objs[pagesId-1]=`<< /Type /Pages /Kids [${pageRefs.map(n=>`${n} 0 R`).join(' ')}] /Count ${pageRefs.length} >>`;for(let i=0;i<objs.length;i++){offsets.push(total);ascii(`${i+1} 0 obj\n`);let o=objs[i];if(typeof o==='string')ascii(o);else if(o.type==='image'){ascii(`<< /Type /XObject /Subtype /Image /Width ${o.width} /Height ${o.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${o.data.length} >>\nstream\n`);bytes(o.data);ascii('\nendstream')}else{ascii(`<< /Length ${o.data.length} >>\nstream\n`);bytes(o.data);ascii('\nendstream')}ascii('\nendobj\n')}let xref=total;ascii(`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`);for(let i=1;i<offsets.length;i++)ascii(`${String(offsets[i]).padStart(10,'0')} 00000 n \n`);ascii(`trailer\n<< /Size ${objs.length+1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`);return new Blob(out,{type:'application/pdf'})}
async function exportPdf(){try{if(document.fonts?.ready)await document.fonts.ready;let {canvas}=createPlannerCanvas(reportDate),width=canvas.width,usable=780,pixelPerPage=Math.floor(usable*width/(595.28-60)),pages=[];for(let y=0;y<canvas.height;y+=pixelPerPage){let height=Math.min(pixelPerPage,canvas.height-y),c=document.createElement('canvas');c.width=width;c.height=height;let ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.drawImage(canvas,0,y,width,height,0,0,width,height);const u=c.toDataURL('image/jpeg',.9),bin=atob(u.split(',')[1]),b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);pages.push({bytes:b,width,height})}downloadBlob(pdfBytes(pages),`공부루틴_${safeDateLabel(reportDate)}.pdf`)}catch(e){alert('PDF 내보내기에 실패했어요: '+e.message)}}

function ensureLogIds(){for(const log of state.logs||[])if(!log.id)log.id=id()}
function findLogEvent(log){const day=getDay(log.date);if(!day)return {day:null,event:null};if(log.eventId)return {day,event:day.events.find(e=>e.id===log.eventId)||null};let matches=day.events.filter(e=>e.name===log.name&&e.kind===log.kind);if(!matches.length&&log.kind==='break')matches=day.events.filter(e=>e.kind==='break'&&e.actual===log.minutes);return {day,event:matches.length===1?matches[0]:null}}

function changeLog(logId,newMinutes){if(active){alert('진행 중인 타이머를 종료한 뒤 기록을 수정해주세요.');return false}const log=state.logs.find(l=>l.id===logId);if(!log)return false;const n=newMinutes===null?null:Number(newMinutes);if(n!==null&&(!Number.isInteger(n)||n<1||n>1440))return false;if(!confirm(n===null?'이 시간 기록을 취소할까요? 연결된 일정은 남으며 누적시간과 자동 초과시간을 다시 계산합니다.':'실제 소요시간을 수정하고 연결된 일정을 다시 계산할까요?'))return false;const before=checkpointFeature(),{day,event}=findLogEvent(log);if(event){const linked=state.logs.filter(l=>l.eventId===event.id||(l.date===log.date&&findLogEvent(l).event?.id===event.id));for(const l of linked)l.eventId=event.id;const previousTotal=linked.reduce((sum,l)=>sum+Number(l.minutes||0),0);const oldAuto=event.timerExtra===undefined?Math.max(0,previousTotal-event.duration):Number(event.timerExtra||0);const manual=event.manualExtra===undefined?(Number(event.extra||0)>oldAuto?Number(event.extra||0):0):Number(event.manualExtra||0);if(n===null)state.logs=state.logs.filter(l=>l!==log);else log.minutes=n;const remaining=state.logs.filter(l=>l.eventId===event.id),total=remaining.reduce((sum,l)=>sum+Number(l.minutes||0),0);event.actual=total;event.done=remaining.length>0;event.logs=remaining.map(l=>({minutes:l.minutes,at:l.at}));event.manualExtra=manual;event.timerExtra=Math.max(0,total-event.duration);event.extra=Math.max(manual,event.timerExtra)}else{if(n===null)state.logs=state.logs.filter(l=>l!==log);else log.minutes=n}finishFeature(before,n===null?'시간 기록을 취소했어요.':'시간 기록을 수정했어요.');return true}
function freshEvent(template){const clean=JSON.parse(JSON.stringify(template));delete clean.repeatRuleId;delete clean.priority;return {...clean,id:id(),items:(template.items||[]).map(t=>({id:id(),name:t.name,checked:false})),done:false,skipped:false,actual:0,extra:0,manualExtra:0,timerExtra:0,logs:[]}}

function paintDday(){const b=document.getElementById('header-dday');if(!b)return;let host=b.parentElement.querySelector('.dday-list');if(!host){host=document.createElement('span');host.className='dday-list';b.before(host)}host.innerHTML=ddayItems().map(x=>{const n=ddayValue(x.date),label=n>0?'D-'+n:n===0?'D-DAY':'D+'+Math.abs(n);return '<button class="header-dday" data-action="configure-dday" data-id="'+x.id+'">'+esc(x.label||'목표일')+' <span aria-hidden="true">ㅣ</span> '+label+'</button>'}).join('');b.textContent='+ D-day';b.setAttribute('aria-label','D-day 추가')}
