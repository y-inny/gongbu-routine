function headerAction(act,ds={}){if(act==='toggle-account'){accountExpanded=!accountExpanded;paintAccount()}else if(act==='close-account'){accountExpanded=false;paintAccount()}else if(act==='configure-dday'){accountExpanded=false;paintAccount();ddayModal(ds.id)}else if(act==='clear-dday'){const p=ensurePlanner().profile;p.ddays=ddayItems().filter(x=>x.id!==ds.id);save();$('#modals').innerHTML='';render()}else return false;return true}
function headerSubmit(e){const form=e.target;if(form.getAttribute('id')!=='dday-form')return;e.preventDefault();const data=new FormData(form),date=String(data.get('target')||'');if(ddayValue(date)===null)return;const rows=ddayItems(),old=rows.find(x=>x.id===data.get('id')),row={id:old?.id||id(),date,label:String(data.get('label')||'').trim()};if(old)Object.assign(old,row);else rows.push(row);save();$('#modals').innerHTML='';render()}

function queueCloud(){if(!cloudUser)return;cloudDirty=true;try{localStorage.setItem(cloudMetaKey(),JSON.stringify({revision:cloudRevision,dirty:true}))}catch(e){}if(!cloudReady||cloudConflict)return;cloudStatus('기기에 저장됨 · 서버 저장 대기');clearTimeout(cloudTimer);cloudTimer=setTimeout(flushCloud,1000)}
async function flushCloud(){if(!cloudClient||!cloudUser||!cloudReady||cloudConflict||cloudBusy||!cloudDirty)return;cloudBusy=true;const uid=cloudUser.id, payload=JSON.stringify(state),rev=cloudRevision;cloudStatus('서버에 저장 중…');try{const data=JSON.parse(payload);let result=rev===0?await cloudClient.from('study_state').insert({user_id:uid,data,revision:1}).select('revision').single():await cloudClient.from('study_state').update({data,revision:rev+1}).eq('user_id',uid).eq('revision',rev).select('revision').maybeSingle();if(result.error){if(result.error.code==='23505')throw new Error('CONFLICT');throw result.error}if(!result.data)throw new Error('CONFLICT');cloudRevision=result.data.revision;cloudDirty=JSON.stringify(state)!==payload;localStorage.setItem(cloudMetaKey(),JSON.stringify({revision:cloudRevision,dirty:cloudDirty}));cloudStatus(cloudDirty?'추가 변경 저장 대기':'서버 저장 완료 · '+new Date().toLocaleTimeString('ko-KR'));}catch(e){if(e.message==='CONFLICT'){cloudConflict=true;cloudStatus('다른 기기에서 변경됐어요. 이 기기 기록은 유지 중 · 충돌 해결을 눌러주세요.')}else cloudStatus('서버 저장 실패 · 기기 기록 유지 중. 연결·DB 설정 확인 후 동기화해주세요.')}finally{cloudBusy=false;if(cloudDirty&&!cloudConflict)cloudTimer=setTimeout(flushCloud,15000)}}
function installStudy(s){if(!validStudy(s))throw Error('기록 형식을 확인할 수 없어요.');state=s;state.archivedDays=state.archivedDays||{};retireTimerSession(state);active=null;startedAt=null;pausedAt=null;held=0;dayIndex=Math.min(dayIndex,2);localStorage.setItem(storageKey(),JSON.stringify(state));render()}
async function hydrateUser(user){if(cloudLoading)return;cloudLoading=true;document.querySelector('.layout').inert=true;try{cloudReady=false;cloudUser=user;paintAccount();const saved=localStorage.getItem(storageKey());let local=saved?JSON.parse(saved):null,meta=JSON.parse(localStorage.getItem(cloudMetaKey())||'{}');const {data,error}=await cloudClient.from('study_state').select('data,revision').eq('user_id',user.id).maybeSingle();if(error)throw error;if(data){if(meta.dirty&&local){installStudy(local);cloudRevision=Number(meta.revision)||0;cloudDirty=true;if(cloudRevision!==data.revision){cloudConflict=true;cloudStatus('다른 기기의 변경과 미전송 기록이 있어요. 충돌 해결을 눌러주세요.')}}else{installStudy(data.data);cloudRevision=data.revision;cloudDirty=false;cloudStatus('서버 기록 불러옴 · 자동 저장 켜짐')}}else{cloudRevision=0;const guest=JSON.parse(localStorage.getItem(guestKey)||'null');if(local)installStudy(local);else if(validStudy(guest)&&confirm('이 브라우저의 기존 공부 기록을 로그인한 계정으로 옮길까요?'))installStudy(guest);else installStudy(createState());cloudDirty=true;cloudStatus('첫 계정 기록을 서버에 저장할 준비가 됐어요.')}cloudReady=true;if(cloudDirty&&!cloudConflict)await flushCloud();}catch(e){cloudReady=false;cloudStatus('계정 기록을 불러오지 못했어요. 아직 서버 연결이 완료되지 않았습니다.');}finally{cloudLoading=false;document.querySelector('.layout').inert=false;paintAccount()}}
function accountModal(){document.getElementById('modals').innerHTML=`<div class="modal-cover"><div class="modal"><h3>공부루틴 로그인</h3><p class="foot-note">Supabase 관리자 계정과 별개인 공부루틴 계정이에요.<br>모든 기기에서 같은 이메일로 로그인하세요.</p><form id="cloud-login-form"><div class="field" style="margin:16px 0"><label>이메일</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>비밀번호 (8자 이상)</label><input name="password" type="password" minlength="8" autocomplete="current-password" required></div><p id="cloud-auth-note" class="foot-note" role="status"></p><div class="controls"><button type="button" class="btn outline" data-action="close-modal">닫기</button><button class="btn outline" name="mode" value="signup">처음 가입</button><button class="btn" name="mode" value="login">로그인</button></div></form></div></div>`}
async function resolveCloud(){if(active){alert('타이머를 종료한 뒤 충돌을 해결해주세요.');return}exportData();if(!confirm('현재 기기 기록의 JSON 백업을 내려받았습니다. 서버의 최신 기록을 불러올까요? 이 기기의 미전송 변경은 백업 파일에 남고 자동 병합되지 않습니다.'))return;cloudBusy=true;try{const {data,error}=await cloudClient.from('study_state').select('data,revision').eq('user_id',cloudUser.id).single();if(error)throw error;installStudy(data.data);cloudRevision=data.revision;cloudDirty=false;cloudConflict=false;localStorage.setItem(cloudMetaKey(),JSON.stringify({revision:cloudRevision,dirty:false}));cloudStatus('서버 최신 기록 불러옴 · 기기 변경은 JSON 백업으로 보관');}catch(e){cloudStatus('불러오기 실패 · 기존 기기 기록 유지')}finally{cloudBusy=false}}
async function showCloudBackups(){const {data,error}=await cloudClient.from('study_backups').select('backup_day,created_at').eq('user_id',cloudUser.id).order('backup_day',{ascending:false}).limit(30);if(error){alert('자동 보관본을 불러오지 못했어요. DB 설정을 확인해주세요.');return}document.getElementById('modals').innerHTML=`<div class="modal-cover"><div class="modal"><h3>자동 보관본</h3><p class="foot-note">서버 기록을 수정하는 날, 첫 수정 직전 기록을 따로 보관해요.<br>아래 날짜를 누르면 복구용 JSON을 내려받습니다.</p><div class="controls" style="max-height:300px;overflow:auto;margin-top:14px">${data.length?data.map(b=>`<button class="btn outline small" data-cloud-backup="${esc(b.backup_day)}">${esc(b.backup_day)} JSON</button>`).join(''):'아직 보관본이 없어요.'}</div><div class="controls"><button class="btn outline" data-action="close-modal">닫기</button></div></div></div>`}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-cloud],[data-cloud-backup]');if(!b)return;if(b.dataset.cloudBackup){const {data,error}=await cloudClient.from('study_backups').select('data').eq('user_id',cloudUser.id).eq('backup_day',b.dataset.cloudBackup).single();if(error){alert('다운로드 실패');return}downloadBlob(new Blob([JSON.stringify(data.data,null,2)],{type:'application/json'}),'공부루틴_자동보관_'+b.dataset.cloudBackup+'.json');return}const action=b.dataset.cloud;if(action==='login'){if(!cloudClient){alert('로그인 모듈을 불러오는 중이거나 연결되지 않았어요. 인터넷 연결 후 새로고침해주세요.');return}accountModal()}else if(action==='retry'){if(!cloudReady)await hydrateUser(cloudUser);else if(cloudConflict)await resolveCloud();else if(cloudDirty)await flushCloud();else{if(active){cloudStatus('타이머 종료 후 다른 기기 기록을 불러올 수 있어요.');return}await hydrateUser(cloudUser)}}else if(action==='resolve')await resolveCloud();else if(action==='backups')await showCloudBackups();else if(action==='logout'){if(active){alert('진행 중인 타이머를 종료해주세요.');return}await flushCloud();if(cloudDirty){alert('미전송 기록이 있어요. 동기화 또는 충돌 해결 후 로그아웃해주세요.');return}const {error}=await cloudClient.auth.signOut({scope:'local'});if(error){cloudStatus('로그아웃 실패 · 다시 시도해주세요.');return}cloudUser=null;cloudReady=false;cloudRevision=0;cloudConflict=false;cloudDirty=false;installStudy(JSON.parse(localStorage.getItem(guestKey)||'null')||createState());cloudStatus('로그아웃됨 · 이 브라우저의 비로그인 기록')}});
document.addEventListener('submit',async e=>{if(e.target.getAttribute('id')!=='cloud-login-form')return;e.preventDefault();const f=e.target,form=new FormData(f),note=document.getElementById('cloud-auth-note'),mode=e.submitter?.value||'login';const email=String(form.get('email')).trim(),password=String(form.get('password'));for(const b of f.querySelectorAll('button'))b.disabled=true;note.textContent='처리 중…';try{const r=mode==='signup'?await cloudClient.auth.signUp({email,password,options:{emailRedirectTo:'https://y-inny.github.io/gongbu-routine/'}}):await cloudClient.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(r.data.session){document.getElementById('modals').innerHTML='';await hydrateUser(r.data.user)}else note.textContent='가입 확인 메일을 확인해주세요. 인증 후 같은 이메일과 비밀번호로 로그인하세요.';}catch(err){note.textContent='처리하지 못했어요: '+err.message}finally{for(const b of f.querySelectorAll('button'))b.disabled=false}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateClock()});
window.addEventListener('online',()=>{if(cloudUser){if(cloudReady)flushCloud();else hydrateUser(cloudUser)}});
window.addEventListener('beforeunload',e=>{if(cloudUser&&cloudDirty){e.preventDefault();e.returnValue=''}});
async function initCloud(){paintAccount();try{const lib=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');cloudClient=lib.createClient(cloudUrl,cloudKey);const {data,error}=await cloudClient.auth.getSession();if(error)throw error;if(data.session)await hydrateUser(data.session.user);cloudClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'&&cloudUser&&!cloudLoading){cloudReady=false;cloudStatus('로그인 세션이 종료됐어요. 다시 로그인해주세요.')}});}catch(e){cloudStatus('로그인 연결 실패 · 인터넷 연결 후 새로고침해주세요. 기기 저장은 계속됩니다.')}}


function saveNavigation(){try{localStorage.setItem(storageKey()+':view',JSON.stringify({view,plannerView,reportDate,dayIndex}))}catch(e){}}
function restoreNavigation(){try{const n=JSON.parse(localStorage.getItem(storageKey()+':view')||'null');if(!n)return;if(['today','report','settings'].includes(n.view))view=n.view;if(Object.hasOwn(plannerTabs,n.plannerView))plannerView=n.plannerView;if(/^\d{4}-\d{2}-\d{2}$/.test(n.reportDate||''))reportDate=n.reportDate;if(Number.isInteger(n.dayIndex)&&n.dayIndex>=0&&n.dayIndex<3&&!active)dayIndex=n.dayIndex}catch(e){}}


restoreNavigation();bind();render();tickHandle=setInterval(updateClock,30000);initCloud();
})();
</script></body></html>
